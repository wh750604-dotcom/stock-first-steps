window.COURSE = [
{id:1,phase:0,title:'先安排钱，再认识股票',sub:'确定学习目标与可承受的损失',minutes:35,goal:'能把生活用钱、备用金和可承担风险的钱分开。',body:`
<h2>先回答一个实际问题</h2><p>你有 30,000 元，半年后要交 20,000 元学费，日常备用金还需要 8,000 元。能拿来体验股票的钱最多只有剩下的 2,000 元；如果还有其他必需支出，可能一分钱也不该投入。股票账户里的钱会波动，卖出也未必能立即取回。</p>
<p><strong>投资</strong>是用今天的资金换取未来可能产生的回报，并承担结果不确定的风险。<strong>储蓄</strong>侧重资金保管和流动性；<strong>交易</strong>更强调买卖时点与价格变化。长期持有不自动等于投资，频繁操作也不自动意味着专业。</p>
<h2>用三个账户思考，不一定真的开三个账户</h2><ol><li><strong>已知支出：</strong>房租、学费、医疗、还款等，按实际日期留够。</li><li><strong>应急备用：</strong>收入突然中断仍能维持生活的钱。可用“必要月支出 × 能覆盖的月数”估算；月数取决于收入稳定性和家庭责任，不是统一规定。</li><li><strong>长期风险资金：</strong>短期不需动用，即使大幅缩水也不影响基本生活的部分。</li></ol>
<h2>风险承受能力，要用人民币表达</h2><p>“我能接受风险”太抽象。假设你准备投入 10,000 元，账户跌到 7,000 元时，会不会影响支出、睡眠或迫使你借款？若答案是会，就应缩小投入、降低权益比例或继续模拟。承受亏损的经济能力和心理意愿是两回事，按更弱的一项安排。</p>
<div class="case"><b>贯穿课程的学习者：小林（虚构）</b><p>小林把生活费和备用金留在课程之外，用 10,000 元<strong>模拟资金</strong>学习。第一目标不是每月赚多少，而是能解释买的是什么、算清费用、识别不能承受的损失、写下退出条件。本课程不替小林决定真实资金比例。</p></div>
<h2>第一天做一张资金说明书</h2><p>写下：资金用途、最早用钱日期、是否有借款、能承受的人民币损失、每周可投入的学习时间。若存在高成本债务、短期刚需或无法判断风险，先学习而不买入同样完成了当天任务。融资、期权、期货、杠杆 ETF 不属于这条新手路线。</p>
<p class="note">本课程是金融知识教育与模拟练习，不提供个性化荐股或收益保证。完成课程意味着具备基础判断流程，不意味着已能持续盈利。</p>`,task:'小林有 30,000 元，已知支出 20,000 元、备用金需求 8,000 元。写出理论剩余金额，并说明为什么这不是“必须投入金额”。',answer:'30,000−20,000−8,000＝2,000 元。还需检查其他责任、时间和承受能力；可以全部不投入。模拟学习无需真实资金。',quiz:{q:'半年后必须使用的钱，最适合如何处理？',options:['趁现在买股票，半年后卖出','先保证用途和可用性，不把它当作风险资金','买足够多只股票就不会亏'],correct:1,why:'分散投资不能保证半年后的本金，资金用途先于收益目标。'},refs:['allocation']},
{id:2,phase:0,title:'买股票，究竟买到了什么',sub:'用一家早餐店理解股权、市值和分红',minutes:40,goal:'能区分股价、市值、企业现金与股东收益。',body:`
<h2>从“晨光早餐店”开始</h2><p>假设一家店被分成 100 万份股权，每份是一股。你持有 1 万股，就拥有 1% 的股权。普通股代表公司所有权的一部分，通常包含按规则参与表决、分享分红等权利；它不是保证支付固定利息的借条。公司清算时，普通股股东在债权人之后获得剩余财产，可能没有剩余。</p>
<p>公司第一次发行股票募集资金，属于发行环节。你后来从另一个投资者手里买入已上市股票，多数情况下钱付给卖方，不是直接汇进公司经营账户。因此，股价今天跌 5%，不代表公司银行存款当天减少 5%。</p>
<h2>股价与市值，是单价与整家公司价格</h2><div class="formula">总市值 ＝ 每股价格 × 总股数</div><p>早餐店总股数 100 万股、每股 10 元，市值为 1,000 万元。甲公司股价 5 元、股数 100 亿股，市值 500 亿元；乙公司股价 50 元、股数 1 亿股，市值 50 亿元。不能凭“5 元比 50 元低”就说甲便宜。后面还要看每股利润和风险。</p>
<h2>赚钱有两个直接来源</h2><p>一是以更高价格卖出产生价差；二是公司决定发放的现金分红。公司盈利不等于全部分红，公司亏损时股价也可能因市场预期上涨。你的回报同时取决于经营结果、买入价格、卖出价格、分红和交易成本。</p>
<div class="case"><b>演示：分红不是多出一笔“免费钱”</b><p>假设持有 100 股，除息前每股 10 元，每股分红 0.50 元。忽略税费和市场变化，除息参考价约为 9.50 元：股票价值 950 元＋现金 50 元＝原来的 1,000 元。实际开盘和收盘价格仍由交易决定。</p></div>
<h2>另外三个经常出现的词</h2><p><strong>流通股</strong>是按相应规则可以在市场交易的股份，流通市值和总市值的口径可能不同。<strong>增发</strong>增加股数，如果利润没有同步增加，每股能分到的利润可能下降。<strong>回购</strong>是公司买回自身股份；是否注销、买入价格和资金来源决定它的影响，看到“回购”两个字不能直接认定利好。</p>
<p><strong>股票与债券：</strong>买股票承担经营剩余风险，回报不固定；买债券一般拥有约定本息的债权，但仍有违约与价格风险。银行存款、货币基金、债券基金、股票 ETF 也不是同一种东西。</p>`,task:'公司有 2 亿股，每股 12 元；你持有 1,000 股。算总市值、你的持股比例和持仓市值。',answer:'总市值 24 亿元；持股比例 1,000÷200,000,000＝0.0005%；持仓市值 12,000 元。持仓市值不等于卖出后净到手金额，尚有费用和成交价格变化。',quiz:{q:'两家公司股价分别为 5 元和 50 元，能直接判断谁便宜吗？',options:['5 元的便宜','50 元的更优质','不能，还需股数、利润、资产和风险'],correct:2,why:'单股价格缺少股数与经营能力的分母。'},refs:['investing','dividend']},
{id:3,phase:0,title:'价格为什么会涨跌',sub:'把公司表现、市场预期与成交区分开',minutes:35,goal:'能解释利好下跌、报价不成交和价格波动。',body:`
<h2>价格是成交结果，不是“正确答案”</h2><p>有人愿以 10.00 元卖出，有人愿以 9.99 元买入，双方还没谈拢。若买方改为愿付 10.00 元且有相应卖量，就可能成交。行情里的最新价通常是最近一笔成交价，不是市场保证你能买到或卖出的价格。</p>
<p><strong>买一</strong>是当前最高买价，<strong>卖一</strong>是当前最低卖价；两者差叫买卖价差。档位上的数量会随成交、撤单变化，也可能存在队列。你看到的截图只能说明那个时点的状态。</p>
<h2>企业变好，股票也可能下跌</h2><div class="case"><b>预期与实际</b><p>市场原本期待早餐公司今年利润增长 30%，结果只增长 10%。利润确实上升，但低于部分投资者预期，报价可能下降。反过来，一家公司亏损缩小，也可能因结果好于预期而上涨。这只是解释机制，不能凭新闻标题反推出唯一原因。</p></div>
<h2>三个层次共同影响价格</h2><ol><li><strong>经营：</strong>销量、价格、成本、竞争、现金回收改变未来赚钱能力。</li><li><strong>估值：</strong>即使利润相同，利率、风险偏好、增长信心变化，也会改变人们愿意付的倍数。</li><li><strong>短期交易：</strong>资金需求、集中买卖、流动性和情绪会影响某一时点的成交。</li></ol><p>价格上涨不能证明公司经营变好，价格下跌也不能自动证明“被低估”。先把事实和解释分开：事实是“公告写了什么、价格变了多少”；解释是“可能由于什么”，仍需证据。</p>
<h2>投资者实际要做什么</h2><p>每次看到消息，先写四句：发生了什么？影响收入、成本或现金的哪一项？是否已被普遍预期？影响有多大且能持续多久？答不出最后两句时，把它放入观察清单，比编一个确定性故事有用。</p>
<p><strong>牛市、熊市、震荡</strong>是对一段行情的描述，划分方法并不完全统一，不是精确开关。“大盘涨”往往指某个指数上涨，不等于所有股票都涨。<strong>成交量</strong>表示交易数量，<strong>成交额</strong>表示交易金额；成交活跃不等于价格未来必涨。</p>`,task:'某公司利润增长 15%，股价当天跌 4%。写出至少两种可能解释，以及验证它们需要的证据。',answer:'可能低于市场原先预期，需看此前业绩指引与可核实的预期；也可能估值回落或市场整体下跌，需对照行业、指数和利率等。还可能存在新风险。仅凭两项数据不能确定原因。',quiz:{q:'最新成交价是 10 元，是否保证现在能按 10 元买入？',options:['保证','不保证，要看卖盘、数量及订单规则','只有上午保证'],correct:1,why:'最新价是历史成交，当前可成交报价可能已变化。'},refs:['sse_rules']},
{id:4,phase:0,title:'先算明白赚亏，再谈收益率',sub:'总回报、复利、回撤与回本',minutes:45,goal:'能计算包含现金分红和费用的回报，理解涨跌不对称。',body:`
<h2>100 元利润，到底算赚得多吗</h2><p>投入 1,000 元赚 100 元是 10%；投入 10,000 元赚 100 元是 1%。比较收益前必须确认本金、时间、费用、分红、是否追加资金。只截一张“今日盈利”不能说明完整投资表现。</p>
<div class="formula">单次总收益 ＝ 卖出净所得 ＋ 持有期现金分红净额 − 买入总成本<br>收益率 ＝ 总收益 ÷ 买入总成本</div>
<div class="case"><b>完整算例</b><p>买入 100 股，每股 10 元，买入费用 5 元；每股收到税后分红 0.20 元；后来以 11 元卖出，卖出总费用 6 元。成本 1,005 元；净卖出款 1,094 元；分红 20 元；净收益 109 元；收益率 109÷1,005≈10.85%。这些费用为教学假设。</p></div>
<h2>涨跌不对称</h2><p>100 元先跌 20% 变 80 元，再涨 20% 只有 96 元。要从 80 回到 100，需要涨 25%。跌 50% 需要涨 100% 才回本；跌 80% 需要涨 400%。所以控制大损失比寻找一个漂亮的平均收益更重要。</p><div class="formula">亏损 d 后回本所需涨幅 ＝ d ÷ (1−d)，其中 0≤d&lt;1</div>
<h2>复利会放大收益，也会复合亏损</h2><p>假设每年回报都为 5%，且收益全部再投入，10,000 元两年后为 10,000×1.05²＝11,025 元。这是数学情境，不是股票每年能拿到 5% 的承诺。先涨 50% 再跌 50%，最终为本金的 75%，不能用算术平均的“0%”描述结果。</p>
<h2>回撤与年化</h2><p><strong>回撤</strong>是从此前净值高点下降的幅度。账户从 10,000 涨至 12,000，再跌到 9,000，虽然相对最初本金亏 10%，从高点的回撤却是 25%。<strong>年化回报</strong>把区间回报换算为一年可比的复合速度；短时间的年化尤其不能当作可持续预测。</p><p>无外部资金进出的多年年化可用 (期末资产÷期初资产)^(1÷年数)−1。中途有定投、转入转出时，直接套这个式子会失真；后面用带日期的现金流理解真实体验。比较基金时还要区分价格指数与包含分红的全收益指数。</p>`,task:'10,000 元先涨 10%，再跌 10%；另一账户从高点 20,000 跌至 15,000。分别算期末金额、回撤与回本涨幅。',answer:'第一账户 10,000×1.1×0.9＝9,900 元，亏 1%。第二账户回撤 25%，从 15,000 回到 20,000 要涨 33.33%。',quiz:{q:'下跌 30% 后需要上涨多少才能回到原值？',options:['30%','42.86%','60%'],correct:1,why:'剩余 70%，30÷70≈42.86%。'},tool:'loss',refs:['investing']},
{id:5,phase:1,title:'账户、券商与第一张交易清单',sub:'认识交易链条，练习操作前的核对',minutes:40,goal:'能区分证券账户、资金账户、银行账户与可用可取资金。',body:`
<h2>钱和股票分别在哪里</h2><p><strong>证券账户</strong>记录你名下的证券权益；<strong>券商资金账户</strong>用于证券交易资金的结算与显示；<strong>银行账户</strong>与资金账户之间通过银证转账划转资金。证券公司提供交易服务，交易所在规则下撮合买卖，中国结算等机构承担相应登记结算职责。App 是入口，不是这些职责本身。</p>
<h2>选券商，先核身份与服务</h2><p>从证监会、证券业协会等官方入口核对机构身份，再使用券商官网提供的官方 App。检查股票与 ETF 的佣金分别是多少、最低收费怎么约定、展示费率是否包括经手费等项目、是否另列过户费，以及客服和交易记录是否容易取得。不要只比较广告里的一个低数字。</p>
<p>开户通常涉及身份证件、本人银行卡、身份核验和风险测评；不同账户状态、年龄、产品权限有不同要求。风险测评如实回答，不为开通高风险权限而选择不符合自己的答案。主板股票、创业板、科创板、北交所等权限并非一概相同，具体适当性要求看券商当前流程。本课程先练普通沪深主板与普通股票 ETF。</p>
<h2>“可用”不等于“可取”</h2><p>卖出股票后，所得资金通常当天可用于证券交易，但一般要到下一交易日才可转出到银行；具体看结算与券商资金显示。周五卖出，遇正常周末不代表周六可取。下了未成交买单，部分资金也可能被冻结；撤单尚未成功时，不应把它当成已经释放。</p>
<div class="case"><b>订单生命周期</b><p>小林点击提交买入 → 券商接受申报 → 交易所受理 → 等待或部分成交 → 全部成交或撤单。<strong>已报不等于已成，撤单请求不等于已撤。</strong>如果只成交 100 股而申报 300 股，已成交部分不能通过撤单取消。</p></div>
<h2>每次提交前读一遍</h2><ol><li>证券全称与代码匹配吗？是股票、ETF，还是名称相似的其他产品？</li><li>方向是买入还是卖出？价格与数量对吗？预算含手续费吗？</li><li>账户有没有权限，产品有没有停牌、风险警示或特殊交易状态？</li><li>今天买入的部分何时能卖？订单的有效期和未成交部分如何处理？</li><li>交易后能否在成交记录与交割单中核对实际结果？</li></ol>
<p class="note">模拟网页只用于理解，不连接券商，也不会提交真实订单。验证码、密码和转账操作始终在本人确认的官方渠道完成。</p>`,task:'申报买入 300 股，状态显示已成交 100 股、余 200 股待成交。你申请撤单后应检查什么？',answer:'检查剩余 200 股是否显示已撤、资金是否释放；保留已经成交的 100 股记录。不能把撤单请求当作全部 300 股交易被取消。',quiz:{q:'证券卖出后“可用资金”增加，意味着一定可以立即转到银行吗？',options:['是','否，还要看可取资金和结算时间','只看银行卡余额'],correct:1,why:'可用和可取对应不同的资金状态。'},refs:['account','sse_rules']},
{id:6,phase:1,title:'A 股交易规则速查',sub:'按市场、板块和产品辨认规则',minutes:50,goal:'能判断T+1、申报单位、涨跌幅与交易时段的适用范围。',body:`
<h2>先确认自己买的属于哪一类</h2><p>A 股是境内发行、以人民币认购和交易的股票这一常用分类。沪深主板、科创板、创业板和北交所具有不同规则。ETF 是基金，不能因为也有六位代码，就套用全部股票规则。本课聚焦沪深普通主板股票与跟踪境内股票指数的普通 ETF。</p>
<div class="note"><strong>规则核对日：2026-10-26。</strong>沪深交易规则于 2026-07-06 实施新版。以下摘要要和具体证券状态一起使用；未来修改不自动更新到离线版本。</div>
<h2>T+1 与申报数量</h2><p>普通 A 股和普通境内股票 ETF，当天新买入的部分通常不能当天卖出，要到下一交易日。T 是交易日，不是自然日。如果原来持有可卖的旧仓，当天卖出旧仓不代表当天新买入的仓位获得了 T+0 权利。</p><p>沪深主板股票竞价买入一般按 100 股或其整数倍申报；卖出余额不足 100 股的部分，应按规则一次性申报。普通 ETF 二级市场买卖通常以 100 份或其整数倍申报。科创板股票通常最低 200 股，之后可按 1 股递增等，不能把“一手 100 股”应用到所有板块。</p>
<h2>涨跌幅不是损失保险</h2><p>沪深主板普通股票通常为 10%；现行主板风险警示股票也为 10%，不要照抄旧教材的 5%。科创板与创业板通常为 20%，其中风险警示股票也应按所在板块规则识别。北交所一般为 30%。沪深首次公开发行上市股票前 5 个交易日等特定情形可能无价格涨跌幅限制。ETF 的涨跌幅要看品种与适用规则，常见有 10% 和 20%。</p>
<p>涨停、跌停只是允许申报价的边界。跌停时没有足够买方，想卖也可能卖不出；连续多个交易日下跌会累计造成远大于一天限制的损失。价格还涉及最小变动单位和价格笼子等申报约束，离最新价很远的限价单也可能被拒绝。</p>
<h2>普通交易日的时间轴（北京时间）</h2><ul><li><strong>9:15–9:25：</strong>开盘集合竞价；其中 9:20–9:25 不接受撤单。</li><li><strong>9:30–11:30、13:00–14:57：</strong>连续竞价。</li><li><strong>14:57–15:00：</strong>收盘集合竞价，不接受撤单。</li><li><strong>15:05–15:30：</strong>符合规则的 A 股、ETF 盘后固定价格交易，按当日收盘价撮合，并非全天自由报价交易。具体品种状态、券商支持与申报安排需核对。</li></ul>
<p>集合竞价把一段时间内申报按规则集中确定成交价；连续竞价随申报进行撮合。9:25–9:30 的券商接单不等于交易所已即时成交。交易日排除休市日，不能按工作日历自行推断节假日交易安排。</p>
<h2>新手只需记住这一套动作</h2><p>打开证券详情，核对市场与类别 → 查看当日涨跌幅与可卖数量 → 用允许的申报数量和价格 → 成交后查成交记录。对照“规则”操作，比背一张把所有证券混在一起的表更可靠。</p>`,task:'周五买入普通境内股票 ETF，周末无交易。能否周五卖出这批新买份额？若下周一休市，最早哪天？',answer:'通常不能周五卖出新买份额；最早为下一个交易日，若周一休市且周二开市，则为周二。跨境、债券、黄金等 ETF 的部分品种有不同回转规则，不能混用。',quiz:{q:'跌停价到了，止损单是否必然成交？',options:['会，交易所有保底买方','不会，成交仍依赖对手方与队列','会，只要多点几次'],correct:1,why:'价格限制不提供流动性保证。'},refs:['sse_rules','szse_rules','sse_stock','etf_rules','bse_rules']},
{id:7,phase:1,title:'亲手走完一笔限价买卖',sub:'报价、盘口、部分成交与滑点',minutes:45,goal:'能解释限价单成交逻辑，识别成交价格与数量的不确定性。',body:`
<h2>限价单约束价格，不保证成交</h2><p>买入限价 10.02 元，表示你接受以不高于 10.02 元的价格买入；卖出限价 10.02 元，表示你接受以不低于 10.02 元的价格卖出。它不是“必须以恰好 10.02 元成交”。市价类订单更重视迅速匹配，但具体类型、保护限价和可用时段不同，新手先用限价理解全过程。</p>
<div class="case"><b>冻结盘口演示，实际行情会变化</b><p>卖一：10.00 元、200 股；卖二：10.01 元、300 股；卖三：10.03 元、500 股。小林发出限价 10.01 元、数量 400 股的买单。假设没有其他订单抢先，也没有撤单，成交可能是 200 股×10.00＋200 股×10.01＝4,002 元，平均价为 10.005 元。单笔成交价仍遵守报价最小单位，平均成本可以出现更多小数。</p><p>如果小林发出 600 股的买单，现有 10.01 元及以下卖量只有 500 股；剩余 100 股可能继续排队，不能自动按 10.03 元购买。</p></div>
<h2>为什么“我明明看见那个价”却没成交</h2><p>行情到达你屏幕、你提交订单、订单到达交易所需要时间。卖量可能已经被买走，也可能撤单。通常按价格优先、同价时间优先等规则撮合，你的单子还有排队顺序。买一卖一大额挂单不能证明某个神秘资金一定会维持价格。</p>
<h2>买卖价差与滑点</h2><p>假设买一 0.999、卖一 1.001，你立即买入再立即卖出，在报价不变且足量的简化情境下，仅价差就损失 0.002÷1.001≈0.20%，还没有算佣金。<strong>滑点</strong>是你预期的执行价格与实际成交价格的差异；在流动性不足或快速波动时可能更大。</p>
<h2>从申报到复盘的五步</h2><ol><li>确认价格、数量、资金是否足够，预留费用。</li><li>提交一次后查看订单状态，不因短暂等待重复点击。</li><li>部分成交时先核对实际成交，不盲目补发完整订单。</li><li>取消未成交部分后，等待撤单确认再决定是否重报。</li><li>成交后记录平均价、总金额、费用和未成交数量。</li></ol><p>本课使用冻结盘口教机制，不模拟真实市场队列。真实操作还须遵守前一章的时段、涨跌幅与申报约束。</p>`,task:'仍用上述盘口，限价 10.00 元买入 300 股。在盘口不变、没有竞争订单时，能立即买到多少股？余单怎么办？',answer:'只能立即买到 200 股，金额 2,000 元。剩余 100 股按订单规则等待，不会跨越限价去买 10.01 元。若希望取消余单，需要成功撤单。',quiz:{q:'买入限价 10.01 元的含义是？',options:['一定按10.01成交','可按不高于10.01的价格成交，也可能不成交','可以自动提高到10.03'],correct:1,why:'限价限制最差可接受价格，不保证数量和成交时间。'},refs:['sse_rules']},
{id:8,phase:1,title:'交易成本：小金额最容易算漏',sub:'佣金、印花税、过户费与真实盈亏',minutes:50,goal:'能独立复算股票及ETF的一次往返交易成本。',body:`
<h2>先区分收费项目</h2><p><strong>佣金：</strong>按与券商约定的费率与最低收费计算，股票和 ETF 的约定可能不同。常见报价“万分之二点五”即 0.025%，不是 2.5%。<strong>证券交易印花税：</strong>当前 A 股卖出环节有效税率为成交金额的 0.05%；买入不收。<strong>股票过户费：</strong>现行 A 股按成交金额 0.001% 双向收取。ETF 二级市场交易通常不征收股票交易印花税，也不按 A 股过户费模型计费。</p>
<p>券商报价可能包含经手费、证管费等项目，也可能单列。务必用交割单核对，不能把已包含的项目再加一次。此处以“佣金包含常规交易规费、股票过户费另列”的模型教学；不同账户合同与收费口径可能不同。</p>
<div class="case"><b>股票往返：10 元买 1,000 股，11 元卖出</b><p>教学假设：佣金万 2.5、每笔最低 5 元；无分红，无其他费用，分别视为一笔完整委托。</p><ol><li>买入金额 10,000；佣金 max(2.50,5)＝5；过户费 0.10；总成本 <strong>10,005.10 元</strong>。</li><li>卖出金额 11,000；佣金 5；印花税 5.50；过户费 0.11；净所得 <strong>10,989.39 元</strong>。</li><li>净利润 <strong>984.29 元</strong>，收益率约 <strong>9.84%</strong>，少于裸价差的 10%。</li></ol></div>
<h2>为什么小单频繁买卖贵</h2><p>如果每笔最低佣金为 5 元，1,000 元交易的单边佣金就是 0.5%；买卖各一次仅佣金就接近 1%。这不是推荐把订单做大，而是提醒用足够的模拟练习避免为操作冲动付费。ETF 是否有最低收费、费率是否相同必须问清，不能默认所谓“免五”。</p>
<h2>ETF 还有持有成本</h2><p>管理费、托管费等通常在基金资产中按规则计提，体现在净值里；你一般不会每天收到一张扣费账单。比较基金净值表现时，它通常已反映相关费用，不应再次机械扣同一笔年费。买卖佣金、价差和溢折价仍是另一层成本。</p>
<h2>交割单怎么核对</h2><p>逐项检查交易日期、证券、方向、成交数量、成交均价、成交金额、佣金、印花税、过户费及资金发生额。分笔成交如何汇总收费按券商规则核实。计算器是估算，实际收费、四舍五入与结算结果以账户交割单为准。</p>`,task:'假设一只普通 ETF 以 2 元买 1,000 份，2.10 元卖出；佣金买卖各5元，无其他费用。净赚多少？',answer:'买入总成本 2,005 元；卖出净额 2,095 元；净赚 90 元；收益率 90÷2,005≈4.49%。没有按股票模型额外征印花税或过户费。',quiz:{q:'股票卖出印花税0.05%，卖出金额10,000元，税额是多少？',options:['0.5元','5元','50元'],correct:1,why:'10,000×0.0005＝5元。费率百分数与小数换算容易错。'},tool:'fees',refs:['stamp','transfer','etf_fee']},
];

{id:9,phase:2,title:'看懂行情页，停止猜测图形',sub:'K线、成交量、复权与常见误读',minutes:40,goal:'能从行情中读出事实，而不把技术图形当作预测保证。',body:`
<h2>一根 K 线只有四个价格</h2><p>日 K 线概括一个交易日的开盘、最高、最低、收盘。实体表示开盘与收盘的区间，上下影线表示期间触及的极值。颜色按软件设置辨认，不能靠红绿本身判断涨跌。日 K 是一天，周 K 是一周；不同周期回答不同问题。</p>
<div class="case"><b>亲手读一根线</b><p>开盘 10.00、最高 10.80、最低 9.70、收盘 10.40。实体范围 10.00–10.40，上影 0.40，下影 0.30；收盘高于开盘 4%。但若前一交易日收盘是 10.60，当日相对昨收反而下跌约 1.89%。所以“阳线”不一定意味着相对昨收上涨。</p></div>
<h2>三个辅助数字</h2><p><strong>成交量：</strong>交易数量，单位可能是股、手或份，必须看标注。<strong>换手率：</strong>成交数量相对某个流通股本口径的比例，不同软件分母可能不同。<strong>振幅：</strong>常用当日最高与最低价差除以前收盘价。它们描述活跃度和波动，不证明买方一定比卖方“更聪明”。每一笔成交都有买方和卖方。</p>
<h2>均线只是平滑过的过去价格</h2><p>5 日简单移动平均线把最近 5 个收盘价加总除以 5。假设分别为 10、11、10、12、12，均线是 11。它能帮你描述过去趋势，但必然滞后。“金叉”“放量突破”即使定义清楚，也不能单凭名称保证获利，需要包含成本、样本外验证和失败情境；本课不把这些图形当买卖秘诀。</p>
<h2>除权除息与复权</h2><p>分红、送股会使价格出现机械调整。若每股分红 0.50 元，原 10 元附近的股价出现相应调整，不应直接当作经营突然恶化。<strong>不复权</strong>保留历史真实报价；<strong>前复权、后复权</strong>按各自方法调整历史序列以便比较，显示价格可能并非当日可成交价。分析同一趋势必须使用一致口径。</p>
<h2>一分钟读行情的顺序</h2><ol><li>核对证券名称、代码、产品类型和是否停牌。</li><li>读现价、涨跌幅的比较基准，确认数据时间。</li><li>看买卖报价与数量，估计交易摩擦。</li><li>看所选时间范围与复权口径，不从局部截图推断长期表现。</li><li>把经营判断留给财报和公告，把图形当作描述工具。</li></ol>
<p>如果看到“主力净流入”，先看数据商如何按成交方向、单笔大小分类；它通常不是实名投资者资金流向，也不能单独识别所谓主力意图。</p>`,task:'某股昨收20，今开19.5、最高20.3、最低19.2、收盘19.8。它收阳还是收阴？相对昨收涨跌多少？',answer:'收盘高于开盘，按通常定义为阳线；相对昨收为19.8÷20−1＝−1%。这说明K线实体方向和日涨跌幅的参照不同。',quiz:{q:'均线向上意味着什么？',options:['明天必涨','所用历史价格的平滑趋势向上','公司利润一定增长'],correct:1,why:'均线从过去价格计算，不能单独保证未来或证明基本面。'},refs:['sse_rules']},
{id:10,phase:2,title:'指数：给一篮子股票做温度计',sub:'理解宽基、行业、权重与分红口径',minutes:45,goal:'能解释指数与基金的区别，并识别重复和集中暴露。',body:`
<h2>指数是一套规则和计算结果</h2><p>指数制定选样、权重和调整规则，然后把一组证券的变动汇总成一个数字。你不能直接买一串“指数点数”，通常通过跟踪它的基金获得类似的市场暴露。指数上涨 1%，不代表每只成份股都上涨 1%。</p>
<div class="case"><b>三个成份的虚构指数</b><p>甲权重50%、乙30%、丙20%；当天收益分别为+2%、−1%、0%。在权重不变的简化情境下，指数收益≈50%×2%＋30%×(−1%)＋20%×0%＝<strong>0.7%</strong>。最大的成份对结果影响更大。</p></div>
<h2>真实例子：沪深 300</h2><p>中证指数公司的沪深 300 指数选择沪深市场中规模大、流动性好的 300 只证券作为样本，旨在反映其整体表现。它按编制方案选样与加权，不是“每只买三百分之一”，也不是挑出未来最能涨的 300 只。样本会调整，今天的名单不能拿来无偏地回算过去。</p>
<h2>宽基、行业和主题</h2><p><strong>宽基指数</strong>通常覆盖较多行业，但仍可能集中于某些大公司、风格或单一国家。<strong>行业指数</strong>聚焦银行、医药等特定行业。<strong>主题指数</strong>按某个主题选择公司，可能横跨行业，选样定义尤其重要。“新能源”“高股息”等名字不告诉你完整风险。</p><p>不同指数可能覆盖大盘、中盘、小盘公司，或偏价值、成长等特征。小市值不自动等于高成长，高股息不自动等于低风险。要看实际成份和权重，而不是根据名称贴标签。</p>
<h2>价格指数与全收益指数</h2><p>价格指数通常不把成份股分红按再投资方式全部计入；全收益指数考虑分红再投资。若基金收益中已经包含分红，却拿来对比未计分红的价格指数，可能夸大基金的相对表现。指数基点是计算起点，3,000 点不天然比4,000点便宜，也无法在不同指数之间比较贵贱。</p>
<h2>看懂一页指数资料</h2><p>依次读编制目标、样本空间、选样规则、加权方式、调整频率、前十大成份、行业权重和收益口径。真正需要回答的是：“我暴露在什么经营风险里？”同时买两只高度重叠的宽基 ETF，可能只是把同一篮子重复买了两遍。</p>`,task:'指数甲含某行业40%，你又买一只100%投该行业的基金，二者各占组合一半。该行业合计暴露多少？',answer:'50%×40%＋50%×100%＝70%。持有两个基金不等于风险均匀分散。',quiz:{q:'不同指数的3000点和5000点，能直接比较哪个便宜吗？',options:['可以，3000点更便宜','不能，基点与构成不同','5000点说明回报更高'],correct:1,why:'指数点位不是跨指数可比的估值。'},refs:['csi300','allocation']},
{id:11,phase:2,title:'ETF：买入一篮子资产的入口',sub:'净值、交易价格、申赎与溢价',minutes:50,goal:'能区分ETF市场价与净值，计算溢价消失的损失。',body:`
<h2>ETF 的两个层面</h2><p>ETF 是交易型开放式基金，普通投资者可以在交易所买卖基金份额。本课程主要讲<strong>跟踪境内股票指数的 ETF</strong>：基金依合同持有组合并力求实现跟踪目标。ETF 这个交易结构本身不保证低风险，也不意味着所有 ETF 都是被动产品；2026 年已出现主动 ETF 获批进展。</p>
<p><strong>二级市场买卖</strong>是你与其他参与者交易份额，像买卖股票一样看报价。<strong>一级市场申购赎回</strong>是按基金要求，用一篮子证券或现金等与基金交换份额，门槛和细节不同。新手在券商里输入几百份买单通常是前者，不要误以为能按净值无限申赎套利。</p>
<h2>三个价格不要混在一起</h2><ul><li><strong>基金份额净值：</strong>基金资产扣负债后，平均到每一份的价值，按披露规则计算。</li><li><strong>市场价格：</strong>交易所里实际买卖形成的价格，可以偏离净值。</li><li><strong>IOPV：</strong>盘中参考净值估算，是参考，不是保证可成交或可兑付的报价。</li></ul>
<div class="formula">参考溢价率 ＝ 市场价格 ÷ 可比参考净值 − 1</div>
<div class="case"><b>底层没跌，为什么我亏了？</b><p>参考净值1.00元，你以1.10元买入，溢价10%。之后净值仍为1.00元，但市场价回到1.00元，你的价格损失是(1−1.10)÷1.10＝<strong>−9.09%</strong>。这来自溢价回落，尚未计算交易费。</p></div>
<h2>为什么套利不能保证价格永远贴住净值</h2><p>申赎机制通常有助于约束偏离，但参与者受成本、资金、申赎额度、证券停牌、市场时差等影响。跨境 ETF 的境外市场可能尚未开盘，IOPV 会使用较旧价格；汇率也在变化。看到一个溢价数字，先确认时点、估值来源和申赎状态，不直接把它当可获利机会。</p>
<h2>分红、T+1 和风险</h2><p>成份股分红先成为基金资产的一部分；基金是否向份额持有人分红要按合同和公告。每份净值2元、分红0.10元，其他条件不变时净值约降至1.90元，财富没有凭空增加。普通境内股票 ETF 二级买入通常 T+1；黄金、债券、货币和符合条件的跨境等品种可能有不同回转安排。</p><p>ETF 仍会遭遇底层资产下跌、集中风险、跟踪偏离、交易流动性不足及清盘等风险。清盘不是基金净值必然归零，但可能迫使你在不合适时间结束持仓，并经历清算过程。</p>`,task:'同一时点估计净值2.00、市场价2.06；随后净值不变而价格回到2.00。算溢价和价格损失。',answer:'溢价=2.06÷2−1=3%；买入后的损失=2÷2.06−1≈−2.91%，尚未扣费。净值/IOPV本身还可能存在时点误差。',quiz:{q:'IOPV 最合适的理解是？',options:['保证能卖出的价格','盘中参考估值，可能有时差或误差','明日收盘价预测'],correct:1,why:'参考估值与可成交的盘口价格不是一回事。'},tool:'premium',refs:['etf_rules','premium','active_etf','etf_dividend']},
{id:12,phase:2,title:'怎样比较两只同类 ETF',sub:'一张能实际使用的筛选清单',minutes:45,goal:'能把指数、费率、跟踪表现和交易成本放在同一张判断表里。',body:`
<h2>第一步先选风险暴露，再比较产品</h2><p>两只基金只有在跟踪目标、收益口径等可比时，费率比较才有意义。宽基 ETF 和半导体主题 ETF 即使都叫“ETF”，风险结构差别很大。先解释指数包含什么，再问哪只实现这个目标更合适。</p>
<h2>六项实用检查</h2><ol><li><strong>跟踪对象：</strong>指数全称和代码、成份与行业集中度。</li><li><strong>持有成本：</strong>管理费、托管费及其他披露费用，检查生效日期。</li><li><strong>跟踪表现：</strong>同一时期、同一收益口径下与基准差多少。</li><li><strong>交易质量：</strong>买卖价差、足量盘口、实际成交活跃度和溢折价。</li><li><strong>规模与运营：</strong>基金规模、存续情况、清盘条款与申赎是否受限。</li><li><strong>个人执行：</strong>券商 ETF 佣金、最低收费、计划金额与买卖频率。</li></ol>
<h2>跟踪差异与跟踪误差</h2><p>教学中定义<strong>跟踪差异＝基金区间回报−基准区间回报</strong>，要在具体资料中确认符号口径。例如基准涨10%，基金涨9.6%，差异−0.4个百分点。<strong>跟踪误差</strong>描述基金与基准回报差在各期的波动，常用统计指标计算。长期略落后但很稳定，与时而大赢时而大输，是不同情况。</p>
<div class="case"><b>同一指数的虚构产品 A / B</b><p>A：管理+托管年费合计0.20%，典型价差0.10%；B：年费0.15%，典型价差0.50%。假设持有10,000元一年且资产规模不变，B的年费优势约5元；但一次额外0.40个百分点的交易摩擦就是40元。真实价差会变化，不能用一张截图得出永久结论。</p><p>若你持有很多年、交易次数很少，年费的重要性会提升；若订单很小，最低佣金可能成为主要成本。没有一个排序能适合所有金额和期限。</p></div>
<h2>ETF、ETF 联接与场外指数基金</h2><p>ETF 通过证券账户在交易所按市价买卖，通常存在份额单位和交易费用。联接基金主要投资目标 ETF；场外指数基金按相应申赎安排、以基金净值确认，存在确认和到账时间差。A/C份额收费结构可能不同，不能只看字母就决定。比较实际金额、持有期、费用和便利性，而不是争论某一种永远更好。</p>
<h2>避开三个“看起来很简单”的错误</h2><p>不因为每份1元就比每份4元更便宜；不按去年涨幅榜直接选冠军；不把“规模最大”当作不存在风险。实际产品资料可能更新，决策前至少核对最新产品资料概要、招募说明书更新和近期公告。</p>`,task:'A与B同指数，你只知道B年费低0.05个百分点。还需要哪三类资料才能判断？',answer:'至少需要实际可成交价差/盘口与溢价、同口径跟踪表现、券商佣金及计划持有金额和期限；还应看规模和最新公告。单看年费不足以决定。',quiz:{q:'跟踪差异−0.4个百分点意味着？',options:['基金一定亏0.4%','在定义口径下基金回报比基准低0.4个百分点','基金明天会补涨'],correct:1,why:'相对落后不等于绝对亏损，也不存在自动补涨保证。'},refs:['etf_fee','premium','allocation']},
{id:13,phase:3,title:'从生意看公司，不从故事选股',sub:'收入、成本、竞争优势与增长的代价',minutes:45,goal:'能用五句话说明一家公司如何赚钱及最脆弱的环节。',body:`
<h2>先不看股价，描述生意</h2><p>买个股意味着承担一家具体企业的风险。先回答：卖什么、卖给谁、为什么客户选它、钱何时收回、什么会破坏利润。若只有“国家支持”“人工智能风口”“品牌很好”，仍未回答实际赚钱的过程。</p>
<div class="case"><b>晨光早餐公司（虚构）</b><p>去年售出100万份早餐，平均每份10元，收入1,000万元；食材和直接制作成本600万元，毛利400万元；其他经营费用、税费等合计300万元，净利润100万元。这里各项为教学简化，实际报表分类更细。</p><p>今年销量仍100万份，平均价格升至11元，但成本升至660万元，其他合计340万元。收入1,100万元，净利润仍100万元。<strong>收入增长10%并没有带来利润增长。</strong></p></div>
<h2>增长从哪里来</h2><p>收入大致可拆成销量×价格；多产品公司还受结构变化影响。利润增长可能来自收入增长、单位成本下降、费用率下降，也可能来自卖资产等非经常项目。开新店带来收入增长，但需要装修和租金；收入不代表现金及时进账。</p>
<h2>竞争优势要有可观察证据</h2><p>品牌可能支持较强定价能力，规模可能摊薄成本，转换成本可能让客户不易离开。但“有护城河”不是结论，应转成证据：提价后销量是否保持、客户流失率如何、竞争者能否复制、毛利率是否稳定、获取客户是否越来越贵。</p>
<h2>识别周期与集中风险</h2><p>有些行业的价格和利润随供需周期大幅波动。景气高峰的利润可能让 PE 看起来非常低，却未必便宜。依赖一个大客户、一种原材料或单一地区的公司，可能在某个环节变化后迅速失去利润。竞争优势和脆弱点要同时记录。</p>
<h2>实用五句话模板</h2><ol><li>公司向谁出售什么，通过什么渠道收钱。</li><li>过去收入变化主要由销量、价格还是业务结构推动。</li><li>最重要的成本是什么，能否向客户转嫁。</li><li>与竞争者相比，有哪些能被数据检验的优势。</li><li>出现哪一项变化会使我的判断失效。</li></ol><p>这份描述先于估值。无法说清业务时，改用分散的指数方案进行学习，或继续观察，并不比强行写出“看好”差。</p>`,task:'早餐公司销量增长20%，均价下降10%。收入大约增长多少？能否据此说利润也增长？',answer:'收入倍率1.2×0.9=1.08，即增长8%。不能推断利润；还需食材、人工、租金、费用和税等信息。',quiz:{q:'哪一项更能检验“定价能力强”？',options:['名字听起来高端','提价后销量、客户留存和利润率的实际变化','股吧里很多人看好'],correct:1,why:'要用经营数据检验优势，而不是用印象。'},refs:[]},
{id:14,phase:3,title:'三张财报：利润不是现金',sub:'利润表、资产负债表、现金流量表',minutes:60,goal:'能读取关键财务指标，并发现需要进一步核对的异常。',body:`
<h2>三张表回答三个问题</h2><p><strong>利润表：</strong>一段时间收入、成本和利润怎么样。<strong>资产负债表：</strong>某个时点有什么资产、欠多少债、股东剩多少权益。<strong>现金流量表：</strong>一段时间钱从哪里来、到哪里去。前者和后者是期间，资产负债表是时点，不能把季末余额当作一季度收入。</p>
<div class="formula">资产 ＝ 负债 ＋ 所有者权益</div><p>资产包含现金、应收账款、存货、设备等；负债包含借款、应付款等；权益是会计意义上的剩余。账面价值不保证能按该价格全部变现，存货可能滞销，应收可能收不回。</p>
<h2>先抓七个指标</h2><ul><li><strong>营业收入：</strong>卖出的业务规模。</li><li><strong>毛利率：</strong>(营业收入−营业成本)÷营业收入，观察产品和直接成本关系。</li><li><strong>归母净利润：</strong>归属于母公司股东的利润，与整个集团净利润区分。</li><li><strong>扣非归母净利润：</strong>剔除规定的非经常损益后看经营，但不等于完美“真实利润”。</li><li><strong>经营现金流净额：</strong>经营活动实际产生的净现金。</li><li><strong>有息负债与现金：</strong>同时看到期日、受限资金，不能只看总量。</li><li><strong>ROE：</strong>利润相对净资产的回报，正式口径可能为加权平均；高杠杆也可能推高它。</li></ul>
<div class="case"><b>赚了100万元，却只有20万元现金</b><p>虚构公司本期确认收入1,000万元、净利润100万元，但客户赊账使应收增加80万元。在其他项目不变的极简条件下，经营现金净流入可能只有20万元。利润确认在先、收钱在后，不能说其余80万元已躺在银行。</p></div>
<h2>异常不是定罪，而是查证线索</h2><p>收入增长20%、应收增长80%，要看账期、客户、坏账准备与回款；存货持续快于销售增长，要看跌价和滞销；利润来自一次性卖资产，要看扣非与现金到账。单一比率不够判断财务造假，需要读附注和审计意见，并承认外部投资者的信息限制。</p>
<h2>怎么读才省时间</h2><ol><li>确认报告期、单位（元/万元/亿元）、合并口径、是否重述。</li><li>从主要财务数据看三年变化，不只看单年。</li><li>看经营讨论解释变化，再去报表附注找对应证据。</li><li>查看审计意见、关联交易、担保、受限资金与债务到期。</li><li>把不知道的项目记成问题，不用猜测补全。</li></ol><p>同比比较去年同一期间；环比比较上一相邻期间。不要用旺季季度和淡季季度简单断言趋势，也不要把半年利润乘2当作可靠全年预测。银行等金融企业要用适合行业的指标，不能机械套制造业模板。</p>`,task:'公司资产500万元、负债300万元、全年净利润30万元，期初期末权益都为200万元。简化ROE是多少？负债增加能否让ROE看起来更高？',answer:'权益500−300=200万元，简化ROE=30÷200=15%。在其他条件下，更小权益基数或更多杠杆可能推高ROE，因此不能单看高ROE就认定经营更安全。',quiz:{q:'利润很高但经营现金流长期偏弱，首先应？',options:['直接断定造假','检查应收、存货、收付时点和业务特征','忽略，利润够高就行'],correct:1,why:'差异是分析入口，需要用附注与持续数据解释。'},refs:['report']},
{id:15,phase:3,title:'估值：好公司也可能买贵',sub:'PE、PB、股息率与情景估算',minutes:60,goal:'能算基础估值，知道分母失真与估值回落的影响。',body:`
<h2>价格必须配一个“买到了多少”</h2><p>同样20元一股，每股每年赚1元和赚2元，含义不同。<strong>每股收益EPS</strong>是按相应会计口径把归属于普通股股东的利润分摊到股份；实际基本/稀释EPS有加权股数等细节。入门先理解：每一股对应多少利润，而不是它一定分给你多少现金。</p>
<div class="formula">PE（市盈率）＝ 股价 ÷ EPS<br>PB（市净率）＝ 股价 ÷ 每股净资产<br>历史股息率 ＝ 过去某期间每股现金分红 ÷ 当前股价</div>
<p><strong>静态PE</strong>常用上一完整年度利润，<strong>TTM PE</strong>常用最近滚动12个月利润，<strong>预测PE</strong>用未来预测利润。分母不同，数值不能混比。亏损或极低利润下PE可能没有正常比较意义；不能把负PE理解为“超级便宜”。</p>
<div class="case"><b>盈利增长，但估值压缩</b><p>早餐公司EPS为1元，市场愿意付20倍PE，股价20元。下一年EPS增长20%到1.20元，但市场只给15倍，情景价格变成18元。忽略分红，投资者仍损失10%。企业增长与投资回报之间隔着买入估值与退出估值。</p></div>
<h2>做区间，不制造精确目标价</h2><p>假设下一年EPS可能为0.8、1.0、1.2元；你用12、15、18倍来观察敏感性，得到一组可能价格。这些倍数是教学假设，不是市场应当给出的“标准”。判断倍数至少需要考虑利润可持续性、增长、竞争、负债、利率与同业差异。</p>
<p>周期公司高峰利润可能压低PE；重资产企业PB要结合资产质量与ROE；轻资产企业账面资产较少，PB可比性可能弱。股息率高可能源于价格下跌，未来分红也可能减少。任何单个指标都不能替代业务分析。</p>
<h2>折现的直觉与安全余量</h2><p>如果一年后确定能拿到100元，假设你要求5%的年回报，今天对应价值是100÷1.05≈95.24元。企业未来现金既不确定，又跨越多年，折现率和增长假设稍变，结果可能很不一样。所谓安全余量，是为估计错误留下空间，不是给某个价格贴上绝对安全标签。</p><p>实用做法：写悲观、基准、乐观三种经营情境，明确每个数字从何而来，再看当前价格是否已经要求乐观情境才能成立。无法合理估计时，结论可以是“暂不参与”。</p>`,task:'EPS从2元变2.2元，PE从20倍降到16倍。价格从多少变多少？不计分红的回报是多少？',answer:'起初40元，后来35.2元；35.2÷40−1=−12%。利润增长10%，但估值下降20%，共同结果是1.1×0.8−1=−12%。',quiz:{q:'看到某股PE只有5倍，最先要核对？',options:['利润是否可持续、口径是否一致、是否处于周期高峰','立即买入','5倍意味着5年保证回本'],correct:0,why:'PE是价格与利润的比值，不是保证的现金回本年限。'},tool:'valuation',refs:[]},
{id:16,phase:3,title:'真实财报演示：先事实，后解释',sub:'用贵州茅台2025年报练习读数',minutes:55,goal:'能从年报提取数字并区分原始数据、公司解释和个人推断。',body:`
<h2>这次换成真实、固定时间的数据</h2><p>案例使用上交所披露的<strong>贵州茅台2025年年度报告</strong>，不是实时行情，也不构成对该股票的买卖判断。报告第6页列有主要财务数据；读者无需离开本页即可做完基础练习，原文链接用于核验。</p>
<div class="table-wrap"><table><thead><tr><th>合并口径指标</th><th>2024年</th><th>2025年</th></tr></thead><tbody><tr><td>营业收入（亿元，约）</td><td>1,708.99</td><td>1,688.38</td></tr><tr><td>归母净利润（亿元，约）</td><td>862.28</td><td>823.20</td></tr><tr><td>经营现金流净额（亿元，约）</td><td>924.64</td><td>615.22</td></tr><tr><td>基本每股收益（元）</td><td>68.64</td><td>65.66</td></tr></tbody></table></div>
<h2>第一步：复算，而不是看“大数字”</h2><p>营业收入同比约−1.21%，归母净利润同比约−4.53%，经营现金流净额同比约−33.46%。百分比使用报告披露值，表内亿元金额经四舍五入。只说“赚了823亿元”无法描述变化；也不能用利润下降幅度直接推断股价应当跌多少。</p>
<h2>第二步：找解释，别立即下结论</h2><p>报告说明，经营现金流变化主要与控股财务公司吸收集团成员存款减少、不可随时支取的同业存款增加有关。这是<strong>公司披露的解释</strong>，不应把整个现金流下降直接归因为终端卖酒回款恶化。仍需结合现金流科目、财务公司业务和销售回款进一步分析。</p>
<h2>第三步：演示估值，单独标明假设</h2><div class="case"><b>假设股价1,200元，并非当前报价</b><p>只用2025年基本EPS 65.66作简化静态演示：PE≈1,200÷65.66＝18.28倍。这既不是实时TTM PE，也没有包含2026年新财报的信息。真实判断要更新日期、股本及盈利口径，并分析未来经营；18.28本身不能说明便宜或昂贵。</p></div>
<h2>第四步：写一张“未解决问题”清单</h2><p>收入结构是否变化？利润变化来自价格、销量、费用还是其他项目？现金流解释能否在附注中得到对应？当前价格包含何种预期？在没有回答这些问题前，完整且诚实的结论是：“已读懂这份报告的部分数据，尚不足以作出投资决定。”</p>
<p class="note">财报摘录只是阅读方法的演示，不是一份完整公司研究。不要将母公司利润表与合并报表混用，也不要把报告中的分红预案直接当作已经实施的最终每股金额。</p>`,task:'用表中约数计算2025年经营现金流/归母净利润。能否仅因比值低于1就认定经营恶化？',answer:'615.22÷823.20≈0.747，即约0.75。不能仅据此判断；需看业务结构、收付时点和报告解释，也需注意归母利润与合并现金流口径并非完全同一范围。',quiz:{q:'用假设股价1200除以2025年EPS所得18.28倍，应该标注为？',options:['当前实时TTM市盈率','教学假设下的简化静态PE','官方合理估值'],correct:1,why:'股价是假设，利润属于固定年度，不能冒充实时估值或官方结论。'},refs:['report']}
);

{id:17,phase:4,title:'风险与仓位：把失误控制在能承受的范围',sub:'波动、永久损失、流动性和相关性',minutes:50,goal:'能把单项投资的损失换算成对整个账户的影响。',body:`
<h2>风险不只有价格上下跳动</h2><p><strong>波动风险：</strong>短期价格变化，让用钱时点不确定。<strong>永久损失：</strong>公司长期经营恶化、稀释、破产或极高价买入等，可能使本金难以恢复。<strong>流动性风险：</strong>想卖时没有足量买方。<strong>集中风险：</strong>多项持仓同时受一个因素影响。<strong>行为风险：</strong>因为恐惧、冲动或借钱而违反原计划。</p>
<h2>仓位是风险的放大器</h2><div class="formula">单项对组合的近似影响 ＝ 该项资金权重 × 该项收益率</div><div class="case"><b>同一笔亏损，不同账户后果</b><p>10,000元账户中，某只股票占1,000元，即10%仓位。它下跌30%，其他持仓不变，账户约损失300元，即3%。如果它占8,000元，相同跌幅会使账户损失2,400元，即24%。这只是静态情景，真实持仓可能同时下跌。</p></div>
<h2>分散看底层，而不只看数量</h2><p>五只同一行业股票可能同时受需求下降影响；三只跟踪同一指数的 ETF 可能高度重叠。分散能减少部分个别公司风险，却不能消除整个市场下跌。现金也不是没有代价，它面临购买力变化和机会成本，但能提供用钱时的确定性。</p>
<h2>用压力情境反推比例</h2><p>假设只是教学：一个组合只有股票ETF与现金，现金名义金额不变。若股票部分下跌40%，你希望这一情境下组合损失不超过10%，则股票权重应不高于10%÷40%＝25%。实际市场可能跌得更多、不同资产会一起跌；这个算式不是风险上限保证，也不是为你推荐25%配置。</p>
<h2>止损计划的边界</h2><p>交易型策略可能事先设置价格退出条件，但跳空、跌停、停牌和T+1会使实际损失超过计划。长期投资也需要退出原则，例如核心经营判断失效、产品目标变化、资金用途改变、集中度过高。仅凭买入成本高低决定卖不卖，会忽略当前资产是否还符合目标。</p>
<p>“单笔最多亏500元”只有配合仓位和可执行退出方式才有意义。按计划止损距离算出的仓位，也不能把500元当绝对上限。对新手最可控的步骤是：不用杠杆、留足生活资金、把学习仓位做小、明确不可承受的情境。</p>`,task:'20,000元模拟账户，持有股票A 4,000元、股票ETF 6,000元、现金10,000元。A跌50%、ETF跌30%、现金不变，账户剩多少？',answer:'A剩2,000，ETF剩4,200，加现金10,000，总计16,200元；损失3,800元，即19%。按单项权重算：20%×−50%＋30%×−30%=−19%。',quiz:{q:'有5只基金就一定充分分散吗？',options:['一定，数量够了','不一定，要检查底层重叠与相关风险','只要来自不同基金公司就行'],correct:1,why:'不同包装可能持有相同的公司或行业。'},tool:'allocation',refs:['allocation']},
{id:18,phase:4,title:'组合与再平衡：先有比例，再有动作',sub:'建立投资规则，处理上涨和下跌后的偏离',minutes:45,goal:'能计算组合权重，并区分再平衡与追涨杀跌。',body:`
<h2>组合是一个整体决策</h2><p>你可以把资金按用途、期限和风险分配到不同资产。权益仓位内部可以包含宽基、行业或个股，但每一层都要算回<strong>总资产的比例</strong>。不要一边说个股只占“小仓位”，一边忽略所有小仓位加起来已经很大。</p>
<div class="case"><b>纯教学的60/40模拟组合</b><p>初始总额10,000元，其中普通宽基股票ETF 6,000元、现金4,000元。假设ETF上涨20%，现金不变，则总额11,200元，ETF权重7,200÷11,200≈64.29%。若目标仍是60%，对应ETF目标金额6,720元，需要卖出约480元转成现金。实际须考虑交易单位、费用和价格变化，未必能精确到目标。</p></div>
<h2>再平衡的目的</h2><p>再平衡使风险暴露回到事先认可的范围，而不是预测最高点和最低点。方法可以是固定检查日期，或预先设定偏离区间。频率太高可能增加费用，太低可能长期偏离目标。什么规则适合，取决于实际资产、成本和目标，没有统一最佳参数。</p>
<h2>优先考虑新资金</h2><p>继续上例，若有新增资金且用途允许，可以先向低于目标的部分投入，减少卖出和成本。但是“有新钱”不意味着必须买跌得最多的资产；应先确认目标配置和该资产的基本判断仍成立。</p>
<h2>债券基金并不是现金替代词</h2><p>债券价格受利率和信用风险影响：市场利率上升时，既有固定利息债券的价格通常承压，期限等因素影响幅度。信用恶化可能造成更大损失。货币基金、短债基金、长债基金与银行存款具有不同的波动、赎回与保障安排，不能在压力测试中都设为绝对不变。</p>
<h2>写一页投资规则</h2><ol><li>目标与最早用钱日期：为了什么，什么时候需要。</li><li>允许的资产：本阶段只模拟普通宽基ETF与现金，或明确其他范围。</li><li>目标比例与容忍区间：先写规则，再观察行情。</li><li>检查安排：例如每月固定一天查看，不因每天涨跌临时加频率。</li><li>退出/修改条件：生活资金需求、风险承受变化、产品或判断失效。</li></ol><p>这里的60/40只用来练算术，并非对你适合比例的结论；真实配置需要个人完整财务信息。</p>`,task:'教学组合初始股票60、现金40，股票跌20%且现金不变。新股票占比是多少？重新回60%需把多少现金转入股票？',answer:'股票48、现金40，总额88；股票占54.55%。目标股票88×60%=52.8，因此需转入4.8。是否实际执行，还需检查原规则、费用与新风险。',quiz:{q:'按事先规则再平衡的主要目的是什么？',options:['保证卖在最高点','恢复目标风险暴露','保证永远优于不交易'],correct:1,why:'它管理组合结构，不保证择时正确或提高收益。'},refs:['allocation','bond']},
{id:19,phase:4,title:'定投：平滑入场，也会持续亏损',sub:'成本平均、现金流与比较方法',minutes:50,goal:'能算定投份额与成本，并知道定投无法修复什么问题。',body:`
<h2>定投是执行方式，不是收益保证</h2><p>定投通常指按固定时间投入固定或规则化金额。价格较低时同样的钱能买更多份额，价格较高时买得更少。它有助于把执行与当下情绪分开，但如果资产长期衰退，或最后用钱时仍处低位，定投照样可能亏损。</p>
<div class="case"><b>三次各投入1,000元，忽略费用和交易单位</b><p>价格依次为10、8、10元，买入100、125、100份，总计325份，总投入3,000元，平均成本=3,000÷325≈9.23元。期末价格10元，市值3,250元，累计赚250元。</p><p>若价格是10、8、6元，分别买100、125、166.67份，共391.67份，期末值约2,350元，仍亏650元。实际场内ETF受100份单位及佣金影响，余款可能暂存，不能完全照搬可买任意小数份额的演示。</p></div>
<h2>平均成本不是平均价格</h2><p>10、8、10的算术平均是9.33元，但定投成本是9.23元，因为低价买了更多份额。真正成本要用总投入除以总份额；考虑费用后，用实际总支出除以份额。</p>
<h2>定投与一次投入，取决于路径</h2><p>市场持续上涨时，更早投入的资金可能受益更多；先跌后涨时，分批可能获得较低成本。事先不知道路径，所以不能用一条事后挑出的曲线证明某种方式必胜。定投也要确认投入资金确实来自可承受风险的现金流，而不是为了补亏借钱。</p>
<h2>有追加资金时如何看回报</h2><p>“赚250÷投3000≈8.33%”可以描述累计盈亏比例，但三笔资金投入时间不同，它不是严格的年化收益。<strong>资金加权收益</strong>考虑各笔金额和日期，反映投资者实际资金体验；<strong>时间加权收益</strong>尽量剥离外部资金进出，常用于比较策略或产品。初学者至少记录每次日期、投入、份额和期末市值，别把新增本金当利润。</p>
<h2>什么时候复核定投</h2><p>定期检查现金流、用途、标的规则和集中风险。生活资金紧张、目标改变或产品不再符合原要求，可以暂停或修改；不是所有暂停都叫失败。不要因为刚涨了一周就翻倍扣款，也不要把“越跌越买”当作无需上限的机械命令。</p>`,task:'每次投入600元，价格依次为3、2、3元。忽略成本和份额单位，计算总份额、平均成本和期末市值。',answer:'买入200、300、200份，总700份；投入1,800元，平均成本约2.5714元；期末市值2,100元，累计盈利300元。这个比例不直接等于年化回报。',quiz:{q:'定投能保证什么？',options:['长期一定不亏','持续下跌时自动产生利润','按既定规则分批投入，但不能保证回报'],correct:2,why:'投入方式改变成本路径，不改变资产可能持续下跌的事实。'},refs:['investing']},
{id:20,phase:4,title:'行为与信息：不被涨跌牵着走',sub:'追涨、回本执念、幸存者偏差与骗局',minutes:40,goal:'能识别常见决策陷阱，并用记录替代情绪化操作。',body:`
<h2>为什么知道道理，还是容易做错</h2><p><strong>害怕错过：</strong>看别人赚钱后追入，却没有原始判断。<strong>损失厌恶：</strong>不愿承认亏损，导致不断加仓。<strong>锚定：</strong>只盯买入价，觉得回到成本才算结束。<strong>确认偏误：</strong>买后只看支持自己的消息。认识名字不够，要给每个陷阱安排一个具体动作。</p>
<div class="case"><b>把“回本再卖”翻译成今天的问题</b><p>小林20元买入的公司跌到12元。是否卖出，不取决于市场是否愿意“还给他8元”，而取决于当前经营、价格、风险、替代选择和资金用途。如果今天没有这只股票，他还会按同样理由用这笔钱买它吗？若不愿意，至少需要重新审查继续持有的依据。</p></div>
<h2>建立一个操作前暂停清单</h2><p>写下触发消息和来源、当前可验证事实、反对理由、资金影响和预定动作。若原计划没有这笔交易，先做纸面演练，不用行情催促自己。暂停多久按情境设定，其目的只是打断冲动，不是用一个固定时长保证正确。</p>
<h2>警惕被筛选过的“成功经验”</h2><p>只展示活下来的牛股，忽略退市和长期亏损者，是幸存者偏差。用今天知道的赢家回到过去假装能提前选中，是事后偏差。策略测试若偷用了当时未公布的财报，就是未来信息泄漏。收益截图还可能省略本金变化、费用或最大回撤。</p>
<h2>不用复杂知识也能识别的危险信号</h2><ul><li>保证本金、承诺固定高收益，却要求承担股票风险。</li><li>要求把钱转到个人账户，或下载无法核实来源的交易软件。</li><li>老师带单、先赚小钱再要求更大入金、以解冻/税费名义继续转款。</li><li>要求透露密码、验证码，或以远程控制代替本人操作。</li></ul><p>遇到疑似骗局，不继续转款，保留聊天和转账记录，通过已知官方渠道核实、联系相关机构。消息即使来自熟人，也不能替代机构身份和产品核验。</p>
<h2>结果与过程分开复盘</h2><p>遵守合理流程仍可能亏损；胡乱买入也可能短期赚钱。每次复盘分别记“过程是否合格”和“结果如何”，不要用一次盈利给危险行为盖章。学习期的目标是减少无法解释的操作，而不是保持每笔都赢。</p>`,task:'朋友只给你展示三笔盈利交易，说“从不亏”。你应追问哪些记录？',answer:'完整期间的全部交易、资金转入转出、持仓浮亏、费用、最大回撤、失败与退出案例，以及真实可核验的账户记录。三笔成功交易无法证明策略可靠。',quiz:{q:'一笔没有计划的追涨交易赚了钱，说明？',options:['方法已被证明有效','只说明这一次结果赚钱，不能证明过程可靠','应该立刻加杠杆复制'],correct:1,why:'结果受运气与环境影响，需要完整样本和风险评价。'},refs:['fraud']},
{id:21,phase:5,title:'公告与权益：遇到新闻先查哪一页',sub:'分红税、送转、减持、停牌与退市',minutes:50,goal:'能把公告转成可核对的问题，而不是简单贴“利好/利空”标签。',body:`
<h2>信息入口按可靠性排序</h2><p>优先看交易所披露、公司正式公告、基金合同和管理人公告。媒体报道用于发现线索，社交平台用于提出问题，都不能替代原始文件。打开文件后先确认证券代码、公告日期、是否更正、预案还是已实施，以及是否只是风险提示。</p>
<h2>现金分红，三个日期</h2><p><strong>股权登记日</strong>确定本次权益登记；<strong>除权除息日</strong>作相应价格基准调整；<strong>发放日</strong>按安排到账。具体以实施公告为准，不把董事会预案当成已经到账的现金。想在除息前“买入拿分红再卖出”并不能凭空获利，因为价格调整和税费会影响总资产。</p>
<p>对普通个人从公开发行和转让市场取得的上市公司股票，现行股息红利差别化政策下，持股不超过1个月的实际税负为20%；超过1个月至1年（含）为10%；超过1年暂免。持有1年以内通常在转让时按最终持有期补扣，因此分红当时没扣税不等于免税。该口径不要直接套给ETF、港股或特殊股份。</p>
<div class="case"><b>税费演示</b><p>100股，每股分红0.50元，税前50元。若适用20%税负，税额10元，净分红40元。若持有期对应10%，税额5元。实际由账户结算处理，记录原始交易和分红信息，不自行用买卖顺序猜扣税。</p></div>
<h2>送股和转增，不是账户财富翻倍</h2><p>简化“每10股转增10股”：原100股变200股，原参考价格20元调整到约10元，在没有其他变化时总价值仍约2,000元。送股、转增具体税务和来源可能不同，不能因为都增加股数就视为完全同一件事。</p>
<h2>其他公告的实用读法</h2><ul><li><strong>减持：</strong>谁、多少比例、原因、时间安排；计划不等于已成交。</li><li><strong>回购：</strong>金额、价格区间、用途、实施进度与资金来源；公告不保证全部执行。</li><li><strong>重大合同：</strong>合同总额不是当期利润；看履行条件、收入确认、成本和回款。</li><li><strong>停牌/风险警示：</strong>看原因和恢复条件；暂停交易不暂停经济风险。</li><li><strong>退市风险：</strong>退出主板交易并不保证有顺畅的后续退出渠道，本金可能遭严重损失；不要把ST当作低价机会。</li></ul>
<p>实际动作只需三步：存原始公告 → 提取会改变现金流或交易权利的条款 → 对照自己的原计划。如果无法判断，就记录问题并暂停新增暴露。</p>`,task:'公告说“拟回购不超过2亿元”，你能把2亿元当作明天必然进场买盘吗？',answer:'不能。“拟”和“不超过”代表计划及上限；需看下限、有效期、条件、资金来源及实际进展。不能据此保证短期股价。',quiz:{q:'分红当天未扣红利税，意味着？',options:['一定免税','可能需在卖出时按持有期补扣','券商一定漏扣'],correct:1,why:'普通个人股票红利税可能按最终持有期限后续处理。'},refs:['dividend','disclosure']},
{id:22,phase:5,title:'完整案例 A：从目标到 ETF 模拟订单',sub:'把指数、产品、费用和风险串起来',minutes:60,goal:'能写出一份可复核的ETF决策单，包括不买入的理由。',body:`
<h2>任务与完整数据卡（全部虚构）</h2><p>小林有10,000元模拟资金，生活备用金在外。他只想练习获得分散的境内股票暴露，不追逐单一行业。为完成本次作业，先限定ETF计划投入不超过2,000元，剩余模拟现金保留。这是教学任务约束，不是对真实资金比例的建议。</p><p>候选甲：跟踪宽基指数，管理+托管年费0.20%，当前参考净值2.000，卖一2.002、足量；候选乙：同指数，年费0.15%，参考净值2.000，卖一2.040、足量。两者其他条件先假设相当，券商佣金均为每笔最低5元。</p>
<h2>步骤一：解释买什么</h2><p>先说明该宽基覆盖范围、前十大权重和行业分布。数据卡未提供真实成份，所以这一步只能写“需补充核实”；不能拿“宽基”二字跳过集中风险。真实选品时要从指数方案和产品资料取数。本例其余计算可在不补资料的情况下完成。</p>
<h2>步骤二：比较当前交易摩擦</h2><p>甲参考溢价2.002÷2−1=0.10%；乙2.040÷2−1=2%。乙便宜0.05个百分点的年费，对2,000元一年约为1元；它现在多出的溢价约1.9个百分点，远大于这项年费差。时点估值准确与否仍须确认。本例倾向先研究甲，或等待更合理的执行条件，而不是直接追乙。</p>
<h2>步骤三：计算可申报数量</h2><p>假设按2.002买，100份为单位、佣金5元，2,000元含费预算最多可买900份：900×2.002＋5＝<strong>1,806.80元</strong>。1,000份需2,007元，超预算。交易后模拟现金=10,000−1,806.80＝8,193.20元。</p>
<h2>步骤四：把坏情境写在前面</h2><p>若买入后市场价格跌30%且卖出，价格为1.4014元，900份卖出毛额1,261.26元，另假设卖出佣金5元，净回款1,256.26元。损失550.54元，约占整个初始模拟账户5.51%。实际成交价格必须符合报价单位，此处为连续比例压力计算，真实损失可能更大。</p>
<h2>步骤五：订单与后续</h2><p>确认T+1、交易状态、盘口时点、限价类型 → 只提交一笔900份订单 → 成交后查均价与费用 → 记录实际溢价 → 到约定检查日复核产品与资金用途。行情突然上涨并不自动允许突破预算。</p>
<div class="note"><strong>合格结论也可以是“暂不下单”。</strong>本案例缺少完整成份、规模和跟踪记录，能算对订单不等于信息已经充分。课程故意保留这一缺口，让你练习把“已知”和“还不知道”写开。</div>`,task:'若预算改为1,500元，其余条件不变，按2.002元和每笔佣金5元，最多可买多少份？',answer:'按100份向下取整：(1500−5)÷2.002≈746.75，最多700份。总支出700×2.002+5=1,406.40元。不能买800份，也不能用746.75份作为场内标准订单。',quiz:{q:'本例年费更低的乙为何不一定更合适？',options:['费率没有作用','当前溢价和执行成本可能大于少付的年费','ETF净值必须都是1元'],correct:1,why:'持有成本要与买入溢价、价差、佣金及持有期一起看。'},refs:['premium','etf_fee','szse_rules']},
{id:23,phase:5,title:'完整案例 B：为一家企业写判断，而非喊目标价',sub:'从经营数据到三种情景与反证',minutes:60,goal:'能用同一套数据建立个股分析，并明确判断失效条件。',body:`
<h2>晨光早餐公司的数据卡（虚构）</h2><p>总股数100万股；去年收入1,000万元、净利润100万元；今年收入1,200万元、净利润120万元、扣非净利润110万元、经营现金流80万元；年末现金200万元、有息债务150万元、净资产600万元。应收账款从100万元升至180万元。假设股价18元，无其他股本变化。</p>
<h2>步骤一：先计算当前状态</h2><p>收入与净利润均增长20%；当年EPS=120万÷100万=1.20元；静态PE=18÷1.2=15倍；每股净资产6元，PB=3倍。经营现金流/净利润=80÷120≈0.67。应收增长80%，明显快于收入的20%，值得进一步追查。</p>
<h2>步骤二：判断赚钱质量</h2><p>扣非利润低于净利润10万元，需知道非经常项目是什么。应收增加可能来自拓展企业团餐赊销，也可能是回款变慢；应检查客户账期、坏账准备、后续收款、客户集中度。现金200万大于有息债务150万，只能算出简化净现金50万，不能忽略受限现金、其他负债、到期日和新增支出。</p>
<h2>步骤三：做可检验的情景</h2><div class="table-wrap"><table><thead><tr><th>下一年假设</th><th>EPS</th><th>假设PE</th><th>情景价格</th><th>相对18元，不含分红</th></tr></thead><tbody><tr><td>悲观：成本与回款承压</td><td>0.80</td><td>10</td><td>8元</td><td>−55.56%</td></tr><tr><td>基准：利润略增</td><td>1.30</td><td>14</td><td>18.20元</td><td>+1.11%</td></tr><tr><td>乐观：扩张顺利</td><td>1.60</td><td>18</td><td>28.80元</td><td>+60%</td></tr></tbody></table></div>
<p>三种情景没有赋予可靠概率，不能直接取平均当“合理价”。它们的用途是暴露假设：只有乐观情境带来很大上涨，而悲观损失可能明显。倍数也是假设，不是行业标准；若缺乏比较依据，应降低对估值结论的信心。</p>
<h2>步骤四：写反证与行动条件</h2><p>原判断：“扩张能产生可持续现金利润”。反证包括：新增客户长期不付款、毛利率持续下滑且无法解释、债务到期压力增加、管理层反复变更披露。如果这些情况出现，应重新评估，而不是因为价格低了就自动补仓。</p>
<h2>步骤五：形成合格的结论</h2><p>“经营规模增长，但现金回收与应收变化尚未解释；现价在基准情景下空间有限。先列观察，不新增个股风险；等待回款和利润质量证据。”这比“预计涨到28.8元”更完整。若未来信息变好，也要重新检查价格是否已反映改善。</p>
<p>本案例教的是把事实、假设、证据与行动相连；不要求预测精准，也不要求必须买入。没有研究优势、时间或完整信息时，选择不参与个股本身就是有效决策。</p>`,task:'若今年净利润120万元中有40万元来自一次性资产出售，用18元和报告EPS算的15倍PE可能有什么问题？',answer:'一次性收益可能抬高分母，使PE显得较低。若教学简化剔除40万元，持续利润80万元、EPS0.80元，对应22.5倍；实际扣非和税务口径需查报告，不能直接把该简化值当官方指标。',quiz:{q:'三种情景价格8、18.2、28.8元，能直接把平均数当公允价吗？',options:['能，平均数最客观','不能，概率与假设缺乏依据','只取最高价'],correct:1,why:'情景分析展示敏感性，没有可靠概率和现金流依据就不是估值定论。'},refs:[]},
{id:24,phase:5,title:'结业：写下你自己的投资操作手册',sub:'综合任务、评分标准与课程后的固定流程',minutes:60,goal:'能完成一份包含目标、证据、费用、风险和复盘的模拟决策。',body:`
<h2>你要交付的是一份能被别人复核的决策</h2><p>选第22章ETF案例或第23章公司案例，使用本课程已给数据完成下面任务。无需真实开户或购买；真实材料只有在练习“资料检索”时才另外核对。交易规则与产品资料会更新，未来真实决策前的核验是操作的一部分，不是本课程基础讲解的缺页。</p>
<h2>综合作业：六个部分，共100分</h2><ol><li><strong>目标与边界20分：</strong>写资金用途、最早用钱日期、允许风险、是否真实/模拟。四项各5分。</li><li><strong>产品与证据20分：</strong>解释买的是什么、底层风险、资料日期与出处、至少一项未知。四项各5分。</li><li><strong>交易与费用20分：</strong>代码/类别核对、申报规则、含费预算、净回报计算。四项各5分。</li><li><strong>坏情境20分：</strong>人民币损失10分、占总账户比例5分、无法及时退出的可能5分。</li><li><strong>行动条件10分：</strong>写买入/不买入理由5分，判断失效与复核条件5分。</li><li><strong>复盘记录10分：</strong>区分过程与结果5分，给出下次具体改进5分。</li></ol>
<h2>参考提交：ETF案例摘要</h2><div class="case"><p>“使用10,000元模拟资金；候选甲跟踪宽基，暂不涉及杠杆。净值与报价是案例固定假设，实际成份与跟踪记录缺失。2,000元含费预算下，2.002元限价最多900份，总成本1,806.80元。若价格跌30%并按假设卖出费5元退出，损失550.54元，约占账户5.51%；实际可能受T+1或流动性影响。因资料尚不充分，先完成纸面订单，不执行真实买入。复核时检查成份集中度、跟踪情况、报价与资金用途。”</p></div>
<h2>通过标准</h2><p>建议教学合格线为80分，并且三个关键错误必须全部纠正：把生活刚需钱当投资本金；把T+1、费用或保证成交理解错；把未来收益或情景价格当保证。这个分数只用于学习自检，不是金融资格或实盘适当性认证。</p>
<h2>课程结束后的轻量流程</h2><ul><li><strong>每次行动前：</strong>确认资金用途、依据、总仓位、费用和退出条件。</li><li><strong>每月一次：</strong>核对总资产、投入/转出、持仓权重、费用和偏离原计划的交易。</li><li><strong>新财报或重大公告出现时：</strong>更新判断，只改有新证据支持的部分。</li><li><strong>生活发生变化时：</strong>先调整流动性与风险承受，再考虑投资计划。</li><li><strong>发现不懂的产品：</strong>先研究其收益来源、最坏情境和退出方式，不因热门而越级。</li></ul>
<h2>自我讲解，是最后一关</h2><p>合上笔记，用普通话解释：股票与ETF是什么、为何不保本、价格为什么不同于价值、一次交易如何成交和收费、如何判断组合能否承受下跌。若某个词只能复述定义，却不能举例，就回到对应章节再做一次题。</p>
<p>你已经完成从资金安排、交易操作、ETF选择、财报估值到风险管理的基础闭环。往后最值得积累的是稳定的记录和可核验的判断，而不是不断增加指标或频繁找“必胜方法”。</p>`,task:'完成上面的综合作业，并给每个分项打分；把尚缺的事实明确写出来。',answer:'可对照本章ETF参考提交，也可用第23章数据提交“不买入”的公司分析。评分看依据、计算和边界是否清楚，不因最终选择买入还是不买入而加减分。低于80分或存在关键错误时，回到对应章节补练。',quiz:{q:'这门课的结业目标是？',options:['保证下个月盈利','能解释、计算并复核一份有风险边界的决策','学会预测明天涨跌'],correct:1,why:'基础能力是可检查的流程，不是未来收益的承诺。'},refs:[]}
);

function lesson(id){const c=C.find(c=>c.id===id);if(!c)return title('NOT FOUND','没有这个章节','请从左侧目录选择第1–24章。');state.last=id;save();let n=0;const headings=[];const body=c.body.replace(/<h2>(.*?)<\/h2>/g,(_,t)=>{const key='section'+n++;headings.push([key,plain(t)]);return `<h2 id="${key}">${t}</h2>`;});const chosen=state.answers[id],correct=chosen===c.quiz.correct;return `<div class="lesson-layout"><div class="lesson-main"><header class="lesson-head"><div class="eyebrow">阶段 ${c.phase+1} · ${P[c.phase][0]} / CHAPTER ${pad(id)}</div><h1>${c.title}</h1><p class="sub">${c.sub}</p><div class="lesson-meta"><span>阅读与练习约 ${c.minutes} 分钟</span><span>1 道实操题 + 1 道自测</span><span>${state.done.includes(id)?'✓ 已标记完成':'尚未标记完成'}</span></div></header><div class="goal"><b>学完这一章，你应该能：</b><br>${c.goal}</div><div class="prereq">${id===1?'前置知识：只需四则运算。':`建议先读：<a href="#lesson/${id-1}">第 ${pad(id-1)} 章 · ${C[id-2].title}</a>`} · 教学例子不代表真实投资建议。</div><article class="reading">${body}</article>${c.tool?`<a class="button secondary" href="#tools/${c.tool}">动手试一试 · 打开本章计算器 ↗</a>`:''}<section class="exercise" id="exercise"><div class="eyebrow">YOUR TURN · 先自己做</div><h2>把概念用一次</h2><p>${c.task}</p><details><summary>我做完了，展开答案与解析</summary><p>${c.answer}</p></details></section><section class="quiz" id="quiz"><div class="eyebrow">QUICK CHECK · 章节自测</div><h3>${c.quiz.q}</h3><div class="quiz-options">${c.quiz.options.map((o,i)=>`<button class="quiz-option ${chosen===i?'selected ':''}${chosen!==undefined&&i===c.quiz.correct?'correct':''}" data-quiz="${id}" data-choice="${i}" aria-pressed="${chosen===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="feedback ${chosen!==undefined&&!correct?'wrong':''}" ${chosen===undefined?'hidden':''}>${chosen===undefined?'':correct?'✓ 回答正确。':'再想一想。'} ${chosen!==undefined?c.quiz.why:''}</div></section><section class="notes-block" id="chapter-notes"><label for="note-${id}"><b>我的笔记</b> · 用自己的话写一个例子、一个疑问或一种反证</label><textarea id="note-${id}" data-note="${id}" maxlength="20000" placeholder="例如：我以前把分红当成额外白得的钱。现在我会一起看股价、现金与税费…">${esc(state.notes[id]||'')}</textarea><small class="note-status">${volatile?'浏览器保存不可用，请及时导出记录。':'自动保存到当前浏览器；离线版与在线版的进度彼此独立。'}</small></section><div class="lesson-nav">${id>1?`<a class="button secondary" href="#lesson/${id-1}">← 上一章</a>`:''}<button class="complete" data-done="${id}">${state.done.includes(id)?'✓ 已完成 · 撤销标记':'标记本章已完成'}</button>${id<24?`<a class="button" href="#lesson/${id+1}">下一章 →</a>`:`<a class="button" href="#notes">查看学习成果 →</a>`}</div>${refs(c.refs)}</div><aside class="lesson-toc"><b>本章路线</b>${headings.map(([key,t])=>`<a href="#lesson/${id}/${key}">${t}</a>`).join('')}<a href="#lesson/${id}/exercise">动手练习</a><a href="#lesson/${id}/quiz">章节自测</a><a href="#lesson/${id}/chapter-notes">我的笔记</a></aside></div>`;}
function field(name,label,value,options={}){if(options.select)return `<label>${label}<select name="${name}">${options.select.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`;return `<label>${label}<input name="${name}" type="number" value="${value}" min="${options.min??0}" max="${options.max??1000000000}" step="${options.step??'any'}" inputmode="decimal"></label>`;}
const labDefs=[
{id:'fees',name:'01 · 一笔交易，到手赚多少',text:'复算第8章的股票与ETF往返费用。所有输入均为教学参数。',fields:()=>field('kind','交易品种','',{select:[['stock','普通A股股票'],['etf','普通股票ETF']]})+field('buy','买入价格（元）',10)+field('sell','卖出价格（元）',11)+field('qty','数量（股 / 份）',1000,{step:100})+field('rate','单边佣金费率（%）',0.025,{max:1})+field('minimum','每边最低佣金（元）',5,{max:1000}),foot:'模型：股票卖出印花税0.05%，过户费买卖各0.001%；ETF不套用这两项股票税费。佣金假定含常规规费、不含过户费。股票当前规则每笔最低5元，ETF按合同；不含分红、滑点，舍入与分笔处理以交割单为准。'},
{id:'loss',name:'02 · 亏损后，回本有多难',text:'损失发生在较大本金上，回升则从较小本金起步。',fields:()=>field('base','初始本金（元）',10000)+field('drop','下跌幅度（%）',30,{max:100}),foot:'公式：回本涨幅＝亏损比例÷(1−亏损比例)。仅作数学演示，不代表一定会反弹。'},

function labs(){return title('LEARNING BY DOING','交互实验室','试着改一个数字，再解释结果为什么变了。先预测，再计算；所有工具只演示机制，不生成买卖信号。')+`<div class="lab-grid">${labDefs.map(l=>`<section class="lab" id="${l.id}"><h2>${l.name}</h2><p>${l.text}</p><form data-lab="${l.id}"><div class="fields">${l.fields()}</div><output class="result" style="display:block" aria-live="polite"></output></form><p class="footnote">${l.foot}</p></section>`).join('')}</div>`;}
function labResult(id,v){const positive=(...names)=>{if(names.some(n=>v[n]<=0))throw Error('价格、金额与份额须大于0。');};const f=money;
if(id==='fees'){positive('buy','sell','qty');if(!Number.isInteger(v.qty)||v.qty%100!==0)throw Error('此模型按普通主板/ETF演示，请输入100的整数倍数量。');if(v.kind==='stock'&&v.minimum<5)throw Error('本股票模型按现行每笔最低5元规则，请将最低佣金设为至少5元。');const b=v.buy*v.qty,s=v.sell*v.qty,bc=Math.max(b*v.rate/100,v.minimum),sc=Math.max(s*v.rate/100,v.minimum),bt=v.kind==='stock'?b*.00001:0,st=v.kind==='stock'?s*.00001:0,tax=v.kind==='stock'?s*.0005:0,cost=b+bc+bt,net=s-sc-st-tax,profit=net-cost;return `<span>往返净${profit>=0?'利润':'亏损'}</span><strong>¥ ${f(profit)}</strong>成本收益率 ${pct(profit/cost)}<br>买入总支出 ${f(cost)} 元（佣金 ${f(bc)} / 过户 ${f(bt)}）<br>卖出净收入 ${f(net)} 元（佣金 ${f(sc)} / 过户 ${f(st)} / 印花税 ${f(tax)}）<br>往返总费税 ${f(bc+sc+bt+st+tax)} 元`;}
if(id==='loss'){positive('base');const d=v.drop/100;return `<span>回本需要上涨</span><strong>${d===1?'无法从零通过涨幅回本':pct(d/(1-d))}</strong>剩余本金 ${f(v.base*(1-d))} 元 · 损失 ${f(v.base*d)} 元<div class="lossbar"><span style="width:${v.drop}%"></span></div>下跌 ${v.drop}% 与上涨 ${v.drop}% 并不对称。`;}
if(id==='premium'){positive('nav','price','shares');if(!Number.isInteger(v.shares))throw Error('份额数量须为正整数。');return `<span>当前参考${v.price>=v.nav?'溢价':'折价'}率</span><strong>${pct(v.price/v.nav-1)}</strong>假设市场价回到净值：回报 ${pct(v.nav/v.price-1)}<br>金额变化 ${f((v.nav-v.price)*v.shares)} 元（未扣费）`;}
if(id==='valuation'){positive('eps','pe','futurePE');const future=v.eps*(1+v.growth/100);if(future<=0)throw Error('情景EPS不为正，PE估值模型不适用。');const now=v.eps*v.pe,p=future*v.futurePE;return `<span>教学情景价格</span><strong>¥ ${f(p)}</strong>基期 ${f(now)} 元 → 情景 ${f(p)} 元<br>EPS变为 ${f(future)} 元，价格回报 ${pct(p/now-1)}（不含分红）`;}
if(id==='allocation'){positive('total');const loss=v.total*v.weight/100*v.stress/100;return `<span>压力情境后的组合</span><strong>¥ ${f(v.total-loss)}</strong>总损失 ${f(loss)} 元，组合回报 −${pct(loss/v.total)}<br>股票剩余 ${f(v.total*v.weight/100*(1-v.stress/100))} 元；现金 ${f(v.total*(1-v.weight/100))} 元`;}
if(id==='compound'){positive('capital');if(!Number.isInteger(v.years))throw Error('年数请输入1至60的整数。');const end=v.capital*Math.pow(1+v.return/100,v.years);return `<span>${v.years}年后，按固定假设计算</span><strong>¥ ${f(end)}</strong>累计变化 ${f(end-v.capital)} 元（${pct(end/v.capital-1)}）<br>每年固定 ${v.return}% 仅为假设，实际市场不是这条路径。`;}
}
function calc(form){const values={};try{for(const input of $$('input,select',form)){if(input.tagName==='SELECT'){values[input.name]=input.value;continue;}const n=Number(input.value);if(input.value.trim()===''||!Number.isFinite(n)||n<Number(input.min)||n>Number(input.max))throw Error('请填写范围内的有效数字：'+input.closest('label').childNodes[0].textContent);values[input.name]=n;}const output=$('output',form);output.classList.remove('error');output.innerHTML=labResult(form.dataset.lab,values);}catch(e){$('output',form).classList.add('error');$('output',form).textContent=e.message;}}

function notes(){const answered=Object.keys(state.answers).length,correct=C.filter(c=>state.answers[c.id]===c.quiz.correct).length;return title('YOUR NOTEBOOK','把学过的，变成自己的。',`已标记完成 ${state.done.length}/24 章 · 已作答 ${answered}/24 道自测 · 最近答案正确 ${correct} 道。完成标记由你手动管理，不代表资格认证。`)+`<div class="notice">记录仅保存在当前浏览器，不上传、不同步。清除浏览器数据或换设备可能丢失；建议定期导出。在线版、离线文件和不同浏览器各自存储，可用导出/导入迁移。${volatile?'<b> 当前无法持久保存，请立即导出。</b>':''}</div><div class="actions"><button id="export-progress">导出进度与笔记 ↓</button><button id="export-notes">导出笔记文本 ↓</button><label class="button secondary" for="import-progress" style="cursor:pointer">导入记录</label><input id="import-progress" type="file" accept=".json,application/json" hidden></div><p class="tiny">导入将合并完成记录；同章笔记与答案以导入内容覆盖。仅导入本课程导出的文件。</p><div class="section-head"><h2>需要再练的自测</h2><small>更正后会自动移出</small></div>${C.filter(c=>state.answers[c.id]!==undefined&&state.answers[c.id]!==c.quiz.correct).map(c=>`<p><a href="#lesson/${c.id}/quiz">第${pad(c.id)}章 · ${c.quiz.q} →</a></p>`).join('')||'<p class="tiny">目前没有已作答的错题。未作答不计为掌握。</p>'}<div class="section-head"><h2>章节笔记</h2><small>到章节底部写第一条</small></div><div class="notes-list">${C.filter(c=>state.notes[c.id]?.trim()).map(c=>`<article class="note-card"><div class="actions"><a href="#lesson/${c.id}">第${pad(c.id)}章 · ${c.title} →</a></div><textarea class="note-edit" maxlength="20000" data-note="${c.id}" aria-label="第${c.id}章笔记">${esc(state.notes[c.id])}</textarea><small class="note-status">修改自动保存</small></article>`).join('')||'<div class="empty">你的笔记本还空着。读完第一章，写下你怎样区分生活用钱与风险资金。</div>'}</div>`;}
function sources(){return title('SOURCES & METHOD','重要的数字，要知道从哪里来。','核对日期：2026-10-26（北京时间）。一手规则、原始披露与通用教育资料分开使用。下列链接用于核验，不是要求额外读完才能理解课程。')+`<div class="notice"><b>课程如何制作</b><p>按你的要求，从GitHub拉取 <a href="https://github.com/weihaoqu/gemini-curriculum-designer" target="_blank" rel="noopener">weihaoqu/gemini-curriculum-designer</a>，借鉴其分层教学、学习目标、实操与测评结构。原skill下载在本次工作区，未覆盖全局skill。课程内容、案例、习题和网页为本次原创编写与加工，金融规则使用下列来源核对。</p><p>真实历史案例：贵州茅台2025年报、沪深300指数规则。小林、晨光早餐公司、候选ETF甲乙、价格路径、配置比例和未来情景均为明确的教学假设，不是推荐组合或真实报价。</p></div><h2>使用规则时，先确认版本和适用对象</h2><p>本版已纳入2026-07-06沪深交易规则调整，包括主板风险警示股10%限制和盘后固定价格交易扩围。旧投教文章用于解释机制，交易时间和具体限制以现行规则优先。佣金合同、具体基金费率、市场状态与未来税费变化必须在真实操作时再次核实。</p>${Object.entries(S).map(([id,s],i)=>`<div class="source-row" id="source-${id}"><span class="num">${pad(i+1)}</span><div><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><p>${esc(s.desc)}</p></div></div>`).join('')}<div class="notice"><b>课程边界</b><p>本课涵盖现金股票与普通股票指数ETF入门所需的概念和基本操作链路，不训练短线盈利技巧，也不展开融资融券、期权、期货、杠杆及反向产品。任何投资都可能亏损，分散、定投和长期持有都不保证收益。未来新增复杂产品，应重新完成产品学习和适当性核验。</p></div>`;}

s-block{padding:19px}.reading h2{font-size:21px}.lesson-nav>*{font-size:12px}.page-footer{display:block}.page-footer span{display:block;margin-top:8px}.section-head{align-items:start}.section-head small{max-width:110px;text-align:right}.lab{padding:21px}.source-row{grid-template-columns:26px 1fr}}\n@media print{body{background:white;font-size:11pt}.sidebar,.topbar,.page-footer,.lesson-toc,.lesson-nav,.actions,.skip,#toast,.print-btn{display:none!important}.shell{margin:0}main{padding:0;max-width:none}.lesson-layout{display:block}.reading{font-size:11pt}.quiz,.exercise,.case,.note,.lab{break-inside:avoid}.hero-art{max-height:200px}.phase-grid{grid-template-columns:repeat(3,1fr)}a{color:inherit}.notes-block textarea{min-height:100px}h2{break-after:avoid}details:not([open])>*:not(summary){display:block!important}.page-title{margin-bottom:20px}}\nbody{background:#f7f5ed}main{max-width:900px}.chapter{margin-top:70px;border-top:2px solid #365d4c;padding-top:35px}.book-toc{columns:2}.book-toc a{display:block;font-size:13px;margin:9px 0}@media print{.chapter{break-before:page}.book-toc{columns:2}}@media(max-width:600px){.book-toc{columns:1}}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"eyebrow\">THE INVESTING NOTEBOOK · 完整连续讲义\u003c/div>\u003ch1>股市第一课\u003cbr>A股与ETF实用学习手册\u003c/h1>\u003cp>24章 · 30天路线 · 规则核对2026-10-26\u003c/p>\u003cp>面向零基础，先学概念，再算例题，最后完成模拟决策。本讲义为教育材料，不提供个性化荐股或收益保证。除明确列明的真实历史数据，所有案例均为教学假设。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton onclick=\"window.print()\">打印 / 另存PDF\u003c/button>\u003ca href=\"index.html\">返回交互课程\u003c/a>\u003c/div>\u003ch2>阅读目录\u003c/h2>\u003cnav class=\"book-toc\">\u003ca href=\"#c1\">01 先安排钱，再认识股票\u003c/a>\u003ca href=\"#c2\">02 买股票，究竟买到了什么\u003c/a>\u003ca href=\"#c3\">03 价格为什么会涨跌\u003c/a>\u003ca href=\"#c4\">04 先算明白赚亏，再谈收益率\u003c/a>\u003ca href=\"#c5\">05 账户、券商与第一张交易清单\u003c/a>\u003ca href=\"#c6\">06 A 股交易规则速查\u003c/a>\u003ca href=\"#c7\">07 亲手走完一笔限价买卖\u003c/a>\u003ca href=\"#c8\">08 交易成本：小金额最容易算漏\u003c/a>\u003ca href=\"#c9\">09 看懂行情页，停止猜测图形\u003c/a>\u003ca href=\"#c10\">10 指数：给一篮子股票做温度计\u003c/a>\u003ca href=\"#c11\">11 ETF：买入一篮子资产的入口\u003c/a>\u003ca href=\"#c12\">12 怎样比较两只同类 ETF\u003c/a>\u003ca href=\"#c13\">13 从生意看公司，不从故事选股\u003c/a>\u003ca href=\"#c14\">14 三张财报：利润不是现金\u003c/a>\u003ca href=\"#c15\">15 估值：好公司也可能买贵\u003c/a>\u003ca href=\"#c16\">16 真实财报演示：先事实，后解释\u003c/a>\u003ca href=\"#c17\">17 风险与仓位：把失误控制在能承受的范围\u003c/a>\u003ca href=\"#c18\">18 组合与再平衡：先有比例，再有动作\u003c/a>\u003ca href=\"#c19\">19 定投：平滑入场，也会持续亏损\u003c/a>\u003ca href=\"#c20\">20 行为与信息：不被涨跌牵着走\u003c/a>\u003ca href=\"#c21\">21 公告与权益：遇到新闻先查哪一页\u003c/a>\u003ca href=\"#c22\">22 完整案例 A：从目标到 ETF 模拟订单\u003c/a>\u003ca href=\"#c23\">23 完整案例 B：为一家企业写判断，而非喊目标价\u003c/a>\u003ca href=\"#c24\">24 结业：写下你自己的投资操作手册\u003c/a>\u003c/nav>\u003ch2>每天怎么学\u003c/h2>\u003cp>按每阶段4个章节＋1天复习推进，共30天。建议每课35–60分钟；先复述上一课，再阅读、演算、做自测，最后记一条自己的解释。\u003c/p>\u003csection>\u003ch3>第1–5天 · 建立常识\u003c/h3>\u003cp>第1–4章。目标：不看术语也能讲清股票如何赚钱和亏钱。\u003c/p>\u003cp>第5天复习：不用笔记解释股权、市值、分红、涨跌不对称；完成：100元跌30%后回本需要涨多少？\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>应说明股权是所有权、总市值是价格乘股数；分红伴随除息；回本涨幅30÷70=42.86%。若混淆本金与市值，回第2、4章。\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch3>第6–10天 · 掌握交易\u003c/h3>\u003cp>第5–8章。目标：能完成纸面订单，核对成交与成本。\u003c/p>\u003cp>第10天复习：10元买1000股，再按10元卖出；万2.5、每边最低5元，股票税费用第8章模型，求损失；再口述T+1与撤单。\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>买入总成本10005.10，卖出净额9989.90，损失15.20元。T+1是当日新买部分通常次交易日才能卖；撤单要看确认，成交部分不能撤。\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch3>第11–15天 · 理解工具\u003c/h3>\u003cp>第9–12章。目标：能辨别底层风险，比较两只同类产品。\u003c/p>\u003cp>第15天复习：写跟踪目标、行业集中、费用、交易价差、溢价、跟踪记录六项；每项写它影响什么。\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>风险来自底层与集中度；成本来自持有和交易；溢价消失可在净值不跌时造成亏损；跟踪记录需同期间同口径。说不清溢价回到第11章。\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch3>第16–20天 · 看懂公司\u003c/h3>\u003cp>第13–16章。目标：能区分经营事实、解释与估值假设。\u003c/p>\u003cp>第20天复习：第一页写生意和三表，第二页写EPS/PE与三种情景；至少列出两项未知及反证。可用第13–16章案例。\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>合格内容包括收入利润现金的区别，估值分母与日期，未来假设不当事实。缺少现金流或只给一个目标价时，回第14、15章。\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch3>第21–25天 · 管理风险\u003c/h3>\u003cp>第17–20章。目标：能计算坏情境，并写自己的执行规则。\u003c/p>\u003cp>第25天复习：10,000元账户60%股票、40%现金，股票跌40%且现金不变，账户剩多少？写下定投和分散为何不能保本。\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>股票6000→3600，加现金4000，总7600，组合亏24%。定投改变入场路径，分散减少部分个别风险，两者都不能消除市场风险。\u003c/p>\u003c/details>\u003c/section>\u003csection>\u003ch3>第26–30天 · 独立判断\u003c/h3>\u003cp>第21–24章。目标：能完成一份可复核的模拟投资决策。\u003c/p>\u003cp>第30天复习：提交第24章作业，按100分量表自评；重做所有错题。再用5分钟解释自己的资金、产品、成本与最坏情境。\u003c/p>\u003cdetails>\u003csummary>复习核对标准\u003c/summary>\u003cp>80分及以上且关键错误全部纠正视为基础练习通过。记录错误来自概念、计算还是缺资料，并指定要重做的章节。无需为完成课程进行真实交易。\u003c/p>\u003c/details>\u003c/section>\u003carticle class=\"chapter reading\" id=\"c1\">\u003cdiv class=\"eyebrow\">CHAPTER 1\u003c/div>\u003ch1>先安排钱，再认识股票\u003c/h1>\u003cp>确定学习目标与可承受的损失\u003c/p>\u003cdiv class=\"goal\">能把生活用钱、备用金和可承担风险的钱分开。\u003c/div>\n\u003ch2>先回答一个实际问题\u003c/h2>\u003cp>你有 30,000 元，半年后要交 20,000 元学费，日常备用金还需要 8,000 元。能拿来体验股票的钱最多只有剩下的 2,000 元；如果还有其他必需支出，可能一分钱也不该投入。股票账户里的钱会波动，卖出也未必能立即取回。\u003c/p>\n\u003cp>\u003cstrong>投资\u003c/strong>是用今天的资金换取未来可能产生的回报，并承担结果不确定的风险。\u003cstrong>储蓄\u003c/strong>侧重资金保管和流动性；\u003cstrong>交易\u003c/strong>更强调买卖时点与价格变化。长期持有不自动等于投资，频繁操作也不自动意味着专业。\u003c/p>\n\u003ch2>用三个账户思考，不一定真的开三个账户\u003c/h2>\u003col>\u003cli>\u003cstrong>已知支出：\u003c/strong>房租、学费、医疗、还款等，按实际日期留够。\u003c/li>\u003cli>\u003cstrong>应急备用：\u003c/strong>收入突然中断仍能维持生活的钱。可用“必要月支出 × 能覆盖的月数”估算；月数取决于收入稳定性和家庭责任，不是统一规定。\u003c/li>\u003cli>\u003cstrong>长期风险资金：\u003c/strong>短期不需动用，即使大幅缩水也不影响基本生活的部分。\u003c/li>\u003c/ol>\n\u003ch2>风险承受能力，要用人民币表达\u003c/h2>\u003cp>“我能接受风险”太抽象。假设你准备投入 10,000 元，账户跌到 7,000 元时，会不会影响支出、睡眠或迫使你借款？若答案是会，就应缩小投入、降低权益比例或继续模拟。承受亏损的经济能力和心理意愿是两回事，按更弱的一项安排。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>贯穿课程的学习者：小林（虚构）\u003c/b>\u003cp>小林把生活费和备用金留在课程之外，用 10,000 元\u003cstrong>模拟资金\u003c/strong>学习。第一目标不是每月赚多少，而是能解释买的是什么、算清费用、识别不能承受的损失、写下退出条件。本课程不替小林决定真实资金比例。\u003c/p>\u003c/div>\n\u003ch2>第一天做一张资金说明书\u003c/h2>\u003cp>写下：资金用途、最早用钱日期、是否有借款、能承受的人民币损失、每周可投入的学习时间。若存在高成本债务、短期刚需或无法判断风险，先学习而不买入同样完成了当天任务。融资、期权、期货、杠杆 ETF 不属于这条新手路线。\u003c/p>\n\u003cp class=\"note\">本课程是金融知识教育与模拟练习，不提供个性化荐股或收益保证。完成课程意味着具备基础判断流程，不意味着已能持续盈利。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>小林有 30,000 元，已知支出 20,000 元、备用金需求 8,000 元。写出理论剩余金额，并说明为什么这不是“必须投入金额”。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>30,000−20,000−8,000＝2,000 元。还需检查其他责任、时间和承受能力；可以全部不投入。模拟学习无需真实资金。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>半年后必须使用的钱，最适合如何处理？\u003c/p>\u003col type=\"A\">\u003cli>趁现在买股票，半年后卖出\u003c/li>\u003cli>先保证用途和可用性，不把它当作风险资金\u003c/li>\u003cli>买足够多只股票就不会亏\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。分散投资不能保证半年后的本金，资金用途先于收益目标。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c2\">\u003cdiv class=\"eyebrow\">CHAPTER 2\u003c/div>\u003ch1>买股票，究竟买到了什么\u003c/h1>\u003cp>用一家早餐店理解股权、市值和分红\u003c/p>\u003cdiv class=\"goal\">能区分股价、市值、企业现金与股东收益。\u003c/div>\n\u003ch2>从“晨光早餐店”开始\u003c/h2>\u003cp>假设一家店被分成 100 万份股权，每份是一股。你持有 1 万股，就拥有 1% 的股权。普通股代表公司所有权的一部分，通常包含按规则参与表决、分享分红等权利；它不是保证支付固定利息的借条。公司清算时，普通股股东在债权人之后获得剩余财产，可能没有剩余。\u003c/p>\n\u003cp>公司第一次发行股票募集资金，属于发行环节。你后来从另一个投资者手里买入已上市股票，多数情况下钱付给卖方，不是直接汇进公司经营账户。因此，股价今天跌 5%，不代表公司银行存款当天减少 5%。\u003c/p>\n\u003ch2>股价与市值，是单价与整家公司价格\u003c/h2>\u003cdiv class=\"formula\">总市值 ＝ 每股价格 × 总股数\u003c/div>\u003cp>早餐店总股数 100 万股、每股 10 元，市值为 1,000 万元。甲公司股价 5 元、股数 100 亿股，市值 500 亿元；乙公司股价 50 元、股数 1 亿股，市值 50 亿元。不能凭“5 元比 50 元低”就说甲便宜。后面还要看每股利润和风险。\u003c/p>\n\u003ch2>赚钱有两个直接来源\u003c/h2>\u003cp>一是以更高价格卖出产生价差；二是公司决定发放的现金分红。公司盈利不等于全部分红，公司亏损时股价也可能因市场预期上涨。你的回报同时取决于经营结果、买入价格、卖出价格、分红和交易成本。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>演示：分红不是多出一笔“免费钱”\u003c/b>\u003cp>假设持有 100 股，除息前每股 10 元，每股分红 0.50 元。忽略税费和市场变化，除息参考价约为 9.50 元：股票价值 950 元＋现金 50 元＝原来的 1,000 元。实际开盘和收盘价格仍由交易决定。\u003c/p>\u003c/div>\n\u003ch2>另外三个经常出现的词\u003c/h2>\u003cp>\u003cstrong>流通股\u003c/strong>是按相应规则可以在市场交易的股份，流通市值和总市值的口径可能不同。\u003cstrong>增发\u003c/strong>增加股数，如果利润没有同步增加，每股能分到的利润可能下降。\u003cstrong>回购\u003c/strong>是公司买回自身股份；是否注销、买入价格和资金来源决定它的影响，看到“回购”两个字不能直接认定利好。\u003c/p>\n\u003cp>\u003cstrong>股票与债券：\u003c/strong>买股票承担经营剩余风险，回报不固定；买债券一般拥有约定本息的债权，但仍有违约与价格风险。银行存款、货币基金、债券基金、股票 ETF 也不是同一种东西。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>公司有 2 亿股，每股 12 元；你持有 1,000 股。算总市值、你的持股比例和持仓市值。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>总市值 24 亿元；持股比例 1,000÷200,000,000＝0.0005%；持仓市值 12,000 元。持仓市值不等于卖出后净到手金额，尚有费用和成交价格变化。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>两家公司股价分别为 5 元和 50 元，能直接判断谁便宜吗？\u003c/p>\u003col type=\"A\">\u003cli>5 元的便宜\u003c/li>\u003cli>50 元的更优质\u003c/li>\u003cli>不能，还需股数、利润、资产和风险\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>C。单股价格缺少股数与经营能力的分母。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing\">Investor.gov：投资入门\u003c/a> · \u003ca href=\"https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf\">财税〔2015〕101号：股息红利差别化个人所得税\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c3\">\u003cdiv class=\"eyebrow\">CHAPTER 3\u003c/div>\u003ch1>价格为什么会涨跌\u003c/h1>\u003cp>把公司表现、市场预期与成交区分开\u003c/p>\u003cdiv class=\"goal\">能解释利好下跌、报价不成交和价格波动。\u003c/div>\n\u003ch2>价格是成交结果，不是“正确答案”\u003c/h2>\u003cp>有人愿以 10.00 元卖出，有人愿以 9.99 元买入，双方还没谈拢。若买方改为愿付 10.00 元且有相应卖量，就可能成交。行情里的最新价通常是最近一笔成交价，不是市场保证你能买到或卖出的价格。\u003c/p>\n\u003cp>\u003cstrong>买一\u003c/strong>是当前最高买价，\u003cstrong>卖一\u003c/strong>是当前最低卖价；两者差叫买卖价差。档位上的数量会随成交、撤单变化，也可能存在队列。你看到的截图只能说明那个时点的状态。\u003c/p>\n\u003ch2>企业变好，股票也可能下跌\u003c/h2>\u003cdiv class=\"case\">\u003cb>预期与实际\u003c/b>\u003cp>市场原本期待早餐公司今年利润增长 30%，结果只增长 10%。利润确实上升，但低于部分投资者预期，报价可能下降。反过来，一家公司亏损缩小，也可能因结果好于预期而上涨。这只是解释机制，不能凭新闻标题反推出唯一原因。\u003c/p>\u003c/div>\n\u003ch2>三个层次共同影响价格\u003c/h2>\u003col>\u003cli>\u003cstrong>经营：\u003c/strong>销量、价格、成本、竞争、现金回收改变未来赚钱能力。\u003c/li>\u003cli>\u003cstrong>估值：\u003c/strong>即使利润相同，利率、风险偏好、增长信心变化，也会改变人们愿意付的倍数。\u003c/li>\u003cli>\u003cstrong>短期交易：\u003c/strong>资金需求、集中买卖、流动性和情绪会影响某一时点的成交。\u003c/li>\u003c/ol>\u003cp>价格上涨不能证明公司经营变好，价格下跌也不能自动证明“被低估”。先把事实和解释分开：事实是“公告写了什么、价格变了多少”；解释是“可能由于什么”，仍需证据。\u003c/p>\n\u003ch2>投资者实际要做什么\u003c/h2>\u003cp>每次看到消息，先写四句：发生了什么？影响收入、成本或现金的哪一项？是否已被普遍预期？影响有多大且能持续多久？答不出最后两句时，把它放入观察清单，比编一个确定性故事有用。\u003c/p>\n\u003cp>\u003cstrong>牛市、熊市、震荡\u003c/strong>是对一段行情的描述，划分方法并不完全统一，不是精确开关。“大盘涨”往往指某个指数上涨，不等于所有股票都涨。\u003cstrong>成交量\u003c/strong>表示交易数量，\u003cstrong>成交额\u003c/strong>表示交易金额；成交活跃不等于价格未来必涨。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>某公司利润增长 15%，股价当天跌 4%。写出至少两种可能解释，以及验证它们需要的证据。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>可能低于市场原先预期，需看此前业绩指引与可核实的预期；也可能估值回落或市场整体下跌，需对照行业、指数和利率等。还可能存在新风险。仅凭两项数据不能确定原因。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>最新成交价是 10 元，是否保证现在能按 10 元买入？\u003c/p>\u003col type=\"A\">\u003cli>保证\u003c/li>\u003cli>不保证，要看卖盘、数量及订单规则\u003c/li>\u003cli>只有上午保证\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。最新价是历史成交，当前可成交报价可能已变化。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c4\">\u003cdiv class=\"eyebrow\">CHAPTER 4\u003c/div>\u003ch1>先算明白赚亏，再谈收益率\u003c/h1>\u003cp>总回报、复利、回撤与回本\u003c/p>\u003cdiv class=\"goal\">能计算包含现金分红和费用的回报，理解涨跌不对称。\u003c/div>\n\u003ch2>100 元利润，到底算赚得多吗\u003c/h2>\u003cp>投入 1,000 元赚 100 元是 10%；投入 10,000 元赚 100 元是 1%。比较收益前必须确认本金、时间、费用、分红、是否追加资金。只截一张“今日盈利”不能说明完整投资表现。\u003c/p>\n\u003cdiv class=\"formula\">单次总收益 ＝ 卖出净所得 ＋ 持有期现金分红净额 − 买入总成本\u003cbr>收益率 ＝ 总收益 ÷ 买入总成本\u003c/div>\n\u003cdiv class=\"case\">\u003cb>完整算例\u003c/b>\u003cp>买入 100 股，每股 10 元，买入费用 5 元；每股收到税后分红 0.20 元；后来以 11 元卖出，卖出总费用 6 元。成本 1,005 元；净卖出款 1,094 元；分红 20 元；净收益 109 元；收益率 109÷1,005≈10.85%。这些费用为教学假设。\u003c/p>\u003c/div>\n\u003ch2>涨跌不对称\u003c/h2>\u003cp>100 元先跌 20% 变 80 元，再涨 20% 只有 96 元。要从 80 回到 100，需要涨 25%。跌 50% 需要涨 100% 才回本；跌 80% 需要涨 400%。所以控制大损失比寻找一个漂亮的平均收益更重要。\u003c/p>\u003cdiv class=\"formula\">亏损 d 后回本所需涨幅 ＝ d ÷ (1−d)，其中 0≤d&lt;1\u003c/div>\n\u003ch2>复利会放大收益，也会复合亏损\u003c/h2>\u003cp>假设每年回报都为 5%，且收益全部再投入，10,000 元两年后为 10,000×1.05²＝11,025 元。这是数学情境，不是股票每年能拿到 5% 的承诺。先涨 50% 再跌 50%，最终为本金的 75%，不能用算术平均的“0%”描述结果。\u003c/p>\n\u003ch2>回撤与年化\u003c/h2>\u003cp>\u003cstrong>回撤\u003c/strong>是从此前净值高点下降的幅度。账户从 10,000 涨至 12,000，再跌到 9,000，虽然相对最初本金亏 10%，从高点的回撤却是 25%。\u003cstrong>年化回报\u003c/strong>把区间回报换算为一年可比的复合速度；短时间的年化尤其不能当作可持续预测。\u003c/p>\u003cp>无外部资金进出的多年年化可用 (期末资产÷期初资产)^(1÷年数)−1。中途有定投、转入转出时，直接套这个式子会失真；后面用带日期的现金流理解真实体验。比较基金时还要区分价格指数与包含分红的全收益指数。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>10,000 元先涨 10%，再跌 10%；另一账户从高点 20,000 跌至 15,000。分别算期末金额、回撤与回本涨幅。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>第一账户 10,000×1.1×0.9＝9,900 元，亏 1%。第二账户回撤 25%，从 15,000 回到 20,000 要涨 33.33%。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>下跌 30% 后需要上涨多少才能回到原值？\u003c/p>\u003col type=\"A\">\u003cli>30%\u003c/li>\u003cli>42.86%\u003c/li>\u003cli>60%\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。剩余 70%，30÷70≈42.86%。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing\">Investor.gov：投资入门\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c5\">\u003cdiv class=\"eyebrow\">CHAPTER 5\u003c/div>\u003ch1>账户、券商与第一张交易清单\u003c/h1>\u003cp>认识交易链条，练习操作前的核对\u003c/p>\u003cdiv class=\"goal\">能区分证券账户、资金账户、银行账户与可用可取资金。\u003c/div>\n\u003ch2>钱和股票分别在哪里\u003c/h2>\u003cp>\u003cstrong>证券账户\u003c/strong>记录你名下的证券权益；\u003cstrong>券商资金账户\u003c/strong>用于证券交易资金的结算与显示；\u003cstrong>银行账户\u003c/strong>与资金账户之间通过银证转账划转资金。证券公司提供交易服务，交易所在规则下撮合买卖，中国结算等机构承担相应登记结算职责。App 是入口，不是这些职责本身。\u003c/p>\n\u003ch2>选券商，先核身份与服务\u003c/h2>\u003cp>从证监会、证券业协会等官方入口核对机构身份，再使用券商官网提供的官方 App。检查股票与 ETF 的佣金分别是多少、最低收费怎么约定、展示费率是否包括经手费等项目、是否另列过户费，以及客服和交易记录是否容易取得。不要只比较广告里的一个低数字。\u003c/p>\n\u003cp>开户通常涉及身份证件、本人银行卡、身份核验和风险测评；不同账户状态、年龄、产品权限有不同要求。风险测评如实回答，不为开通高风险权限而选择不符合自己的答案。主板股票、创业板、科创板、北交所等权限并非一概相同，具体适当性要求看券商当前流程。本课程先练普通沪深主板与普通股票 ETF。\u003c/p>\n\u003ch2>“可用”不等于“可取”\u003c/h2>\u003cp>卖出股票后，所得资金通常当天可用于证券交易，但一般要到下一交易日才可转出到银行；具体看结算与券商资金显示。周五卖出，遇正常周末不代表周六可取。下了未成交买单，部分资金也可能被冻结；撤单尚未成功时，不应把它当成已经释放。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>订单生命周期\u003c/b>\u003cp>小林点击提交买入 → 券商接受申报 → 交易所受理 → 等待或部分成交 → 全部成交或撤单。\u003cstrong>已报不等于已成，撤单请求不等于已撤。\u003c/strong>如果只成交 100 股而申报 300 股，已成交部分不能通过撤单取消。\u003c/p>\u003c/div>\n\u003ch2>每次提交前读一遍\u003c/h2>\u003col>\u003cli>证券全称与代码匹配吗？是股票、ETF，还是名称相似的其他产品？\u003c/li>\u003cli>方向是买入还是卖出？价格与数量对吗？预算含手续费吗？\u003c/li>\u003cli>账户有没有权限，产品有没有停牌、风险警示或特殊交易状态？\u003c/li>\u003cli>今天买入的部分何时能卖？订单的有效期和未成交部分如何处理？\u003c/li>\u003cli>交易后能否在成交记录与交割单中核对实际结果？\u003c/li>\u003c/ol>\n\u003cp class=\"note\">模拟网页只用于理解，不连接券商，也不会提交真实订单。验证码、密码和转账操作始终在本人确认的官方渠道完成。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>申报买入 300 股，状态显示已成交 100 股、余 200 股待成交。你申请撤单后应检查什么？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>检查剩余 200 股是否显示已撤、资金是否释放；保留已经成交的 100 股记录。不能把撤单请求当作全部 300 股交易被取消。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>证券卖出后“可用资金”增加，意味着一定可以立即转到银行吗？\u003c/p>\u003col type=\"A\">\u003cli>是\u003c/li>\u003cli>否，还要看可取资金和结算时间\u003c/li>\u003cli>只看银行卡余额\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。可用和可取对应不同的资金状态。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://one.sse.com.cn/onething/gptz/\">上交所：股票投资账户与交易服务\u003c/a> · \u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c6\">\u003cdiv class=\"eyebrow\">CHAPTER 6\u003c/div>\u003ch1>A 股交易规则速查\u003c/h1>\u003cp>按市场、板块和产品辨认规则\u003c/p>\u003cdiv class=\"goal\">能判断T+1、申报单位、涨跌幅与交易时段的适用范围。\u003c/div>\n\u003ch2>先确认自己买的属于哪一类\u003c/h2>\u003cp>A 股是境内发行、以人民币认购和交易的股票这一常用分类。沪深主板、科创板、创业板和北交所具有不同规则。ETF 是基金，不能因为也有六位代码，就套用全部股票规则。本课聚焦沪深普通主板股票与跟踪境内股票指数的普通 ETF。\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>规则核对日：2026-10-26。\u003c/strong>沪深交易规则于 2026-07-06 实施新版。以下摘要要和具体证券状态一起使用；未来修改不自动更新到离线版本。\u003c/div>\n\u003ch2>T+1 与申报数量\u003c/h2>\u003cp>普通 A 股和普通境内股票 ETF，当天新买入的部分通常不能当天卖出，要到下一交易日。T 是交易日，不是自然日。如果原来持有可卖的旧仓，当天卖出旧仓不代表当天新买入的仓位获得了 T+0 权利。\u003c/p>\u003cp>沪深主板股票竞价买入一般按 100 股或其整数倍申报；卖出余额不足 100 股的部分，应按规则一次性申报。普通 ETF 二级市场买卖通常以 100 份或其整数倍申报。科创板股票通常最低 200 股，之后可按 1 股递增等，不能把“一手 100 股”应用到所有板块。\u003c/p>\n\u003ch2>涨跌幅不是损失保险\u003c/h2>\u003cp>沪深主板普通股票通常为 10%；现行主板风险警示股票也为 10%，不要照抄旧教材的 5%。科创板与创业板通常为 20%，其中风险警示股票也应按所在板块规则识别。北交所一般为 30%。沪深首次公开发行上市股票前 5 个交易日等特定情形可能无价格涨跌幅限制。ETF 的涨跌幅要看品种与适用规则，常见有 10% 和 20%。\u003c/p>\n\u003cp>涨停、跌停只是允许申报价的边界。跌停时没有足够买方，想卖也可能卖不出；连续多个交易日下跌会累计造成远大于一天限制的损失。价格还涉及最小变动单位和价格笼子等申报约束，离最新价很远的限价单也可能被拒绝。\u003c/p>\n\u003ch2>普通交易日的时间轴（北京时间）\u003c/h2>\u003cul>\u003cli>\u003cstrong>9:15–9:25：\u003c/strong>开盘集合竞价；其中 9:20–9:25 不接受撤单。\u003c/li>\u003cli>\u003cstrong>9:30–11:30、13:00–14:57：\u003c/strong>连续竞价。\u003c/li>\u003cli>\u003cstrong>14:57–15:00：\u003c/strong>收盘集合竞价，不接受撤单。\u003c/li>\u003cli>\u003cstrong>15:05–15:30：\u003c/strong>符合规则的 A 股、ETF 盘后固定价格交易，按当日收盘价撮合，并非全天自由报价交易。具体品种状态、券商支持与申报安排需核对。\u003c/li>\u003c/ul>\n\u003cp>集合竞价把一段时间内申报按规则集中确定成交价；连续竞价随申报进行撮合。9:25–9:30 的券商接单不等于交易所已即时成交。交易日排除休市日，不能按工作日历自行推断节假日交易安排。\u003c/p>\n\u003ch2>新手只需记住这一套动作\u003c/h2>\u003cp>打开证券详情，核对市场与类别 → 查看当日涨跌幅与可卖数量 → 用允许的申报数量和价格 → 成交后查成交记录。对照“规则”操作，比背一张把所有证券混在一起的表更可靠。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>周五买入普通境内股票 ETF，周末无交易。能否周五卖出这批新买份额？若下周一休市，最早哪天？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>通常不能周五卖出新买份额；最早为下一个交易日，若周一休市且周二开市，则为周二。跨境、债券、黄金等 ETF 的部分品种有不同回转规则，不能混用。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>跌停价到了，止损单是否必然成交？\u003c/p>\u003col type=\"A\">\u003cli>会，交易所有保底买方\u003c/li>\u003cli>不会，成交仍依赖对手方与队列\u003c/li>\u003cli>会，只要多点几次\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。价格限制不提供流动性保证。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a> · \u003ca href=\"https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf\">深交所交易规则（2026年修订）全文\u003c/a> · \u003ca href=\"https://one.sse.com.cn/onething/gptz/\">上交所：股票投资一件事\u003c/a> · \u003ca href=\"https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html\">深交所：2026交易规则技术准备通知\u003c/a> · \u003ca href=\"https://www.bse.cn/jygl_list/200028217.html\">北京证券交易所交易规则（2026）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c7\">\u003cdiv class=\"eyebrow\">CHAPTER 7\u003c/div>\u003ch1>亲手走完一笔限价买卖\u003c/h1>\u003cp>报价、盘口、部分成交与滑点\u003c/p>\u003cdiv class=\"goal\">能解释限价单成交逻辑，识别成交价格与数量的不确定性。\u003c/div>\n\u003ch2>限价单约束价格，不保证成交\u003c/h2>\u003cp>买入限价 10.02 元，表示你接受以不高于 10.02 元的价格买入；卖出限价 10.02 元，表示你接受以不低于 10.02 元的价格卖出。它不是“必须以恰好 10.02 元成交”。市价类订单更重视迅速匹配，但具体类型、保护限价和可用时段不同，新手先用限价理解全过程。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>冻结盘口演示，实际行情会变化\u003c/b>\u003cp>卖一：10.00 元、200 股；卖二：10.01 元、300 股；卖三：10.03 元、500 股。小林发出限价 10.01 元、数量 400 股的买单。假设没有其他订单抢先，也没有撤单，成交可能是 200 股×10.00＋200 股×10.01＝4,002 元，平均价为 10.005 元。单笔成交价仍遵守报价最小单位，平均成本可以出现更多小数。\u003c/p>\u003cp>如果小林发出 600 股的买单，现有 10.01 元及以下卖量只有 500 股；剩余 100 股可能继续排队，不能自动按 10.03 元购买。\u003c/p>\u003c/div>\n\u003ch2>为什么“我明明看见那个价”却没成交\u003c/h2>\u003cp>行情到达你屏幕、你提交订单、订单到达交易所需要时间。卖量可能已经被买走，也可能撤单。通常按价格优先、同价时间优先等规则撮合，你的单子还有排队顺序。买一卖一大额挂单不能证明某个神秘资金一定会维持价格。\u003c/p>\n\u003ch2>买卖价差与滑点\u003c/h2>\u003cp>假设买一 0.999、卖一 1.001，你立即买入再立即卖出，在报价不变且足量的简化情境下，仅价差就损失 0.002÷1.001≈0.20%，还没有算佣金。\u003cstrong>滑点\u003c/strong>是你预期的执行价格与实际成交价格的差异；在流动性不足或快速波动时可能更大。\u003c/p>\n\u003ch2>从申报到复盘的五步\u003c/h2>\u003col>\u003cli>确认价格、数量、资金是否足够，预留费用。\u003c/li>\u003cli>提交一次后查看订单状态，不因短暂等待重复点击。\u003c/li>\u003cli>部分成交时先核对实际成交，不盲目补发完整订单。\u003c/li>\u003cli>取消未成交部分后，等待撤单确认再决定是否重报。\u003c/li>\u003cli>成交后记录平均价、总金额、费用和未成交数量。\u003c/li>\u003c/ol>\u003cp>本课使用冻结盘口教机制，不模拟真实市场队列。真实操作还须遵守前一章的时段、涨跌幅与申报约束。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>仍用上述盘口，限价 10.00 元买入 300 股。在盘口不变、没有竞争订单时，能立即买到多少股？余单怎么办？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>只能立即买到 200 股，金额 2,000 元。剩余 100 股按订单规则等待，不会跨越限价去买 10.01 元。若希望取消余单，需要成功撤单。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>买入限价 10.01 元的含义是？\u003c/p>\u003col type=\"A\">\u003cli>一定按10.01成交\u003c/li>\u003cli>可按不高于10.01的价格成交，也可能不成交\u003c/li>\u003cli>可以自动提高到10.03\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。限价限制最差可接受价格，不保证数量和成交时间。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c8\">\u003cdiv class=\"eyebrow\">CHAPTER 8\u003c/div>\u003ch1>交易成本：小金额最容易算漏\u003c/h1>\u003cp>佣金、印花税、过户费与真实盈亏\u003c/p>\u003cdiv class=\"goal\">能独立复算股票及ETF的一次往返交易成本。\u003c/div>\n\u003ch2>先区分收费项目\u003c/h2>\u003cp>\u003cstrong>佣金：\u003c/strong>按与券商约定的费率与最低收费计算，股票和 ETF 的约定可能不同。常见报价“万分之二点五”即 0.025%，不是 2.5%。\u003cstrong>证券交易印花税：\u003c/strong>当前 A 股卖出环节有效税率为成交金额的 0.05%；买入不收。\u003cstrong>股票过户费：\u003c/strong>现行 A 股按成交金额 0.001% 双向收取。ETF 二级市场交易通常不征收股票交易印花税，也不按 A 股过户费模型计费。\u003c/p>\n\u003cp>券商报价可能包含经手费、证管费等项目，也可能单列。务必用交割单核对，不能把已包含的项目再加一次。此处以“佣金包含常规交易规费、股票过户费另列”的模型教学；不同账户合同与收费口径可能不同。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>股票往返：10 元买 1,000 股，11 元卖出\u003c/b>\u003cp>教学假设：佣金万 2.5、每笔最低 5 元；无分红，无其他费用，分别视为一笔完整委托。\u003c/p>\u003col>\u003cli>买入金额 10,000；佣金 max(2.50,5)＝5；过户费 0.10；总成本 \u003cstrong>10,005.10 元\u003c/strong>。\u003c/li>\u003cli>卖出金额 11,000；佣金 5；印花税 5.50；过户费 0.11；净所得 \u003cstrong>10,989.39 元\u003c/strong>。\u003c/li>\u003cli>净利润 \u003cstrong>984.29 元\u003c/strong>，收益率约 \u003cstrong>9.84%\u003c/strong>，少于裸价差的 10%。\u003c/li>\u003c/ol>\u003c/div>\n\u003ch2>为什么小单频繁买卖贵\u003c/h2>\u003cp>如果每笔最低佣金为 5 元，1,000 元交易的单边佣金就是 0.5%；买卖各一次仅佣金就接近 1%。这不是推荐把订单做大，而是提醒用足够的模拟练习避免为操作冲动付费。ETF 是否有最低收费、费率是否相同必须问清，不能默认所谓“免五”。\u003c/p>\n\u003ch2>ETF 还有持有成本\u003c/h2>\u003cp>管理费、托管费等通常在基金资产中按规则计提，体现在净值里；你一般不会每天收到一张扣费账单。比较基金净值表现时，它通常已反映相关费用，不应再次机械扣同一笔年费。买卖佣金、价差和溢折价仍是另一层成本。\u003c/p>\n\u003ch2>交割单怎么核对\u003c/h2>\u003cp>逐项检查交易日期、证券、方向、成交数量、成交均价、成交金额、佣金、印花税、过户费及资金发生额。分笔成交如何汇总收费按券商规则核实。计算器是估算，实际收费、四舍五入与结算结果以账户交割单为准。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>假设一只普通 ETF 以 2 元买 1,000 份，2.10 元卖出；佣金买卖各5元，无其他费用。净赚多少？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>买入总成本 2,005 元；卖出净额 2,095 元；净赚 90 元；收益率 90÷2,005≈4.49%。没有按股票模型额外征印花税或过户费。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>股票卖出印花税0.05%，卖出金额10,000元，税额是多少？\u003c/p>\u003col type=\"A\">\u003cli>0.5元\u003c/li>\u003cli>5元\u003c/li>\u003cli>50元\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。10,000×0.0005＝5元。费率百分数与小数换算容易错。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://jiangsu.chinatax.gov.cn/art/2023/8/28/art_8349_432258.html\">财政部、税务总局：证券交易印花税减半征收\u003c/a> · \u003ca href=\"https://www.sse.com.cn/services/tradingservice/charge/ssecharge/\">上交所收费一览表\u003c/a> · \u003ca href=\"https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml\">上交所ETF课堂：ETF优势与交易费用\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c9\">\u003cdiv class=\"eyebrow\">CHAPTER 9\u003c/div>\u003ch1>看懂行情页，停止猜测图形\u003c/h1>\u003cp>K线、成交量、复权与常见误读\u003c/p>\u003cdiv class=\"goal\">能从行情中读出事实，而不把技术图形当作预测保证。\u003c/div>\n\u003ch2>一根 K 线只有四个价格\u003c/h2>\u003cp>日 K 线概括一个交易日的开盘、最高、最低、收盘。实体表示开盘与收盘的区间，上下影线表示期间触及的极值。颜色按软件设置辨认，不能靠红绿本身判断涨跌。日 K 是一天，周 K 是一周；不同周期回答不同问题。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>亲手读一根线\u003c/b>\u003cp>开盘 10.00、最高 10.80、最低 9.70、收盘 10.40。实体范围 10.00–10.40，上影 0.40，下影 0.30；收盘高于开盘 4%。但若前一交易日收盘是 10.60，当日相对昨收反而下跌约 1.89%。所以“阳线”不一定意味着相对昨收上涨。\u003c/p>\u003c/div>\n\u003ch2>三个辅助数字\u003c/h2>\u003cp>\u003cstrong>成交量：\u003c/strong>交易数量，单位可能是股、手或份，必须看标注。\u003cstrong>换手率：\u003c/strong>成交数量相对某个流通股本口径的比例，不同软件分母可能不同。\u003cstrong>振幅：\u003c/strong>常用当日最高与最低价差除以前收盘价。它们描述活跃度和波动，不证明买方一定比卖方“更聪明”。每一笔成交都有买方和卖方。\u003c/p>\n\u003ch2>均线只是平滑过的过去价格\u003c/h2>\u003cp>5 日简单移动平均线把最近 5 个收盘价加总除以 5。假设分别为 10、11、10、12、12，均线是 11。它能帮你描述过去趋势，但必然滞后。“金叉”“放量突破”即使定义清楚，也不能单凭名称保证获利，需要包含成本、样本外验证和失败情境；本课不把这些图形当买卖秘诀。\u003c/p>\n\u003ch2>除权除息与复权\u003c/h2>\u003cp>分红、送股会使价格出现机械调整。若每股分红 0.50 元，原 10 元附近的股价出现相应调整，不应直接当作经营突然恶化。\u003cstrong>不复权\u003c/strong>保留历史真实报价；\u003cstrong>前复权、后复权\u003c/strong>按各自方法调整历史序列以便比较，显示价格可能并非当日可成交价。分析同一趋势必须使用一致口径。\u003c/p>\n\u003ch2>一分钟读行情的顺序\u003c/h2>\u003col>\u003cli>核对证券名称、代码、产品类型和是否停牌。\u003c/li>\u003cli>读现价、涨跌幅的比较基准，确认数据时间。\u003c/li>\u003cli>看买卖报价与数量，估计交易摩擦。\u003c/li>\u003cli>看所选时间范围与复权口径，不从局部截图推断长期表现。\u003c/li>\u003cli>把经营判断留给财报和公告，把图形当作描述工具。\u003c/li>\u003c/ol>\n\u003cp>如果看到“主力净流入”，先看数据商如何按成交方向、单笔大小分类；它通常不是实名投资者资金流向，也不能单独识别所谓主力意图。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>某股昨收20，今开19.5、最高20.3、最低19.2、收盘19.8。它收阳还是收阴？相对昨收涨跌多少？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>收盘高于开盘，按通常定义为阳线；相对昨收为19.8÷20−1＝−1%。这说明K线实体方向和日涨跌幅的参照不同。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>均线向上意味着什么？\u003c/p>\u003col type=\"A\">\u003cli>明天必涨\u003c/li>\u003cli>所用历史价格的平滑趋势向上\u003c/li>\u003cli>公司利润一定增长\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。均线从过去价格计算，不能单独保证未来或证明基本面。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c10\">\u003cdiv class=\"eyebrow\">CHAPTER 10\u003c/div>\u003ch1>指数：给一篮子股票做温度计\u003c/h1>\u003cp>理解宽基、行业、权重与分红口径\u003c/p>\u003cdiv class=\"goal\">能解释指数与基金的区别，并识别重复和集中暴露。\u003c/div>\n\u003ch2>指数是一套规则和计算结果\u003c/h2>\u003cp>指数制定选样、权重和调整规则，然后把一组证券的变动汇总成一个数字。你不能直接买一串“指数点数”，通常通过跟踪它的基金获得类似的市场暴露。指数上涨 1%，不代表每只成份股都上涨 1%。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>三个成份的虚构指数\u003c/b>\u003cp>甲权重50%、乙30%、丙20%；当天收益分别为+2%、−1%、0%。在权重不变的简化情境下，指数收益≈50%×2%＋30%×(−1%)＋20%×0%＝\u003cstrong>0.7%\u003c/strong>。最大的成份对结果影响更大。\u003c/p>\u003c/div>\n\u003ch2>真实例子：沪深 300\u003c/h2>\u003cp>中证指数公司的沪深 300 指数选择沪深市场中规模大、流动性好的 300 只证券作为样本，旨在反映其整体表现。它按编制方案选样与加权，不是“每只买三百分之一”，也不是挑出未来最能涨的 300 只。样本会调整，今天的名单不能拿来无偏地回算过去。\u003c/p>\n\u003ch2>宽基、行业和主题\u003c/h2>\u003cp>\u003cstrong>宽基指数\u003c/strong>通常覆盖较多行业，但仍可能集中于某些大公司、风格或单一国家。\u003cstrong>行业指数\u003c/strong>聚焦银行、医药等特定行业。\u003cstrong>主题指数\u003c/strong>按某个主题选择公司，可能横跨行业，选样定义尤其重要。“新能源”“高股息”等名字不告诉你完整风险。\u003c/p>\u003cp>不同指数可能覆盖大盘、中盘、小盘公司，或偏价值、成长等特征。小市值不自动等于高成长，高股息不自动等于低风险。要看实际成份和权重，而不是根据名称贴标签。\u003c/p>\n\u003ch2>价格指数与全收益指数\u003c/h2>\u003cp>价格指数通常不把成份股分红按再投资方式全部计入；全收益指数考虑分红再投资。若基金收益中已经包含分红，却拿来对比未计分红的价格指数，可能夸大基金的相对表现。指数基点是计算起点，3,000 点不天然比4,000点便宜，也无法在不同指数之间比较贵贱。\u003c/p>\n\u003ch2>看懂一页指数资料\u003c/h2>\u003cp>依次读编制目标、样本空间、选样规则、加权方式、调整频率、前十大成份、行业权重和收益口径。真正需要回答的是：“我暴露在什么经营风险里？”同时买两只高度重叠的宽基 ETF，可能只是把同一篮子重复买了两遍。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>指数甲含某行业40%，你又买一只100%投该行业的基金，二者各占组合一半。该行业合计暴露多少？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>50%×40%＋50%×100%＝70%。持有两个基金不等于风险均匀分散。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>不同指数的3000点和5000点，能直接比较哪个便宜吗？\u003c/p>\u003col type=\"A\">\u003cli>可以，3000点更便宜\u003c/li>\u003cli>不能，基点与构成不同\u003c/li>\u003cli>5000点说明回报更高\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。指数点位不是跨指数可比的估值。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://csi-web-dev.oss-cn-shanghai-finance-1-pub.aliyuncs.com/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000300_Index_Methodology_cn.pdf\">中证指数：沪深300指数编制方案\u003c/a> · \u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c11\">\u003cdiv class=\"eyebrow\">CHAPTER 11\u003c/div>\u003ch1>ETF：买入一篮子资产的入口\u003c/h1>\u003cp>净值、交易价格、申赎与溢价\u003c/p>\u003cdiv class=\"goal\">能区分ETF市场价与净值，计算溢价消失的损失。\u003c/div>\n\u003ch2>ETF 的两个层面\u003c/h2>\u003cp>ETF 是交易型开放式基金，普通投资者可以在交易所买卖基金份额。本课程主要讲\u003cstrong>跟踪境内股票指数的 ETF\u003c/strong>：基金依合同持有组合并力求实现跟踪目标。ETF 这个交易结构本身不保证低风险，也不意味着所有 ETF 都是被动产品；2026 年已出现主动 ETF 获批进展。\u003c/p>\n\u003cp>\u003cstrong>二级市场买卖\u003c/strong>是你与其他参与者交易份额，像买卖股票一样看报价。\u003cstrong>一级市场申购赎回\u003c/strong>是按基金要求，用一篮子证券或现金等与基金交换份额，门槛和细节不同。新手在券商里输入几百份买单通常是前者，不要误以为能按净值无限申赎套利。\u003c/p>\n\u003ch2>三个价格不要混在一起\u003c/h2>\u003cul>\u003cli>\u003cstrong>基金份额净值：\u003c/strong>基金资产扣负债后，平均到每一份的价值，按披露规则计算。\u003c/li>\u003cli>\u003cstrong>市场价格：\u003c/strong>交易所里实际买卖形成的价格，可以偏离净值。\u003c/li>\u003cli>\u003cstrong>IOPV：\u003c/strong>盘中参考净值估算，是参考，不是保证可成交或可兑付的报价。\u003c/li>\u003c/ul>\n\u003cdiv class=\"formula\">参考溢价率 ＝ 市场价格 ÷ 可比参考净值 − 1\u003c/div>\n\u003cdiv class=\"case\">\u003cb>底层没跌，为什么我亏了？\u003c/b>\u003cp>参考净值1.00元，你以1.10元买入，溢价10%。之后净值仍为1.00元，但市场价回到1.00元，你的价格损失是(1−1.10)÷1.10＝\u003cstrong>−9.09%\u003c/strong>。这来自溢价回落，尚未计算交易费。\u003c/p>\u003c/div>\n\u003ch2>为什么套利不能保证价格永远贴住净值\u003c/h2>\u003cp>申赎机制通常有助于约束偏离，但参与者受成本、资金、申赎额度、证券停牌、市场时差等影响。跨境 ETF 的境外市场可能尚未开盘，IOPV 会使用较旧价格；汇率也在变化。看到一个溢价数字，先确认时点、估值来源和申赎状态，不直接把它当可获利机会。\u003c/p>\n\u003ch2>分红、T+1 和风险\u003c/h2>\u003cp>成份股分红先成为基金资产的一部分；基金是否向份额持有人分红要按合同和公告。每份净值2元、分红0.10元，其他条件不变时净值约降至1.90元，财富没有凭空增加。普通境内股票 ETF 二级买入通常 T+1；黄金、债券、货币和符合条件的跨境等品种可能有不同回转安排。\u003c/p>\u003cp>ETF 仍会遭遇底层资产下跌、集中风险、跟踪偏离、交易流动性不足及清盘等风险。清盘不是基金净值必然归零，但可能迫使你在不合适时间结束持仓，并经历清算过程。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>同一时点估计净值2.00、市场价2.06；随后净值不变而价格回到2.00。算溢价和价格损失。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>溢价=2.06÷2−1=3%；买入后的损失=2÷2.06−1≈−2.91%，尚未扣费。净值/IOPV本身还可能存在时点误差。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>IOPV 最合适的理解是？\u003c/p>\u003col type=\"A\">\u003cli>保证能卖出的价格\u003c/li>\u003cli>盘中参考估值，可能有时差或误差\u003c/li>\u003cli>明日收盘价预测\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。参考估值与可成交的盘口价格不是一回事。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html\">深交所：2026交易规则技术准备通知\u003c/a> · \u003ca href=\"https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html\">深交所：场内基金投资交易指南\u003c/a> · \u003ca href=\"https://www.szse.cn/aboutus/trends/news/t20261019_623374.html\">深交所：首批主动ETF正式获批\u003c/a> · \u003ca href=\"https://investor.szse.cn/knowledge/fund/trade/t20191106_571787.html\">深交所：ETF权益分派与除息\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c12\">\u003cdiv class=\"eyebrow\">CHAPTER 12\u003c/div>\u003ch1>怎样比较两只同类 ETF\u003c/h1>\u003cp>一张能实际使用的筛选清单\u003c/p>\u003cdiv class=\"goal\">能把指数、费率、跟踪表现和交易成本放在同一张判断表里。\u003c/div>\n\u003ch2>第一步先选风险暴露，再比较产品\u003c/h2>\u003cp>两只基金只有在跟踪目标、收益口径等可比时，费率比较才有意义。宽基 ETF 和半导体主题 ETF 即使都叫“ETF”，风险结构差别很大。先解释指数包含什么，再问哪只实现这个目标更合适。\u003c/p>\n\u003ch2>六项实用检查\u003c/h2>\u003col>\u003cli>\u003cstrong>跟踪对象：\u003c/strong>指数全称和代码、成份与行业集中度。\u003c/li>\u003cli>\u003cstrong>持有成本：\u003c/strong>管理费、托管费及其他披露费用，检查生效日期。\u003c/li>\u003cli>\u003cstrong>跟踪表现：\u003c/strong>同一时期、同一收益口径下与基准差多少。\u003c/li>\u003cli>\u003cstrong>交易质量：\u003c/strong>买卖价差、足量盘口、实际成交活跃度和溢折价。\u003c/li>\u003cli>\u003cstrong>规模与运营：\u003c/strong>基金规模、存续情况、清盘条款与申赎是否受限。\u003c/li>\u003cli>\u003cstrong>个人执行：\u003c/strong>券商 ETF 佣金、最低收费、计划金额与买卖频率。\u003c/li>\u003c/ol>\n\u003ch2>跟踪差异与跟踪误差\u003c/h2>\u003cp>教学中定义\u003cstrong>跟踪差异＝基金区间回报−基准区间回报\u003c/strong>，要在具体资料中确认符号口径。例如基准涨10%，基金涨9.6%，差异−0.4个百分点。\u003cstrong>跟踪误差\u003c/strong>描述基金与基准回报差在各期的波动，常用统计指标计算。长期略落后但很稳定，与时而大赢时而大输，是不同情况。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>同一指数的虚构产品 A / B\u003c/b>\u003cp>A：管理+托管年费合计0.20%，典型价差0.10%；B：年费0.15%，典型价差0.50%。假设持有10,000元一年且资产规模不变，B的年费优势约5元；但一次额外0.40个百分点的交易摩擦就是40元。真实价差会变化，不能用一张截图得出永久结论。\u003c/p>\u003cp>若你持有很多年、交易次数很少，年费的重要性会提升；若订单很小，最低佣金可能成为主要成本。没有一个排序能适合所有金额和期限。\u003c/p>\u003c/div>\n\u003ch2>ETF、ETF 联接与场外指数基金\u003c/h2>\u003cp>ETF 通过证券账户在交易所按市价买卖，通常存在份额单位和交易费用。联接基金主要投资目标 ETF；场外指数基金按相应申赎安排、以基金净值确认，存在确认和到账时间差。A/C份额收费结构可能不同，不能只看字母就决定。比较实际金额、持有期、费用和便利性，而不是争论某一种永远更好。\u003c/p>\n\u003ch2>避开三个“看起来很简单”的错误\u003c/h2>\u003cp>不因为每份1元就比每份4元更便宜；不按去年涨幅榜直接选冠军；不把“规模最大”当作不存在风险。实际产品资料可能更新，决策前至少核对最新产品资料概要、招募说明书更新和近期公告。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>A与B同指数，你只知道B年费低0.05个百分点。还需要哪三类资料才能判断？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>至少需要实际可成交价差/盘口与溢价、同口径跟踪表现、券商佣金及计划持有金额和期限；还应看规模和最新公告。单看年费不足以决定。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>跟踪差异−0.4个百分点意味着？\u003c/p>\u003col type=\"A\">\u003cli>基金一定亏0.4%\u003c/li>\u003cli>在定义口径下基金回报比基准低0.4个百分点\u003c/li>\u003cli>基金明天会补涨\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。相对落后不等于绝对亏损，也不存在自动补涨保证。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml\">上交所ETF课堂：ETF优势与交易费用\u003c/a> · \u003ca href=\"https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html\">深交所：场内基金投资交易指南\u003c/a> · \u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a>\u003
