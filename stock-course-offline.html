c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c13\">\u003cdiv class=\"eyebrow\">CHAPTER 13\u003c/div>\u003ch1>从生意看公司，不从故事选股\u003c/h1>\u003cp>收入、成本、竞争优势与增长的代价\u003c/p>\u003cdiv class=\"goal\">能用五句话说明一家公司如何赚钱及最脆弱的环节。\u003c/div>\n\u003ch2>先不看股价，描述生意\u003c/h2>\u003cp>买个股意味着承担一家具体企业的风险。先回答：卖什么、卖给谁、为什么客户选它、钱何时收回、什么会破坏利润。若只有“国家支持”“人工智能风口”“品牌很好”，仍未回答实际赚钱的过程。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>晨光早餐公司（虚构）\u003c/b>\u003cp>去年售出100万份早餐，平均每份10元，收入1,000万元；食材和直接制作成本600万元，毛利400万元；其他经营费用、税费等合计300万元，净利润100万元。这里各项为教学简化，实际报表分类更细。\u003c/p>\u003cp>今年销量仍100万份，平均价格升至11元，但成本升至660万元，其他合计340万元。收入1,100万元，净利润仍100万元。\u003cstrong>收入增长10%并没有带来利润增长。\u003c/strong>\u003c/p>\u003c/div>\n\u003ch2>增长从哪里来\u003c/h2>\u003cp>收入大致可拆成销量×价格；多产品公司还受结构变化影响。利润增长可能来自收入增长、单位成本下降、费用率下降，也可能来自卖资产等非经常项目。开新店带来收入增长，但需要装修和租金；收入不代表现金及时进账。\u003c/p>\n\u003ch2>竞争优势要有可观察证据\u003c/h2>\u003cp>品牌可能支持较强定价能力，规模可能摊薄成本，转换成本可能让客户不易离开。但“有护城河”不是结论，应转成证据：提价后销量是否保持、客户流失率如何、竞争者能否复制、毛利率是否稳定、获取客户是否越来越贵。\u003c/p>\n\u003ch2>识别周期与集中风险\u003c/h2>\u003cp>有些行业的价格和利润随供需周期大幅波动。景气高峰的利润可能让 PE 看起来非常低，却未必便宜。依赖一个大客户、一种原材料或单一地区的公司，可能在某个环节变化后迅速失去利润。竞争优势和脆弱点要同时记录。\u003c/p>\n\u003ch2>实用五句话模板\u003c/h2>\u003col>\u003cli>公司向谁出售什么，通过什么渠道收钱。\u003c/li>\u003cli>过去收入变化主要由销量、价格还是业务结构推动。\u003c/li>\u003cli>最重要的成本是什么，能否向客户转嫁。\u003c/li>\u003cli>与竞争者相比，有哪些能被数据检验的优势。\u003c/li>\u003cli>出现哪一项变化会使我的判断失效。\u003c/li>\u003c/ol>\u003cp>这份描述先于估值。无法说清业务时，改用分散的指数方案进行学习，或继续观察，并不比强行写出“看好”差。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>早餐公司销量增长20%，均价下降10%。收入大约增长多少？能否据此说利润也增长？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>收入倍率1.2×0.9=1.08，即增长8%。不能推断利润；还需食材、人工、租金、费用和税等信息。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>哪一项更能检验“定价能力强”？\u003c/p>\u003col type=\"A\">\u003cli>名字听起来高端\u003c/li>\u003cli>提价后销量、客户留存和利润率的实际变化\u003c/li>\u003cli>股吧里很多人看好\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。要用经营数据检验优势，而不是用印象。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c14\">\u003cdiv class=\"eyebrow\">CHAPTER 14\u003c/div>\u003ch1>三张财报：利润不是现金\u003c/h1>\u003cp>利润表、资产负债表、现金流量表\u003c/p>\u003cdiv class=\"goal\">能读取关键财务指标，并发现需要进一步核对的异常。\u003c/div>\n\u003ch2>三张表回答三个问题\u003c/h2>\u003cp>\u003cstrong>利润表：\u003c/strong>一段时间收入、成本和利润怎么样。\u003cstrong>资产负债表：\u003c/strong>某个时点有什么资产、欠多少债、股东剩多少权益。\u003cstrong>现金流量表：\u003c/strong>一段时间钱从哪里来、到哪里去。前者和后者是期间，资产负债表是时点，不能把季末余额当作一季度收入。\u003c/p>\n\u003cdiv class=\"formula\">资产 ＝ 负债 ＋ 所有者权益\u003c/div>\u003cp>资产包含现金、应收账款、存货、设备等；负债包含借款、应付款等；权益是会计意义上的剩余。账面价值不保证能按该价格全部变现，存货可能滞销，应收可能收不回。\u003c/p>\n\u003ch2>先抓七个指标\u003c/h2>\u003cul>\u003cli>\u003cstrong>营业收入：\u003c/strong>卖出的业务规模。\u003c/li>\u003cli>\u003cstrong>毛利率：\u003c/strong>(营业收入−营业成本)÷营业收入，观察产品和直接成本关系。\u003c/li>\u003cli>\u003cstrong>归母净利润：\u003c/strong>归属于母公司股东的利润，与整个集团净利润区分。\u003c/li>\u003cli>\u003cstrong>扣非归母净利润：\u003c/strong>剔除规定的非经常损益后看经营，但不等于完美“真实利润”。\u003c/li>\u003cli>\u003cstrong>经营现金流净额：\u003c/strong>经营活动实际产生的净现金。\u003c/li>\u003cli>\u003cstrong>有息负债与现金：\u003c/strong>同时看到期日、受限资金，不能只看总量。\u003c/li>\u003cli>\u003cstrong>ROE：\u003c/strong>利润相对净资产的回报，正式口径可能为加权平均；高杠杆也可能推高它。\u003c/li>\u003c/ul>\n\u003cdiv class=\"case\">\u003cb>赚了100万元，却只有20万元现金\u003c/b>\u003cp>虚构公司本期确认收入1,000万元、净利润100万元，但客户赊账使应收增加80万元。在其他项目不变的极简条件下，经营现金净流入可能只有20万元。利润确认在先、收钱在后，不能说其余80万元已躺在银行。\u003c/p>\u003c/div>\n\u003ch2>异常不是定罪，而是查证线索\u003c/h2>\u003cp>收入增长20%、应收增长80%，要看账期、客户、坏账准备与回款；存货持续快于销售增长，要看跌价和滞销；利润来自一次性卖资产，要看扣非与现金到账。单一比率不够判断财务造假，需要读附注和审计意见，并承认外部投资者的信息限制。\u003c/p>\n\u003ch2>怎么读才省时间\u003c/h2>\u003col>\u003cli>确认报告期、单位（元/万元/亿元）、合并口径、是否重述。\u003c/li>\u003cli>从主要财务数据看三年变化，不只看单年。\u003c/li>\u003cli>看经营讨论解释变化，再去报表附注找对应证据。\u003c/li>\u003cli>查看审计意见、关联交易、担保、受限资金与债务到期。\u003c/li>\u003cli>把不知道的项目记成问题，不用猜测补全。\u003c/li>\u003c/ol>\u003cp>同比比较去年同一期间；环比比较上一相邻期间。不要用旺季季度和淡季季度简单断言趋势，也不要把半年利润乘2当作可靠全年预测。银行等金融企业要用适合行业的指标，不能机械套制造业模板。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>公司资产500万元、负债300万元、全年净利润30万元，期初期末权益都为200万元。简化ROE是多少？负债增加能否让ROE看起来更高？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>权益500−300=200万元，简化ROE=30÷200=15%。在其他条件下，更小权益基数或更多杠杆可能推高ROE，因此不能单看高ROE就认定经营更安全。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>利润很高但经营现金流长期偏弱，首先应？\u003c/p>\u003col type=\"A\">\u003cli>直接断定造假\u003c/li>\u003cli>检查应收、存货、收付时点和业务特征\u003c/li>\u003cli>忽略，利润够高就行\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。差异是分析入口，需要用附注与持续数据解释。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf\">贵州茅台2025年年度报告\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c15\">\u003cdiv class=\"eyebrow\">CHAPTER 15\u003c/div>\u003ch1>估值：好公司也可能买贵\u003c/h1>\u003cp>PE、PB、股息率与情景估算\u003c/p>\u003cdiv class=\"goal\">能算基础估值，知道分母失真与估值回落的影响。\u003c/div>\n\u003ch2>价格必须配一个“买到了多少”\u003c/h2>\u003cp>同样20元一股，每股每年赚1元和赚2元，含义不同。\u003cstrong>每股收益EPS\u003c/strong>是按相应会计口径把归属于普通股股东的利润分摊到股份；实际基本/稀释EPS有加权股数等细节。入门先理解：每一股对应多少利润，而不是它一定分给你多少现金。\u003c/p>\n\u003cdiv class=\"formula\">PE（市盈率）＝ 股价 ÷ EPS\u003cbr>PB（市净率）＝ 股价 ÷ 每股净资产\u003cbr>历史股息率 ＝ 过去某期间每股现金分红 ÷ 当前股价\u003c/div>\n\u003cp>\u003cstrong>静态PE\u003c/strong>常用上一完整年度利润，\u003cstrong>TTM PE\u003c/strong>常用最近滚动12个月利润，\u003cstrong>预测PE\u003c/strong>用未来预测利润。分母不同，数值不能混比。亏损或极低利润下PE可能没有正常比较意义；不能把负PE理解为“超级便宜”。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>盈利增长，但估值压缩\u003c/b>\u003cp>早餐公司EPS为1元，市场愿意付20倍PE，股价20元。下一年EPS增长20%到1.20元，但市场只给15倍，情景价格变成18元。忽略分红，投资者仍损失10%。企业增长与投资回报之间隔着买入估值与退出估值。\u003c/p>\u003c/div>\n\u003ch2>做区间，不制造精确目标价\u003c/h2>\u003cp>假设下一年EPS可能为0.8、1.0、1.2元；你用12、15、18倍来观察敏感性，得到一组可能价格。这些倍数是教学假设，不是市场应当给出的“标准”。判断倍数至少需要考虑利润可持续性、增长、竞争、负债、利率与同业差异。\u003c/p>\n\u003cp>周期公司高峰利润可能压低PE；重资产企业PB要结合资产质量与ROE；轻资产企业账面资产较少，PB可比性可能弱。股息率高可能源于价格下跌，未来分红也可能减少。任何单个指标都不能替代业务分析。\u003c/p>\n\u003ch2>折现的直觉与安全余量\u003c/h2>\u003cp>如果一年后确定能拿到100元，假设你要求5%的年回报，今天对应价值是100÷1.05≈95.24元。企业未来现金既不确定，又跨越多年，折现率和增长假设稍变，结果可能很不一样。所谓安全余量，是为估计错误留下空间，不是给某个价格贴上绝对安全标签。\u003c/p>\u003cp>实用做法：写悲观、基准、乐观三种经营情境，明确每个数字从何而来，再看当前价格是否已经要求乐观情境才能成立。无法合理估计时，结论可以是“暂不参与”。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>EPS从2元变2.2元，PE从20倍降到16倍。价格从多少变多少？不计分红的回报是多少？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>起初40元，后来35.2元；35.2÷40−1=−12%。利润增长10%，但估值下降20%，共同结果是1.1×0.8−1=−12%。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>看到某股PE只有5倍，最先要核对？\u003c/p>\u003col type=\"A\">\u003cli>利润是否可持续、口径是否一致、是否处于周期高峰\u003c/li>\u003cli>立即买入\u003c/li>\u003cli>5倍意味着5年保证回本\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>A。PE是价格与利润的比值，不是保证的现金回本年限。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c16\">\u003cdiv class=\"eyebrow\">CHAPTER 16\u003c/div>\u003ch1>真实财报演示：先事实，后解释\u003c/h1>\u003cp>用贵州茅台2025年报练习读数\u003c/p>\u003cdiv class=\"goal\">能从年报提取数字并区分原始数据、公司解释和个人推断。\u003c/div>\n\u003ch2>这次换成真实、固定时间的数据\u003c/h2>\u003cp>案例使用上交所披露的\u003cstrong>贵州茅台2025年年度报告\u003c/strong>，不是实时行情，也不构成对该股票的买卖判断。报告第6页列有主要财务数据；读者无需离开本页即可做完基础练习，原文链接用于核验。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>合并口径指标\u003c/th>\u003cth>2024年\u003c/th>\u003cth>2025年\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>营业收入（亿元，约）\u003c/td>\u003ctd>1,708.99\u003c/td>\u003ctd>1,688.38\u003c/td>\u003c/tr>\u003ctr>\u003ctd>归母净利润（亿元，约）\u003c/td>\u003ctd>862.28\u003c/td>\u003ctd>823.20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>经营现金流净额（亿元，约）\u003c/td>\u003ctd>924.64\u003c/td>\u003ctd>615.22\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基本每股收益（元）\u003c/td>\u003ctd>68.64\u003c/td>\u003ctd>65.66\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第一步：复算，而不是看“大数字”\u003c/h2>\u003cp>营业收入同比约−1.21%，归母净利润同比约−4.53%，经营现金流净额同比约−33.46%。百分比使用报告披露值，表内亿元金额经四舍五入。只说“赚了823亿元”无法描述变化；也不能用利润下降幅度直接推断股价应当跌多少。\u003c/p>\n\u003ch2>第二步：找解释，别立即下结论\u003c/h2>\u003cp>报告说明，经营现金流变化主要与控股财务公司吸收集团成员存款减少、不可随时支取的同业存款增加有关。这是\u003cstrong>公司披露的解释\u003c/strong>，不应把整个现金流下降直接归因为终端卖酒回款恶化。仍需结合现金流科目、财务公司业务和销售回款进一步分析。\u003c/p>\n\u003ch2>第三步：演示估值，单独标明假设\u003c/h2>\u003cdiv class=\"case\">\u003cb>假设股价1,200元，并非当前报价\u003c/b>\u003cp>只用2025年基本EPS 65.66作简化静态演示：PE≈1,200÷65.66＝18.28倍。这既不是实时TTM PE，也没有包含2026年新财报的信息。真实判断要更新日期、股本及盈利口径，并分析未来经营；18.28本身不能说明便宜或昂贵。\u003c/p>\u003c/div>\n\u003ch2>第四步：写一张“未解决问题”清单\u003c/h2>\u003cp>收入结构是否变化？利润变化来自价格、销量、费用还是其他项目？现金流解释能否在附注中得到对应？当前价格包含何种预期？在没有回答这些问题前，完整且诚实的结论是：“已读懂这份报告的部分数据，尚不足以作出投资决定。”\u003c/p>\n\u003cp class=\"note\">财报摘录只是阅读方法的演示，不是一份完整公司研究。不要将母公司利润表与合并报表混用，也不要把报告中的分红预案直接当作已经实施的最终每股金额。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>用表中约数计算2025年经营现金流/归母净利润。能否仅因比值低于1就认定经营恶化？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>615.22÷823.20≈0.747，即约0.75。不能仅据此判断；需看业务结构、收付时点和报告解释，也需注意归母利润与合并现金流口径并非完全同一范围。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>用假设股价1200除以2025年EPS所得18.28倍，应该标注为？\u003c/p>\u003col type=\"A\">\u003cli>当前实时TTM市盈率\u003c/li>\u003cli>教学假设下的简化静态PE\u003c/li>\u003cli>官方合理估值\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。股价是假设，利润属于固定年度，不能冒充实时估值或官方结论。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf\">贵州茅台2025年年度报告\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c17\">\u003cdiv class=\"eyebrow\">CHAPTER 17\u003c/div>\u003ch1>风险与仓位：把失误控制在能承受的范围\u003c/h1>\u003cp>波动、永久损失、流动性和相关性\u003c/p>\u003cdiv class=\"goal\">能把单项投资的损失换算成对整个账户的影响。\u003c/div>\n\u003ch2>风险不只有价格上下跳动\u003c/h2>\u003cp>\u003cstrong>波动风险：\u003c/strong>短期价格变化，让用钱时点不确定。\u003cstrong>永久损失：\u003c/strong>公司长期经营恶化、稀释、破产或极高价买入等，可能使本金难以恢复。\u003cstrong>流动性风险：\u003c/strong>想卖时没有足量买方。\u003cstrong>集中风险：\u003c/strong>多项持仓同时受一个因素影响。\u003cstrong>行为风险：\u003c/strong>因为恐惧、冲动或借钱而违反原计划。\u003c/p>\n\u003ch2>仓位是风险的放大器\u003c/h2>\u003cdiv class=\"formula\">单项对组合的近似影响 ＝ 该项资金权重 × 该项收益率\u003c/div>\u003cdiv class=\"case\">\u003cb>同一笔亏损，不同账户后果\u003c/b>\u003cp>10,000元账户中，某只股票占1,000元，即10%仓位。它下跌30%，其他持仓不变，账户约损失300元，即3%。如果它占8,000元，相同跌幅会使账户损失2,400元，即24%。这只是静态情景，真实持仓可能同时下跌。\u003c/p>\u003c/div>\n\u003ch2>分散看底层，而不只看数量\u003c/h2>\u003cp>五只同一行业股票可能同时受需求下降影响；三只跟踪同一指数的 ETF 可能高度重叠。分散能减少部分个别公司风险，却不能消除整个市场下跌。现金也不是没有代价，它面临购买力变化和机会成本，但能提供用钱时的确定性。\u003c/p>\n\u003ch2>用压力情境反推比例\u003c/h2>\u003cp>假设只是教学：一个组合只有股票ETF与现金，现金名义金额不变。若股票部分下跌40%，你希望这一情境下组合损失不超过10%，则股票权重应不高于10%÷40%＝25%。实际市场可能跌得更多、不同资产会一起跌；这个算式不是风险上限保证，也不是为你推荐25%配置。\u003c/p>\n\u003ch2>止损计划的边界\u003c/h2>\u003cp>交易型策略可能事先设置价格退出条件，但跳空、跌停、停牌和T+1会使实际损失超过计划。长期投资也需要退出原则，例如核心经营判断失效、产品目标变化、资金用途改变、集中度过高。仅凭买入成本高低决定卖不卖，会忽略当前资产是否还符合目标。\u003c/p>\n\u003cp>“单笔最多亏500元”只有配合仓位和可执行退出方式才有意义。按计划止损距离算出的仓位，也不能把500元当绝对上限。对新手最可控的步骤是：不用杠杆、留足生活资金、把学习仓位做小、明确不可承受的情境。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>20,000元模拟账户，持有股票A 4,000元、股票ETF 6,000元、现金10,000元。A跌50%、ETF跌30%、现金不变，账户剩多少？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>A剩2,000，ETF剩4,200，加现金10,000，总计16,200元；损失3,800元，即19%。按单项权重算：20%×−50%＋30%×−30%=−19%。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>有5只基金就一定充分分散吗？\u003c/p>\u003col type=\"A\">\u003cli>一定，数量够了\u003c/li>\u003cli>不一定，要检查底层重叠与相关风险\u003c/li>\u003cli>只要来自不同基金公司就行\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。不同包装可能持有相同的公司或行业。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c18\">\u003cdiv class=\"eyebrow\">CHAPTER 18\u003c/div>\u003ch1>组合与再平衡：先有比例，再有动作\u003c/h1>\u003cp>建立投资规则，处理上涨和下跌后的偏离\u003c/p>\u003cdiv class=\"goal\">能计算组合权重，并区分再平衡与追涨杀跌。\u003c/div>\n\u003ch2>组合是一个整体决策\u003c/h2>\u003cp>你可以把资金按用途、期限和风险分配到不同资产。权益仓位内部可以包含宽基、行业或个股，但每一层都要算回\u003cstrong>总资产的比例\u003c/strong>。不要一边说个股只占“小仓位”，一边忽略所有小仓位加起来已经很大。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>纯教学的60/40模拟组合\u003c/b>\u003cp>初始总额10,000元，其中普通宽基股票ETF 6,000元、现金4,000元。假设ETF上涨20%，现金不变，则总额11,200元，ETF权重7,200÷11,200≈64.29%。若目标仍是60%，对应ETF目标金额6,720元，需要卖出约480元转成现金。实际须考虑交易单位、费用和价格变化，未必能精确到目标。\u003c/p>\u003c/div>\n\u003ch2>再平衡的目的\u003c/h2>\u003cp>再平衡使风险暴露回到事先认可的范围，而不是预测最高点和最低点。方法可以是固定检查日期，或预先设定偏离区间。频率太高可能增加费用，太低可能长期偏离目标。什么规则适合，取决于实际资产、成本和目标，没有统一最佳参数。\u003c/p>\n\u003ch2>优先考虑新资金\u003c/h2>\u003cp>继续上例，若有新增资金且用途允许，可以先向低于目标的部分投入，减少卖出和成本。但是“有新钱”不意味着必须买跌得最多的资产；应先确认目标配置和该资产的基本判断仍成立。\u003c/p>\n\u003ch2>债券基金并不是现金替代词\u003c/h2>\u003cp>债券价格受利率和信用风险影响：市场利率上升时，既有固定利息债券的价格通常承压，期限等因素影响幅度。信用恶化可能造成更大损失。货币基金、短债基金、长债基金与银行存款具有不同的波动、赎回与保障安排，不能在压力测试中都设为绝对不变。\u003c/p>\n\u003ch2>写一页投资规则\u003c/h2>\u003col>\u003cli>目标与最早用钱日期：为了什么，什么时候需要。\u003c/li>\u003cli>允许的资产：本阶段只模拟普通宽基ETF与现金，或明确其他范围。\u003c/li>\u003cli>目标比例与容忍区间：先写规则，再观察行情。\u003c/li>\u003cli>检查安排：例如每月固定一天查看，不因每天涨跌临时加频率。\u003c/li>\u003cli>退出/修改条件：生活资金需求、风险承受变化、产品或判断失效。\u003c/li>\u003c/ol>\u003cp>这里的60/40只用来练算术，并非对你适合比例的结论；真实配置需要个人完整财务信息。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>教学组合初始股票60、现金40，股票跌20%且现金不变。新股票占比是多少？重新回60%需把多少现金转入股票？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>股票48、现金40，总额88；股票占54.55%。目标股票88×60%=52.8，因此需转入4.8。是否实际执行，还需检查原规则、费用与新风险。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>按事先规则再平衡的主要目的是什么？\u003c/p>\u003col type=\"A\">\u003cli>保证卖在最高点\u003c/li>\u003cli>恢复目标风险暴露\u003c/li>\u003cli>保证永远优于不交易\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。它管理组合结构，不保证择时正确或提高收益。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a> · \u003ca href=\"https://moneysmart.gov.au/how-to-invest/investment-diversification\">澳大利亚Moneysmart：投资分散\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c19\">\u003cdiv class=\"eyebrow\">CHAPTER 19\u003c/div>\u003ch1>定投：平滑入场，也会持续亏损\u003c/h1>\u003cp>成本平均、现金流与比较方法\u003c/p>\u003cdiv class=\"goal\">能算定投份额与成本，并知道定投无法修复什么问题。\u003c/div>\n\u003ch2>定投是执行方式，不是收益保证\u003c/h2>\u003cp>定投通常指按固定时间投入固定或规则化金额。价格较低时同样的钱能买更多份额，价格较高时买得更少。它有助于把执行与当下情绪分开，但如果资产长期衰退，或最后用钱时仍处低位，定投照样可能亏损。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>三次各投入1,000元，忽略费用和交易单位\u003c/b>\u003cp>价格依次为10、8、10元，买入100、125、100份，总计325份，总投入3,000元，平均成本=3,000÷325≈9.23元。期末价格10元，市值3,250元，累计赚250元。\u003c/p>\u003cp>若价格是10、8、6元，分别买100、125、166.67份，共391.67份，期末值约2,350元，仍亏650元。实际场内ETF受100份单位及佣金影响，余款可能暂存，不能完全照搬可买任意小数份额的演示。\u003c/p>\u003c/div>\n\u003ch2>平均成本不是平均价格\u003c/h2>\u003cp>10、8、10的算术平均是9.33元，但定投成本是9.23元，因为低价买了更多份额。真正成本要用总投入除以总份额；考虑费用后，用实际总支出除以份额。\u003c/p>\n\u003ch2>定投与一次投入，取决于路径\u003c/h2>\u003cp>市场持续上涨时，更早投入的资金可能受益更多；先跌后涨时，分批可能获得较低成本。事先不知道路径，所以不能用一条事后挑出的曲线证明某种方式必胜。定投也要确认投入资金确实来自可承受风险的现金流，而不是为了补亏借钱。\u003c/p>\n\u003ch2>有追加资金时如何看回报\u003c/h2>\u003cp>“赚250÷投3000≈8.33%”可以描述累计盈亏比例，但三笔资金投入时间不同，它不是严格的年化收益。\u003cstrong>资金加权收益\u003c/strong>考虑各笔金额和日期，反映投资者实际资金体验；\u003cstrong>时间加权收益\u003c/strong>尽量剥离外部资金进出，常用于比较策略或产品。初学者至少记录每次日期、投入、份额和期末市值，别把新增本金当利润。\u003c/p>\n\u003ch2>什么时候复核定投\u003c/h2>\u003cp>定期检查现金流、用途、标的规则和集中风险。生活资金紧张、目标改变或产品不再符合原要求，可以暂停或修改；不是所有暂停都叫失败。不要因为刚涨了一周就翻倍扣款，也不要把“越跌越买”当作无需上限的机械命令。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>每次投入600元，价格依次为3、2、3元。忽略成本和份额单位，计算总份额、平均成本和期末市值。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>买入200、300、200份，总700份；投入1,800元，平均成本约2.5714元；期末市值2,100元，累计盈利300元。这个比例不直接等于年化回报。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>定投能保证什么？\u003c/p>\u003col type=\"A\">\u003cli>长期一定不亏\u003c/li>\u003cli>持续下跌时自动产生利润\u003c/li>\u003cli>按既定规则分批投入，但不能保证回报\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>C。投入方式改变成本路径，不改变资产可能持续下跌的事实。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.investor.gov/introduction-investing\">Investor.gov：投资入门\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c20\">\u003cdiv class=\"eyebrow\">CHAPTER 20\u003c/div>\u003ch1>行为与信息：不被涨跌牵着走\u003c/h1>\u003cp>追涨、回本执念、幸存者偏差与骗局\u003c/p>\u003cdiv class=\"goal\">能识别常见决策陷阱，并用记录替代情绪化操作。\u003c/div>\n\u003ch2>为什么知道道理，还是容易做错\u003c/h2>\u003cp>\u003cstrong>害怕错过：\u003c/strong>看别人赚钱后追入，却没有原始判断。\u003cstrong>损失厌恶：\u003c/strong>不愿承认亏损，导致不断加仓。\u003cstrong>锚定：\u003c/strong>只盯买入价，觉得回到成本才算结束。\u003cstrong>确认偏误：\u003c/strong>买后只看支持自己的消息。认识名字不够，要给每个陷阱安排一个具体动作。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>把“回本再卖”翻译成今天的问题\u003c/b>\u003cp>小林20元买入的公司跌到12元。是否卖出，不取决于市场是否愿意“还给他8元”，而取决于当前经营、价格、风险、替代选择和资金用途。如果今天没有这只股票，他还会按同样理由用这笔钱买它吗？若不愿意，至少需要重新审查继续持有的依据。\u003c/p>\u003c/div>\n\u003ch2>建立一个操作前暂停清单\u003c/h2>\u003cp>写下触发消息和来源、当前可验证事实、反对理由、资金影响和预定动作。若原计划没有这笔交易，先做纸面演练，不用行情催促自己。暂停多久按情境设定，其目的只是打断冲动，不是用一个固定时长保证正确。\u003c/p>\n\u003ch2>警惕被筛选过的“成功经验”\u003c/h2>\u003cp>只展示活下来的牛股，忽略退市和长期亏损者，是幸存者偏差。用今天知道的赢家回到过去假装能提前选中，是事后偏差。策略测试若偷用了当时未公布的财报，就是未来信息泄漏。收益截图还可能省略本金变化、费用或最大回撤。\u003c/p>\n\u003ch2>不用复杂知识也能识别的危险信号\u003c/h2>\u003cul>\u003cli>保证本金、承诺固定高收益，却要求承担股票风险。\u003c/li>\u003cli>要求把钱转到个人账户，或下载无法核实来源的交易软件。\u003c/li>\u003cli>老师带单、先赚小钱再要求更大入金、以解冻/税费名义继续转款。\u003c/li>\u003cli>要求透露密码、验证码，或以远程控制代替本人操作。\u003c/li>\u003c/ul>\u003cp>遇到疑似骗局，不继续转款，保留聊天和转账记录，通过已知官方渠道核实、联系相关机构。消息即使来自熟人，也不能替代机构身份和产品核验。\u003c/p>\n\u003ch2>结果与过程分开复盘\u003c/h2>\u003cp>遵守合理流程仍可能亏损；胡乱买入也可能短期赚钱。每次复盘分别记“过程是否合格”和“结果如何”，不要用一次盈利给危险行为盖章。学习期的目标是减少无法解释的操作，而不是保持每笔都赢。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>朋友只给你展示三笔盈利交易，说“从不亏”。你应追问哪些记录？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>完整期间的全部交易、资金转入转出、持仓浮亏、费用、最大回撤、失败与退出案例，以及真实可核验的账户记录。三笔成功交易无法证明策略可靠。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>一笔没有计划的追涨交易赚了钱，说明？\u003c/p>\u003col type=\"A\">\u003cli>方法已被证明有效\u003c/li>\u003cli>只说明这一次结果赚钱，不能证明过程可靠\u003c/li>\u003cli>应该立刻加杠杆复制\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。结果受运气与环境影响，需要完整样本和风险评价。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://www.csrc.gov.cn/shenzhen/c105615/c7638512/content.shtml\">深圳证监局：警惕非法荐股骗局（2026）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c21\">\u003cdiv class=\"eyebrow\">CHAPTER 21\u003c/div>\u003ch1>公告与权益：遇到新闻先查哪一页\u003c/h1>\u003cp>分红税、送转、减持、停牌与退市\u003c/p>\u003cdiv class=\"goal\">能把公告转成可核对的问题，而不是简单贴“利好/利空”标签。\u003c/div>\n\u003ch2>信息入口按可靠性排序\u003c/h2>\u003cp>优先看交易所披露、公司正式公告、基金合同和管理人公告。媒体报道用于发现线索，社交平台用于提出问题，都不能替代原始文件。打开文件后先确认证券代码、公告日期、是否更正、预案还是已实施，以及是否只是风险提示。\u003c/p>\n\u003ch2>现金分红，三个日期\u003c/h2>\u003cp>\u003cstrong>股权登记日\u003c/strong>确定本次权益登记；\u003cstrong>除权除息日\u003c/strong>作相应价格基准调整；\u003cstrong>发放日\u003c/strong>按安排到账。具体以实施公告为准，不把董事会预案当成已经到账的现金。想在除息前“买入拿分红再卖出”并不能凭空获利，因为价格调整和税费会影响总资产。\u003c/p>\n\u003cp>对普通个人从公开发行和转让市场取得的上市公司股票，现行股息红利差别化政策下，持股不超过1个月的实际税负为20%；超过1个月至1年（含）为10%；超过1年暂免。持有1年以内通常在转让时按最终持有期补扣，因此分红当时没扣税不等于免税。该口径不要直接套给ETF、港股或特殊股份。\u003c/p>\n\u003cdiv class=\"case\">\u003cb>税费演示\u003c/b>\u003cp>100股，每股分红0.50元，税前50元。若适用20%税负，税额10元，净分红40元。若持有期对应10%，税额5元。实际由账户结算处理，记录原始交易和分红信息，不自行用买卖顺序猜扣税。\u003c/p>\u003c/div>\n\u003ch2>送股和转增，不是账户财富翻倍\u003c/h2>\u003cp>简化“每10股转增10股”：原100股变200股，原参考价格20元调整到约10元，在没有其他变化时总价值仍约2,000元。送股、转增具体税务和来源可能不同，不能因为都增加股数就视为完全同一件事。\u003c/p>\n\u003ch2>其他公告的实用读法\u003c/h2>\u003cul>\u003cli>\u003cstrong>减持：\u003c/strong>谁、多少比例、原因、时间安排；计划不等于已成交。\u003c/li>\u003cli>\u003cstrong>回购：\u003c/strong>金额、价格区间、用途、实施进度与资金来源；公告不保证全部执行。\u003c/li>\u003cli>\u003cstrong>重大合同：\u003c/strong>合同总额不是当期利润；看履行条件、收入确认、成本和回款。\u003c/li>\u003cli>\u003cstrong>停牌/风险警示：\u003c/strong>看原因和恢复条件；暂停交易不暂停经济风险。\u003c/li>\u003cli>\u003cstrong>退市风险：\u003c/strong>退出主板交易并不保证有顺畅的后续退出渠道，本金可能遭严重损失；不要把ST当作低价机会。\u003c/li>\u003c/ul>\n\u003cp>实际动作只需三步：存原始公告 → 提取会改变现金流或交易权利的条款 → 对照自己的原计划。如果无法判断，就记录问题并暂停新增暴露。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>公告说“拟回购不超过2亿元”，你能把2亿元当作明天必然进场买盘吗？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>不能。“拟”和“不超过”代表计划及上限；需看下限、有效期、条件、资金来源及实际进展。不能据此保证短期股价。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>分红当天未扣红利税，意味着？\u003c/p>\u003col type=\"A\">\u003cli>一定免税\u003c/li>\u003cli>可能需在卖出时按持有期补扣\u003c/li>\u003cli>券商一定漏扣\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。普通个人股票红利税可能按最终持有期限后续处理。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf\">财税〔2015〕101号：股息红利差别化个人所得税\u003c/a> · \u003ca href=\"https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=600519\">上交所：公司公告查询（600519示例）\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c22\">\u003cdiv class=\"eyebrow\">CHAPTER 22\u003c/div>\u003ch1>完整案例 A：从目标到 ETF 模拟订单\u003c/h1>\u003cp>把指数、产品、费用和风险串起来\u003c/p>\u003cdiv class=\"goal\">能写出一份可复核的ETF决策单，包括不买入的理由。\u003c/div>\n\u003ch2>任务与完整数据卡（全部虚构）\u003c/h2>\u003cp>小林有10,000元模拟资金，生活备用金在外。他只想练习获得分散的境内股票暴露，不追逐单一行业。为完成本次作业，先限定ETF计划投入不超过2,000元，剩余模拟现金保留。这是教学任务约束，不是对真实资金比例的建议。\u003c/p>\u003cp>候选甲：跟踪宽基指数，管理+托管年费0.20%，当前参考净值2.000，卖一2.002、足量；候选乙：同指数，年费0.15%，参考净值2.000，卖一2.040、足量。两者其他条件先假设相当，券商佣金均为每笔最低5元。\u003c/p>\n\u003ch2>步骤一：解释买什么\u003c/h2>\u003cp>先说明该宽基覆盖范围、前十大权重和行业分布。数据卡未提供真实成份，所以这一步只能写“需补充核实”；不能拿“宽基”二字跳过集中风险。真实选品时要从指数方案和产品资料取数。本例其余计算可在不补资料的情况下完成。\u003c/p>\n\u003ch2>步骤二：比较当前交易摩擦\u003c/h2>\u003cp>甲参考溢价2.002÷2−1=0.10%；乙2.040÷2−1=2%。乙便宜0.05个百分点的年费，对2,000元一年约为1元；它现在多出的溢价约1.9个百分点，远大于这项年费差。时点估值准确与否仍须确认。本例倾向先研究甲，或等待更合理的执行条件，而不是直接追乙。\u003c/p>\n\u003ch2>步骤三：计算可申报数量\u003c/h2>\u003cp>假设按2.002买，100份为单位、佣金5元，2,000元含费预算最多可买900份：900×2.002＋5＝\u003cstrong>1,806.80元\u003c/strong>。1,000份需2,007元，超预算。交易后模拟现金=10,000−1,806.80＝8,193.20元。\u003c/p>\n\u003ch2>步骤四：把坏情境写在前面\u003c/h2>\u003cp>若买入后市场价格跌30%且卖出，价格为1.4014元，900份卖出毛额1,261.26元，另假设卖出佣金5元，净回款1,256.26元。损失550.54元，约占整个初始模拟账户5.51%。实际成交价格必须符合报价单位，此处为连续比例压力计算，真实损失可能更大。\u003c/p>\n\u003ch2>步骤五：订单与后续\u003c/h2>\u003cp>确认T+1、交易状态、盘口时点、限价类型 → 只提交一笔900份订单 → 成交后查均价与费用 → 记录实际溢价 → 到约定检查日复核产品与资金用途。行情突然上涨并不自动允许突破预算。\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>合格结论也可以是“暂不下单”。\u003c/strong>本案例缺少完整成份、规模和跟踪记录，能算对订单不等于信息已经充分。课程故意保留这一缺口，让你练习把“已知”和“还不知道”写开。\u003c/div>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>若预算改为1,500元，其余条件不变，按2.002元和每笔佣金5元，最多可买多少份？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>按100份向下取整：(1500−5)÷2.002≈746.75，最多700份。总支出700×2.002+5=1,406.40元。不能买800份，也不能用746.75份作为场内标准订单。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>本例年费更低的乙为何不一定更合适？\u003c/p>\u003col type=\"A\">\u003cli>费率没有作用\u003c/li>\u003cli>当前溢价和执行成本可能大于少付的年费\u003c/li>\u003cli>ETF净值必须都是1元\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。持有成本要与买入溢价、价差、佣金及持有期一起看。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003ca href=\"https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html\">深交所：场内基金投资交易指南\u003c/a> · \u003ca href=\"https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml\">上交所ETF课堂：ETF优势与交易费用\u003c/a> · \u003ca href=\"https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf\">深交所交易规则（2026年修订）全文\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c23\">\u003cdiv class=\"eyebrow\">CHAPTER 23\u003c/div>\u003ch1>完整案例 B：为一家企业写判断，而非喊目标价\u003c/h1>\u003cp>从经营数据到三种情景与反证\u003c/p>\u003cdiv class=\"goal\">能用同一套数据建立个股分析，并明确判断失效条件。\u003c/div>\n\u003ch2>晨光早餐公司的数据卡（虚构）\u003c/h2>\u003cp>总股数100万股；去年收入1,000万元、净利润100万元；今年收入1,200万元、净利润120万元、扣非净利润110万元、经营现金流80万元；年末现金200万元、有息债务150万元、净资产600万元。应收账款从100万元升至180万元。假设股价18元，无其他股本变化。\u003c/p>\n\u003ch2>步骤一：先计算当前状态\u003c/h2>\u003cp>收入与净利润均增长20%；当年EPS=120万÷100万=1.20元；静态PE=18÷1.2=15倍；每股净资产6元，PB=3倍。经营现金流/净利润=80÷120≈0.67。应收增长80%，明显快于收入的20%，值得进一步追查。\u003c/p>\n\u003ch2>步骤二：判断赚钱质量\u003c/h2>\u003cp>扣非利润低于净利润10万元，需知道非经常项目是什么。应收增加可能来自拓展企业团餐赊销，也可能是回款变慢；应检查客户账期、坏账准备、后续收款、客户集中度。现金200万大于有息债务150万，只能算出简化净现金50万，不能忽略受限现金、其他负债、到期日和新增支出。\u003c/p>\n\u003ch2>步骤三：做可检验的情景\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>下一年假设\u003c/th>\u003cth>EPS\u003c/th>\u003cth>假设PE\u003c/th>\u003cth>情景价格\u003c/th>\u003cth>相对18元，不含分红\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>悲观：成本与回款承压\u003c/td>\u003ctd>0.80\u003c/td>\u003ctd>10\u003c/td>\u003ctd>8元\u003c/td>\u003ctd>−55.56%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基准：利润略增\u003c/td>\u003ctd>1.30\u003c/td>\u003ctd>14\u003c/td>\u003ctd>18.20元\u003c/td>\u003ctd>+1.11%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>乐观：扩张顺利\u003c/td>\u003ctd>1.60\u003c/td>\u003ctd>18\u003c/td>\u003ctd>28.80元\u003c/td>\u003ctd>+60%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>三种情景没有赋予可靠概率，不能直接取平均当“合理价”。它们的用途是暴露假设：只有乐观情境带来很大上涨，而悲观损失可能明显。倍数也是假设，不是行业标准；若缺乏比较依据，应降低对估值结论的信心。\u003c/p>\n\u003ch2>步骤四：写反证与行动条件\u003c/h2>\u003cp>原判断：“扩张能产生可持续现金利润”。反证包括：新增客户长期不付款、毛利率持续下滑且无法解释、债务到期压力增加、管理层反复变更披露。如果这些情况出现，应重新评估，而不是因为价格低了就自动补仓。\u003c/p>\n\u003ch2>步骤五：形成合格的结论\u003c/h2>\u003cp>“经营规模增长，但现金回收与应收变化尚未解释；现价在基准情景下空间有限。先列观察，不新增个股风险；等待回款和利润质量证据。”这比“预计涨到28.8元”更完整。若未来信息变好，也要重新检查价格是否已反映改善。\u003c/p>\n\u003cp>本案例教的是把事实、假设、证据与行动相连；不要求预测精准，也不要求必须买入。没有研究优势、时间或完整信息时，选择不参与个股本身就是有效决策。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>若今年净利润120万元中有40万元来自一次性资产出售，用18元和报告EPS算的15倍PE可能有什么问题？\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>一次性收益可能抬高分母，使PE显得较低。若教学简化剔除40万元，持续利润80万元、EPS0.80元，对应22.5倍；实际扣非和税务口径需查报告，不能直接把该简化值当官方指标。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>三种情景价格8、18.2、28.8元，能直接把平均数当公允价吗？\u003c/p>\u003col type=\"A\">\u003cli>能，平均数最客观\u003c/li>\u003cli>不能，概率与假设缺乏依据\u003c/li>\u003cli>只取最高价\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。情景分析展示敏感性，没有可靠概率和现金流依据就不是估值定论。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003c/div>\u003c/article>\u003carticle class=\"chapter reading\" id=\"c24\">\u003cdiv class=\"eyebrow\">CHAPTER 24\u003c/div>\u003ch1>结业：写下你自己的投资操作手册\u003c/h1>\u003cp>综合任务、评分标准与课程后的固定流程\u003c/p>\u003cdiv class=\"goal\">能完成一份包含目标、证据、费用、风险和复盘的模拟决策。\u003c/div>\n\u003ch2>你要交付的是一份能被别人复核的决策\u003c/h2>\u003cp>选第22章ETF案例或第23章公司案例，使用本课程已给数据完成下面任务。无需真实开户或购买；真实材料只有在练习“资料检索”时才另外核对。交易规则与产品资料会更新，未来真实决策前的核验是操作的一部分，不是本课程基础讲解的缺页。\u003c/p>\n\u003ch2>综合作业：六个部分，共100分\u003c/h2>\u003col>\u003cli>\u003cstrong>目标与边界20分：\u003c/strong>写资金用途、最早用钱日期、允许风险、是否真实/模拟。四项各5分。\u003c/li>\u003cli>\u003cstrong>产品与证据20分：\u003c/strong>解释买的是什么、底层风险、资料日期与出处、至少一项未知。四项各5分。\u003c/li>\u003cli>\u003cstrong>交易与费用20分：\u003c/strong>代码/类别核对、申报规则、含费预算、净回报计算。四项各5分。\u003c/li>\u003cli>\u003cstrong>坏情境20分：\u003c/strong>人民币损失10分、占总账户比例5分、无法及时退出的可能5分。\u003c/li>\u003cli>\u003cstrong>行动条件10分：\u003c/strong>写买入/不买入理由5分，判断失效与复核条件5分。\u003c/li>\u003cli>\u003cstrong>复盘记录10分：\u003c/strong>区分过程与结果5分，给出下次具体改进5分。\u003c/li>\u003c/ol>\n\u003ch2>参考提交：ETF案例摘要\u003c/h2>\u003cdiv class=\"case\">\u003cp>“使用10,000元模拟资金；候选甲跟踪宽基，暂不涉及杠杆。净值与报价是案例固定假设，实际成份与跟踪记录缺失。2,000元含费预算下，2.002元限价最多900份，总成本1,806.80元。若价格跌30%并按假设卖出费5元退出，损失550.54元，约占账户5.51%；实际可能受T+1或流动性影响。因资料尚不充分，先完成纸面订单，不执行真实买入。复核时检查成份集中度、跟踪情况、报价与资金用途。”\u003c/p>\u003c/div>\n\u003ch2>通过标准\u003c/h2>\u003cp>建议教学合格线为80分，并且三个关键错误必须全部纠正：把生活刚需钱当投资本金；把T+1、费用或保证成交理解错；把未来收益或情景价格当保证。这个分数只用于学习自检，不是金融资格或实盘适当性认证。\u003c/p>\n\u003ch2>课程结束后的轻量流程\u003c/h2>\u003cul>\u003cli>\u003cstrong>每次行动前：\u003c/strong>确认资金用途、依据、总仓位、费用和退出条件。\u003c/li>\u003cli>\u003cstrong>每月一次：\u003c/strong>核对总资产、投入/转出、持仓权重、费用和偏离原计划的交易。\u003c/li>\u003cli>\u003cstrong>新财报或重大公告出现时：\u003c/strong>更新判断，只改有新证据支持的部分。\u003c/li>\u003cli>\u003cstrong>生活发生变化时：\u003c/strong>先调整流动性与风险承受，再考虑投资计划。\u003c/li>\u003cli>\u003cstrong>发现不懂的产品：\u003c/strong>先研究其收益来源、最坏情境和退出方式，不因热门而越级。\u003c/li>\u003c/ul>\n\u003ch2>自我讲解，是最后一关\u003c/h2>\u003cp>合上笔记，用普通话解释：股票与ETF是什么、为何不保本、价格为什么不同于价值、一次交易如何成交和收费、如何判断组合能否承受下跌。若某个词只能复述定义，却不能举例，就回到对应章节再做一次题。\u003c/p>\n\u003cp>你已经完成从资金安排、交易操作、ETF选择、财报估值到风险管理的基础闭环。往后最值得积累的是稳定的记录和可核验的判断，而不是不断增加指标或频繁找“必胜方法”。\u003c/p>\u003cdiv class=\"exercise\">\u003ch3>动手练习\u003c/h3>\u003cp>完成上面的综合作业，并给每个分项打分；把尚缺的事实明确写出来。\u003c/p>\u003cdetails>\u003csummary>参考答案\u003c/summary>\u003cp>可对照本章ETF参考提交，也可用第23章数据提交“不买入”的公司分析。评分看依据、计算和边界是否清楚，不因最终选择买入还是不买入而加减分。低于80分或存在关键错误时，回到对应章节补练。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"quiz\">\u003ch3>自测\u003c/h3>\u003cp>这门课的结业目标是？\u003c/p>\u003col type=\"A\">\u003cli>保证下个月盈利\u003c/li>\u003cli>能解释、计算并复核一份有风险边界的决策\u003c/li>\u003cli>学会预测明天涨跌\u003c/li>\u003c/ol>\u003cdetails>\u003csummary>答案与解析\u003c/summary>\u003cp>B。基础能力是可检查的流程，不是未来收益的承诺。\u003c/p>\u003c/details>\u003c/div>\u003cdiv class=\"source-inline\">\u003c/div>\u003c/article>\u003csection class=\"chapter\">\u003ch2>概念词典\u003c/h2>\u003cp>\u003cb>股权：\u003c/b>对公司的一部分所有权，普通股股东承担剩余风险。（第2章）\u003c/p>\u003cp>\u003cb>股价：\u003c/b>每股的市场交易价格，不能单独判断贵便宜。（第2章）\u003c/p>\u003cp>\u003cb>市值：\u003c/b>股价乘股数；总市值与流通市值的股数口径不同。（第2章）\u003c/p>\u003cp>\u003cb>分红：\u003c/b>公司或基金按规则向持有人分配现金等权益，不是凭空增值。（第2章）\u003c/p>\u003cp>\u003cb>除息：\u003c/b>现金分红引起的价格参考基准调整，实际成交仍受市场影响。（第21章）\u003c/p>\u003cp>\u003cb>股权登记日：\u003c/b>确定本次权益登记的日期，以实施公告为准。（第21章）\u003c/p>\u003cp>\u003cb>送转：\u003c/b>送股、转增等增加股份数量的安排，不自动增加总财富。（第21章）\u003c/p>\u003cp>\u003cb>IPO：\u003c/b>首次公开发行股票；新股上市有特殊交易阶段和风险。（第6章）\u003c/p>\u003cp>\u003cb>T+1：\u003c/b>此处指普通A股/股票ETF当天新买部分通常下一交易日才能卖。（第6章）\u003c/p>\u003cp>\u003cb>交易日：\u003c/b>交易所开市的日期，不等于所有工作日或自然日。（第6章）\u003c/p>\u003cp>\u003cb>涨跌停：\u003c/b>交易价格的日内允许边界，不保证能成交或限制累计亏损。（第6章）\u003c/p>\u003cp>\u003cb>ST / *ST：\u003c/b>相应风险警示标记，应查看具体风险原因和板块规则。（第6章）\u003c/p>\u003cp>\u003cb>停牌：\u003c/b>证券暂停交易，持仓风险并不会因此消失。（第21章）\u003c/p>\u003cp>\u003cb>退市：\u003c/b>证券退出相应上市交易安排，退出流动性与本金都面临风险。（第21章）\u003c/p>\u003cp>\u003cb>一手：\u003c/b>常用交易数量单位；普通主板股票常为100股，不适用于所有板块。（第6章）\u003c/p>\u003cp>\u003cb>买一 / 卖一：\u003c/b>当前最高买价与最低卖价，数量和报价会变化。（第7章）\u003c/p>\u003cp>\u003cb>限价单：\u003c/b>限定买入最高价或卖出最低价，不保证成交。（第7章）\u003c/p>\u003cp>\u003cb>市价类订单：\u003c/b>按具体类型与保护规则追求匹配，实际执行价格和数量仍不确定。（第7章）\u003c/p>\u003cp>\u003cb>集合竞价：\u003c/b>把一个时段的申报集中按规则确定成交价格。（第6章）\u003c/p>\u003cp>\u003cb>连续竞价：\u003c/b>在相应时段随申报持续撮合交易。（第6章）\u003c/p>\u003cp>\u003cb>滑点：\u003c/b>实际执行价格相对原先预期价格的偏离。（第7章）\u003c/p>\u003cp>\u003cb>价差：\u003c/b>买一与卖一之间的差额，可能构成交易摩擦。（第7章）\u003c/p>\u003cp>\u003cb>佣金：\u003c/b>券商按合同收取的交易服务费用，要看费率、最低值和包含项目。（第8章）\u003c/p>\u003cp>\u003cb>万2.5：\u003c/b>万分之二点五，等于0.025%，计算时用0.00025。（第8章）\u003c/p>\u003cp>\u003cb>交割单：\u003c/b>核对成交和费用资金发生额的交易记录。（第8章）\u003c/p>\u003cp>\u003cb>可用 / 可取：\u003c/b>可用于证券交易与可转出银行的资金口径，并不相同。（第5章）\u003c/p>\u003cp>\u003cb>K线：\u003c/b>用开盘、最高、最低、收盘四个价格概括选定期间的图形。（第9章）\u003c/p>\u003cp>\u003cb>均线：\u003c/b>对过去价格做平均和平滑，不是未来价格保证。（第9章）\u003c/p>\u003cp>\u003cb>复权：\u003c/b>为分红送转等调整历史价格序列的方法，显示值可能不是原成交价。（第9章）\u003c/p>\u003cp>\u003cb>换手率：\u003c/b>成交数量相对流通股数等指定分母的比例，需核对口径。（第9章）\u003c/p>\u003cp>\u003cb>指数：\u003c/b>按选样和加权规则汇总一篮子证券表现的计算结果。（第10章）\u003c/p>\u003cp>\u003cb>宽基：\u003c/b>覆盖相对广泛证券和行业的指数类别，仍有市场与集中风险。（第10章）\u003c/p>\u003cp>\u003cb>全收益指数：\u003c/b>按规则纳入分红再投资的指数口径。（第10章）\u003c/p>\u003cp>\u003cb>ETF：\u003c/b>在交易所买卖的开放式基金结构；风险由底层资产及产品设计决定。（第11章）\u003c/p>\u003cp>\u003cb>ETF联接：\u003c/b>主要投资目标ETF的基金，申赎和收费与场内买卖不同。（第12章）\u003c/p>\u003cp>\u003cb>净值NAV：\u003c/b>基金净资产除以份额数得到的单位价值。（第11章）\u003c/p>\u003cp>\u003cb>IOPV：\u003c/b>盘中基金参考净值估算，不保证可成交或无误差。（第11章）\u003c/p>\u003cp>\u003cb>溢价 / 折价：\u003c/b>市场价高于/低于可比参考净值，注意估值时点。（第11章）\u003c/p>\u003cp>\u003cb>申购赎回：\u003c/b>按基金规则与基金交换资金或证券及份额，不等同二级市场买卖。（第11章）\u003c/p>\u003cp>\u003cb>跟踪差异：\u003c/b>基金区间回报相对基准的差值，需确认定义的正负方向。（第12章）\u003c/p>\u003cp>\u003cb>跟踪误差：\u003c/b>各期基金与基准回报差的波动指标，和累计落后多少不同。（第12章）\u003c/p>\u003cp>\u003cb>营业收入：\u003c/b>企业经营确认的销售等收入，不等于当期收回的现金。（第14章）\u003c/p>\u003cp>\u003cb>毛利率：\u003c/b>收入扣营业成本后占收入的比例，反映产品与直接成本关系。（第14章）\u003c/p>\u003cp>\u003cb>归母净利润：\u003c/b>归属于母公司股东的净利润，与集团总净利润区分。（第14章）\u003c/p>\u003cp>\u003cb>扣非利润：\u003c/b>按规则剔除非经常损益后的利润，仍需检查质量。（第14章）\u003c/p>\u003cp>\u003cb>经营现金流：\u003c/b>经营活动产生的现金净流入，需解释与利润的差异。（第14章）\u003c/p>\u003cp>\u003cb>应收账款：\u003c/b>已确认销售但尚待客户付款的款项，存在回收风险。（第14章）\u003c/p>\u003cp>\u003cb>净资产：\u003c/b>会计资产减负债后的权益，不等于可兑现市值。（第14章）\u003c/p>\u003cp>\u003cb>ROE：\u003c/b>净资产收益率，需确认加权口径，也会受杠杆影响。（第14章）\u003c/p>\u003cp>\u003cb>EPS：\u003c/b>每股收益，注意基本/稀释及年度/滚动口径。（第15章）\u003c/p>\u003cp>\u003cb>PE：\u003c/b>市盈率，价格相对每股利润；不是承诺回本年数。（第15章）\u003c/p>\u003cp>\u003cb>PB：\u003c/b>市净率，价格相对每股净资产；需结合资产质量。（第15章）\u003c/p>\u003cp>\u003cb>TTM：\u003c/b>最近滚动12个月，用于说明财务指标覆盖的期间。（第15章）\u003c/p>\u003cp>\u003cb>股息率：\u003c/b>特定期间每股分红除以股价，历史值不保证未来。（第15章）\u003c/p>\u003cp>\u003cb>估值：\u003c/b>根据盈利、资产、现金流和风险等判断价格要求了什么条件。（第15章）\u003c/p>\u003cp>\u003cb>同比 / 环比：\u003c/b>与上年相同期间/与上一相邻期间比较，须注意季节性。（第14章）\u003c/p>\u003cp>\u003cb>仓位：\u003c/b>某项或某类资产占所选总资产的比例，分母必须说清楚。（第17章）\u003c/p>\u003cp>\u003cb>回撤：\u003c/b>从此前高点下降的幅度，与相对初始本金的亏损不同。（第4章）\u003c/p>\u003cp>\u003cb>再平衡：\u003c/b>使组合回到预先设定的风险结构，不是预测行情。（第18章）\u003c/p>\u003cp>\u003cb>定投：\u003c/b>按时间或规则分批投入，不能保证正回报。（第19章）\u003c/p>\u003cp>\u003cb>复利：\u003c/b>收益继续参与后续变化的复合过程，也会复合亏损。（第4章）\u003c/p>\u003cp>\u003cb>流动性：\u003c/b>能否以较小价格影响完成所需规模交易的能力。（第17章）\u003c/p>\u003cp>\u003cb>相关性：\u003c/b>不同资产变动的共同程度，会随环境变化。（第17章）\u003c/p>\u003cp>\u003cb>安全余量：\u003c/b>给估计错误留出的空间，不代表任何价格绝对安全。（第15章）\u003c/p>\u003cp>\u003cb>幸存者偏差：\u003c/b>只看留下来的成功样本，忽略失败与消失样本。（第20章）\u003c/p>\u003cp>\u003cb>反证：\u003c/b>会使原判断失效的可观察事实，用于避免只看有利证据。（第23章）\u003c/p>\u003ch2>来源与方法\u003c/h2>\u003cp>课程规划方法借鉴 \u003ca href=\"https://github.com/weihaoqu/gemini-curriculum-designer\">GitHub curriculum-designer\u003c/a>。核心讲解、例题和答案均在本讲义内；以下链接为核验入口。\u003c/p>\u003cp>\u003ca href=\"https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml\">上交所交易规则（2026年修订）\u003c/a>：现行规则主页面；2026-07-06起施行，核对股票、ETF交易与盘后安排。\u003c/p>\u003cp>\u003ca href=\"https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf\">深交所交易规则（2026年修订）全文\u003c/a>：交易时段、申报单位、回转交易、涨跌幅与盘后交易；重点第2.3、3.1–3.6节。\u003c/p>\u003cp>\u003ca href=\"https://one.sse.com.cn/onething/gptz/\">上交所：股票投资一件事\u003c/a>：股票交易服务、时段与费用口径；也用于交叉核对2026规则。\u003c/p>\u003cp>\u003ca href=\"https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html\">深交所：2026交易规则技术准备通知\u003c/a>：明确盘后固定价格交易扩展至全部A股及ETF。\u003c/p>\u003cp>\u003ca href=\"https://www.szse.cn/aboutus/trends/news/t20261019_623374.html\">深交所：首批主动ETF正式获批\u003c/a>：2026-10-19公告；“获批”并不等同于“已上市”，ETF不应一概定义为被动基金。\u003c/p>\u003cp>\u003ca href=\"https://jiangsu.chinatax.gov.cn/art/2023/8/28/art_8349_432258.html\">财政部、税务总局：证券交易印花税减半征收\u003c/a>：2023-08-28起实施的减半政策，结合现行股票费用页核对有效税率。\u003c/p>\u003cp>\u003ca href=\"https://www.sse.com.cn/services/tradingservice/charge/ssecharge/\">上交所收费一览表\u003c/a>：收费与代收项目核对入口；个人佣金合同须另外确认，不能重复计费。\u003c/p>\u003cp>\u003ca href=\"https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml\">上交所ETF课堂：ETF优势与交易费用\u003c/a>：ETF二级交易印花税等；其中交易时间若与2026规则冲突，以新版规则为准。\u003c/p>\u003cp>\u003ca href=\"https://www.csrc.gov.cn/shenzhen/c105614/c1575407/content.shtml\">证监会深圳监管局：基金手续费\u003c/a>：基金管理费、托管费等计提方式，具体费率以相应基金合同为准。\u003c/p>\u003cp>\u003ca href=\"https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html\">深交所：场内基金投资交易指南\u003c/a>：市场价、净值与溢价机制；旧文中的时间性细节与2026规则分开使用。\u003c/p>\u003cp>\u003ca href=\"https://www.sse.com.cn/disclosure/fund/announcement/c/new/2026-03-23/510050_20260323_Y5MO.pdf\">上证50ETF招募说明书（2026更新示例）\u003c/a>：用于核对IOPV参考性质和误差风险，不作为推荐产品。\u003c/p>\u003cp>\u003ca href=\"https://investor.szse.cn/knowledge/fund/trade/t20191106_571787.html\">深交所：ETF权益分派与除息\u003c/a>：基金分红与除息处理。\u003c/p>\u003cp>\u003ca href=\"https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf\">财税〔2015〕101号：股息红利差别化个人所得税\u003c/a>：普通个人上市股票红利持股期税负与后续补扣的依据，不能泛化到所有产品。\u003c/p>\u003cp>\u003ca href=\"https://csi-web-dev.oss-cn-shanghai-finance-1-pub.aliyuncs.com/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000300_Index_Methodology_cn.pdf\">中证指数：沪深300指数编制方案\u003c/a>：指数公司官方文件托管：指数目标、样本和加权规则。正式投资时应核对发布方最新版本。\u003c/p>\u003cp>\u003ca href=\"https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf\">贵州茅台2025年年度报告\u003c/a>：第6页主要财务数据，第9–10页变动说明；报告期2025年，披露于2026年，不是实时数据。\u003c/p>\u003cp>\u003ca href=\"https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=600519\">上交所：公司公告查询（600519示例）\u003c/a>：示范如何区分预案、实施和更正公告；不构成荐股。\u003c/p>\u003cp>\u003ca href=\"https://one.sse.com.cn/onething/gptz/\">上交所：股票投资账户与交易服务\u003c/a>：账户及交易服务入门，具体办理依本人券商官方流程。\u003c/p>\u003cp>\u003ca href=\"https://www.investor.gov/introduction-investing\">Investor.gov：投资入门\u003c/a>：股权、回报、复利等通用概念；美国账户和税制不用于A股操作。\u003c/p>\u003cp>\u003ca href=\"https://www.investor.gov/introduction-investing/getting-started/asset-allocation\">Investor.gov：资产配置与分散\u003c/a>：通用风险与分散原则，不将其转化为针对个人的固定比例建议。\u003c/p>\u003cp>\u003ca href=\"https://moneysmart.gov.au/how-to-invest/investment-diversification\">澳大利亚Moneysmart：投资分散\u003c/a>：通用的跨资产分散、利率与债券风险概念，不套用当地税制。\u003c/p>\u003cp>\u003ca href=\"https://www.csrc.gov.cn/shenzhen/c105615/c7638512/content.shtml\">深圳证监局：警惕非法荐股骗局（2026）\u003c/a>：2026-06-11风险提示：核验机构资质，识别AI荐股、假冒App与私人转账陷阱。\u003c/p>\u003cp>\u003ca href=\"https://www.bse.cn/jygl_list/200028217.html\">北京证券交易所交易规则（2026）\u003c/a>：第3.3.11条：一般价格涨跌幅限制30%；本课程不展开北交所实操。\u003c/p>\u003c/section>\u003c/main>\u003cscript>addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));\u003c/script>\u003c/body>\u003c/html>","md":"# 股市第一课 · A股与ETF实用学习手册\n\n规则核对：2026-10-26。共24章、30天完整路线、6次复习。适合零基础，建议每课35–60分钟。所有未标明真实来源的数字、公司和价格均为教学假设，不提供个性化荐股或收益保证。\n\n## 30天学习路线\n\n每天：回顾5分钟→阅读20–30分钟→练习10–15分钟→复述5分钟；长章节可延长。\n\n### 阶段1：建立常识\n\n- 第1天：第1章 先安排钱，再认识股票，约35分钟。能力目标：能把生活用钱、备用金和可承担风险的钱分开。\n  今日产出：小林有 30,000 元，已知支出 20,000 元、备用金需求 8,000 元。写出理论剩余金额，并说明为什么这不是“必须投入金额”。\n- 第2天：第2章 买股票，究竟买到了什么，约40分钟。能力目标：能区分股价、市值、企业现金与股东收益。\n  今日产出：公司有 2 亿股，每股 12 元；你持有 1,000 股。算总市值、你的持股比例和持仓市值。\n- 第3天：第3章 价格为什么会涨跌，约35分钟。能力目标：能解释利好下跌、报价不成交和价格波动。\n  今日产出：某公司利润增长 15%，股价当天跌 4%。写出至少两种可能解释，以及验证它们需要的证据。\n- 第4天：第4章 先算明白赚亏，再谈收益率，约45分钟。能力目标：能计算包含现金分红和费用的回报，理解涨跌不对称。\n  今日产出：10,000 元先涨 10%，再跌 10%；另一账户从高点 20,000 跌至 15,000。分别算期末金额、回撤与回本涨幅。\n- 第5天：复习（45–60分钟）。不用笔记解释股权、市值、分红、涨跌不对称；完成：100元跌30%后回本需要涨多少？\n  核对标准：应说明股权是所有权、总市值是价格乘股数；分红伴随除息；回本涨幅30÷70=42.86%。若混淆本金与市值，回第2、4章。\n\n### 阶段2：掌握交易\n\n- 第6天：第5章 账户、券商与第一张交易清单，约40分钟。能力目标：能区分证券账户、资金账户、银行账户与可用可取资金。\n  今日产出：申报买入 300 股，状态显示已成交 100 股、余 200 股待成交。你申请撤单后应检查什么？\n- 第7天：第6章 A 股交易规则速查，约50分钟。能力目标：能判断T+1、申报单位、涨跌幅与交易时段的适用范围。\n  今日产出：周五买入普通境内股票 ETF，周末无交易。能否周五卖出这批新买份额？若下周一休市，最早哪天？\n- 第8天：第7章 亲手走完一笔限价买卖，约45分钟。能力目标：能解释限价单成交逻辑，识别成交价格与数量的不确定性。\n  今日产出：仍用上述盘口，限价 10.00 元买入 300 股。在盘口不变、没有竞争订单时，能立即买到多少股？余单怎么办？\n- 第9天：第8章 交易成本：小金额最容易算漏，约50分钟。能力目标：能独立复算股票及ETF的一次往返交易成本。\n  今日产出：假设一只普通 ETF 以 2 元买 1,000 份，2.10 元卖出；佣金买卖各5元，无其他费用。净赚多少？\n- 第10天：复习（45–60分钟）。10元买1000股，再按10元卖出；万2.5、每边最低5元，股票税费用第8章模型，求损失；再口述T+1与撤单。\n  核对标准：买入总成本10005.10，卖出净额9989.90，损失15.20元。T+1是当日新买部分通常次交易日才能卖；撤单要看确认，成交部分不能撤。\n\n### 阶段3：理解工具\n\n- 第11天：第9章 看懂行情页，停止猜测图形，约40分钟。能力目标：能从行情中读出事实，而不把技术图形当作预测保证。\n  今日产出：某股昨收20，今开19.5、最高20.3、最低19.2、收盘19.8。它收阳还是收阴？相对昨收涨跌多少？\n- 第12天：第10章 指数：给一篮子股票做温度计，约45分钟。能力目标：能解释指数与基金的区别，并识别重复和集中暴露。\n  今日产出：指数甲含某行业40%，你又买一只100%投该行业的基金，二者各占组合一半。该行业合计暴露多少？\n- 第13天：第11章 ETF：买入一篮子资产的入口，约50分钟。能力目标：能区分ETF市场价与净值，计算溢价消失的损失。\n  今日产出：同一时点估计净值2.00、市场价2.06；随后净值不变而价格回到2.00。算溢价和价格损失。\n- 第14天：第12章 怎样比较两只同类 ETF，约45分钟。能力目标：能把指数、费率、跟踪表现和交易成本放在同一张判断表里。\n  今日产出：A与B同指数，你只知道B年费低0.05个百分点。还需要哪三类资料才能判断？\n- 第15天：复习（45–60分钟）。写跟踪目标、行业集中、费用、交易价差、溢价、跟踪记录六项；每项写它影响什么。\n  核对标准：风险来自底层与集中度；成本来自持有和交易；溢价消失可在净值不跌时造成亏损；跟踪记录需同期间同口径。说不清溢价回到第11章。\n\n### 阶段4：看懂公司\n\n- 第16天：第13章 从生意看公司，不从故事选股，约45分钟。能力目标：能用五句话说明一家公司如何赚钱及最脆弱的环节。\n  今日产出：早餐公司销量增长20%，均价下降10%。收入大约增长多少？能否据此说利润也增长？\n- 第17天：第14章 三张财报：利润不是现金，约60分钟。能力目标：能读取关键财务指标，并发现需要进一步核对的异常。\n  今日产出：公司资产500万元、负债300万元、全年净利润30万元，期初期末权益都为200万元。简化ROE是多少？负债增加能否让ROE看起来更高？\n- 第18天：第15章 估值：好公司也可能买贵，约60分钟。能力目标：能算基础估值，知道分母失真与估值回落的影响。\n  今日产出：EPS从2元变2.2元，PE从20倍降到16倍。价格从多少变多少？不计分红的回报是多少？\n- 第19天：第16章 真实财报演示：先事实，后解释，约55分钟。能力目标：能从年报提取数字并区分原始数据、公司解释和个人推断。\n  今日产出：用表中约数计算2025年经营现金流/归母净利润。能否仅因比值低于1就认定经营恶化？\n- 第20天：复习（45–60分钟）。第一页写生意和三表，第二页写EPS/PE与三种情景；至少列出两项未知及反证。可用第13–16章案例。\n  核对标准：合格内容包括收入利润现金的区别，估值分母与日期，未来假设不当事实。缺少现金流或只给一个目标价时，回第14、15章。\n\n### 阶段5：管理风险\n\n- 第21天：第17章 风险与仓位：把失误控制在能承受的范围，约50分钟。能力目标：能把单项投资的损失换算成对整个账户的影响。\n  今日产出：20,000元模拟账户，持有股票A 4,000元、股票ETF 6,000元、现金10,000元。A跌50%、ETF跌30%、现金不变，账户剩多少？\n- 第22天：第18章 组合与再平衡：先有比例，再有动作，约45分钟。能力目标：能计算组合权重，并区分再平衡与追涨杀跌。\n  今日产出：教学组合初始股票60、现金40，股票跌20%且现金不变。新股票占比是多少？重新回60%需把多少现金转入股票？\n- 第23天：第19章 定投：平滑入场，也会持续亏损，约50分钟。能力目标：能算定投份额与成本，并知道定投无法修复什么问题。\n  今日产出：每次投入600元，价格依次为3、2、3元。忽略成本和份额单位，计算总份额、平均成本和期末市值。\n- 第24天：第20章 行为与信息：不被涨跌牵着走，约40分钟。能力目标：能识别常见决策陷阱，并用记录替代情绪化操作。\n  今日产出：朋友只给你展示三笔盈利交易，说“从不亏”。你应追问哪些记录？\n- 第25天：复习（45–60分钟）。10,000元账户60%股票、40%现金，股票跌40%且现金不变，账户剩多少？写下定投和分散为何不能保本。\n  核对标准：股票6000→3600，加现金4000，总7600，组合亏24%。定投改变入场路径，分散减少部分个别风险，两者都不能消除市场风险。\n\n### 阶段6：独立判断\n\n- 第26天：第21章 公告与权益：遇到新闻先查哪一页，约50分钟。能力目标：能把公告转成可核对的问题，而不是简单贴“利好/利空”标签。\n  今日产出：公告说“拟回购不超过2亿元”，你能把2亿元当作明天必然进场买盘吗？\n- 第27天：第22章 完整案例 A：从目标到 ETF 模拟订单，约60分钟。能力目标：能写出一份可复核的ETF决策单，包括不买入的理由。\n  今日产出：若预算改为1,500元，其余条件不变，按2.002元和每笔佣金5元，最多可买多少份？\n- 第28天：第23章 完整案例 B：为一家企业写判断，而非喊目标价，约60分钟。能力目标：能用同一套数据建立个股分析，并明确判断失效条件。\n  今日产出：若今年净利润120万元中有40万元来自一次性资产出售，用18元和报告EPS算的15倍PE可能有什么问题？\n- 第29天：第24章 结业：写下你自己的投资操作手册，约60分钟。能力目标：能完成一份包含目标、证据、费用、风险和复盘的模拟决策。\n  今日产出：完成上面的综合作业，并给每个分项打分；把尚缺的事实明确写出来。\n- 第30天：复习（45–60分钟）。提交第24章作业，按100分量表自评；重做所有错题。再用5分钟解释自己的资金、产品、成本与最坏情境。\n  核对标准：80分及以上且关键错误全部纠正视为基础练习通过。记录错误来自概念、计算还是缺资料，并指定要重做的章节。无需为完成课程进行真实交易。\n\n\n\n## 第1章 先安排钱，再认识股票\n\n确定学习目标与可承受的损失\n\n学习目标：能把生活用钱、备用金和可承担风险的钱分开。\n\n### 先回答一个实际问题\n\n你有 30,000 元，半年后要交 20,000 元学费，日常备用金还需要 8,000 元。能拿来体验股票的钱最多只有剩下的 2,000 元；如果还有其他必需支出，可能一分钱也不该投入。股票账户里的钱会波动，卖出也未必能立即取回。\n\n**投资**是用今天的资金换取未来可能产生的回报，并承担结果不确定的风险。**储蓄**侧重资金保管和流动性；**交易**更强调买卖时点与价格变化。长期持有不自动等于投资，频繁操作也不自动意味着专业。\n\n### 用三个账户思考，不一定真的开三个账户\n\n- **已知支出：**房租、学费、医疗、还款等，按实际日期留够。\n\n- **应急备用：**收入突然中断仍能维持生活的钱。可用“必要月支出 × 能覆盖的月数”估算；月数取决于收入稳定性和家庭责任，不是统一规定。\n\n- **长期风险资金：**短期不需动用，即使大幅缩水也不影响基本生活的部分。\n\n### 风险承受能力，要用人民币表达\n\n“我能接受风险”太抽象。假设你准备投入 10,000 元，账户跌到 7,000 元时，会不会影响支出、睡眠或迫使你借款？若答案是会，就应缩小投入、降低权益比例或继续模拟。承受亏损的经济能力和心理意愿是两回事，按更弱的一项安排。\n\n**贯穿课程的学习者：小林（虚构）**小林把生活费和备用金留在课程之外，用 10,000 元**模拟资金**学习。第一目标不是每月赚多少，而是能解释买的是什么、算清费用、识别不能承受的损失、写下退出条件。本课程不替小林决定真实资金比例。\n\n### 第一天做一张资金说明书\n\n写下：资金用途、最早用钱日期、是否有借款、能承受的人民币损失、每周可投入的学习时间。若存在高成本债务、短期刚需或无法判断风险，先学习而不买入同样完成了当天任务。融资、期权、期货、杠杆 ETF 不属于这条新手路线。\n\n本课程是金融知识教育与模拟练习，不提供个性化荐股或收益保证。完成课程意味着具备基础判断流程，不意味着已能持续盈利。\n\n### 动手练习\n\n小林有 30,000 元，已知支出 20,000 元、备用金需求 8,000 元。写出理论剩余金额，并说明为什么这不是“必须投入金额”。\n\n**参考答案：** 30,000−20,000−8,000＝2,000 元。还需检查其他责任、时间和承受能力；可以全部不投入。模拟学习无需真实资金。\n\n### 自测\n\n半年后必须使用的钱，最适合如何处理？\n\nA. 趁现在买股票，半年后卖出\nB. 先保证用途和可用性，不把它当作风险资金\nC. 买足够多只股票就不会亏\n\n**正确答案：B。** 分散投资不能保证半年后的本金，资金用途先于收益目标。\n\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)\n\n\n## 第2章 买股票，究竟买到了什么\n\n用一家早餐店理解股权、市值和分红\n\n学习目标：能区分股价、市值、企业现金与股东收益。\n\n### 从“晨光早餐店”开始\n\n假设一家店被分成 100 万份股权，每份是一股。你持有 1 万股，就拥有 1% 的股权。普通股代表公司所有权的一部分，通常包含按规则参与表决、分享分红等权利；它不是保证支付固定利息的借条。公司清算时，普通股股东在债权人之后获得剩余财产，可能没有剩余。\n\n公司第一次发行股票募集资金，属于发行环节。你后来从另一个投资者手里买入已上市股票，多数情况下钱付给卖方，不是直接汇进公司经营账户。因此，股价今天跌 5%，不代表公司银行存款当天减少 5%。\n\n### 股价与市值，是单价与整家公司价格\n\n总市值 ＝ 每股价格 × 总股数\n\n早餐店总股数 100 万股、每股 10 元，市值为 1,000 万元。甲公司股价 5 元、股数 100 亿股，市值 500 亿元；乙公司股价 50 元、股数 1 亿股，市值 50 亿元。不能凭“5 元比 50 元低”就说甲便宜。后面还要看每股利润和风险。\n\n### 赚钱有两个直接来源\n\n一是以更高价格卖出产生价差；二是公司决定发放的现金分红。公司盈利不等于全部分红，公司亏损时股价也可能因市场预期上涨。你的回报同时取决于经营结果、买入价格、卖出价格、分红和交易成本。\n\n**演示：分红不是多出一笔“免费钱”**假设持有 100 股，除息前每股 10 元，每股分红 0.50 元。忽略税费和市场变化，除息参考价约为 9.50 元：股票价值 950 元＋现金 50 元＝原来的 1,000 元。实际开盘和收盘价格仍由交易决定。\n\n### 另外三个经常出现的词\n\n**流通股**是按相应规则可以在市场交易的股份，流通市值和总市值的口径可能不同。**增发**增加股数，如果利润没有同步增加，每股能分到的利润可能下降。**回购**是公司买回自身股份；是否注销、买入价格和资金来源决定它的影响，看到“回购”两个字不能直接认定利好。\n\n**股票与债券：**买股票承担经营剩余风险，回报不固定；买债券一般拥有约定本息的债权，但仍有违约与价格风险。银行存款、货币基金、债券基金、股票 ETF 也不是同一种东西。\n\n### 动手练习\n\n公司有 2 亿股，每股 12 元；你持有 1,000 股。算总市值、你的持股比例和持仓市值。\n\n**参考答案：** 总市值 24 亿元；持股比例 1,000÷200,000,000＝0.0005%；持仓市值 12,000 元。持仓市值不等于卖出后净到手金额，尚有费用和成交价格变化。\n\n### 自测\n\n两家公司股价分别为 5 元和 50 元，能直接判断谁便宜吗？\n\nA. 5 元的便宜\nB. 50 元的更优质\nC. 不能，还需股数、利润、资产和风险\n\n**正确答案：C。** 单股价格缺少股数与经营能力的分母。\n\n- [Investor.gov：投资入门](https://www.investor.gov/introduction-investing)\n- [财税〔2015〕101号：股息红利差别化个人所得税](https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf)\n\n\n## 第3章 价格为什么会涨跌\n\n把公司表现、市场预期与成交区分开\n\n学习目标：能解释利好下跌、报价不成交和价格波动。\n\n### 价格是成交结果，不是“正确答案”\n\n有人愿以 10.00 元卖出，有人愿以 9.99 元买入，双方还没谈拢。若买方改为愿付 10.00 元且有相应卖量，就可能成交。行情里的最新价通常是最近一笔成交价，不是市场保证你能买到或卖出的价格。\n\n**买一**是当前最高买价，**卖一**是当前最低卖价；两者差叫买卖价差。档位上的数量会随成交、撤单变化，也可能存在队列。你看到的截图只能说明那个时点的状态。\n\n### 企业变好，股票也可能下跌\n\n**预期与实际**市场原本期待早餐公司今年利润增长 30%，结果只增长 10%。利润确实上升，但低于部分投资者预期，报价可能下降。反过来，一家公司亏损缩小，也可能因结果好于预期而上涨。这只是解释机制，不能凭新闻标题反推出唯一原因。\n\n### 三个层次共同影响价格\n\n- **经营：**销量、价格、成本、竞争、现金回收改变未来赚钱能力。\n\n- **估值：**即使利润相同，利率、风险偏好、增长信心变化，也会改变人们愿意付的倍数。\n\n- **短期交易：**资金需求、集中买卖、流动性和情绪会影响某一时点的成交。\n\n价格上涨不能证明公司经营变好，价格下跌也不能自动证明“被低估”。先把事实和解释分开：事实是“公告写了什么、价格变了多少”；解释是“可能由于什么”，仍需证据。\n\n### 投资者实际要做什么\n\n每次看到消息，先写四句：发生了什么？影响收入、成本或现金的哪一项？是否已被普遍预期？影响有多大且能持续多久？答不出最后两句时，把它放入观察清单，比编一个确定性故事有用。\n\n**牛市、熊市、震荡**是对一段行情的描述，划分方法并不完全统一，不是精确开关。“大盘涨”往往指某个指数上涨，不等于所有股票都涨。**成交量**表示交易数量，**成交额**表示交易金额；成交活跃不等于价格未来必涨。\n\n### 动手练习\n\n某公司利润增长 15%，股价当天跌 4%。写出至少两种可能解释，以及验证它们需要的证据。\n\n**参考答案：** 可能低于市场原先预期，需看此前业绩指引与可核实的预期；也可能估值回落或市场整体下跌，需对照行业、指数和利率等。还可能存在新风险。仅凭两项数据不能确定原因。\n\n### 自测\n\n最新成交价是 10 元，是否保证现在能按 10 元买入？\n\nA. 保证\nB. 不保证，要看卖盘、数量及订单规则\nC. 只有上午保证\n\n**正确答案：B。** 最新价是历史成交，当前可成交报价可能已变化。\n\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)\n\n\n## 第4章 先算明白赚亏，再谈收益率\n\n总回报、复利、回撤与回本\n\n学习目标：能计算包含现金分红和费用的回报，理解涨跌不对称。\n\n### 100 元利润，到底算赚得多吗\n\n投入 1,000 元赚 100 元是 10%；投入 10,000 元赚 100 元是 1%。比较收益前必须确认本金、时间、费用、分红、是否追加资金。只截一张“今日盈利”不能说明完整投资表现。\n\n单次总收益 ＝ 卖出净所得 ＋ 持有期现金分红净额 − 买入总成本\n收益率 ＝ 总收益 ÷ 买入总成本\n\n**完整算例**买入 100 股，每股 10 元，买入费用 5 元；每股收到税后分红 0.20 元；后来以 11 元卖出，卖出总费用 6 元。成本 1,005 元；净卖出款 1,094 元；分红 20 元；净收益 109 元；收益率 109÷1,005≈10.85%。这些费用为教学假设。\n\n### 涨跌不对称\n\n100 元先跌 20% 变 80 元，再涨 20% 只有 96 元。要从 80 回到 100，需要涨 25%。跌 50% 需要涨 100% 才回本；跌 80% 需要涨 400%。所以控制大损失比寻找一个漂亮的平均收益更重要。\n\n亏损 d 后回本所需涨幅 ＝ d ÷ (1−d)，其中 0≤d\u003c1\n\n### 复利会放大收益，也会复合亏损\n\n假设每年回报都为 5%，且收益全部再投入，10,000 元两年后为 10,000×1.05²＝11,025 元。这是数学情境，不是股票每年能拿到 5% 的承诺。先涨 50% 再跌 50%，最终为本金的 75%，不能用算术平均的“0%”描述结果。\n\n### 回撤与年化\n\n**回撤**是从此前净值高点下降的幅度。账户从 10,000 涨至 12,000，再跌到 9,000，虽然相对最初本金亏 10%，从高点的回撤却是 25%。**年化回报**把区间回报换算为一年可比的复合速度；短时间的年化尤其不能当作可持续预测。\n\n无外部资金进出的多年年化可用 (期末资产÷期初资产)^(1÷年数)−1。中途有定投、转入转出时，直接套这个式子会失真；后面用带日期的现金流理解真实体验。比较基金时还要区分价格指数与包含分红的全收益指数。\n\n### 动手练习\n\n10,000 元先涨 10%，再跌 10%；另一账户从高点 20,000 跌至 15,000。分别算期末金额、回撤与回本涨幅。\n\n**参考答案：** 第一账户 10,000×1.1×0.9＝9,900 元，亏 1%。第二账户回撤 25%，从 15,000 回到 20,000 要涨 33.33%。\n\n### 自测\n\n下跌 30% 后需要上涨多少才能回到原值？\n\nA. 30%\nB. 42.86%\nC. 60%\n\n**正确答案：B。** 剩余 70%，30÷70≈42.86%。\n\n- [Investor.gov：投资入门](https://www.investor.gov/introduction-investing)\n\n\n## 第5章 账户、券商与第一张交易清单\n\n认识交易链条，练习操作前的核对\n\n学习目标：能区分证券账户、资金账户、银行账户与可用可取资金。\n\n### 钱和股票分别在哪里\n\n**证券账户**记录你名下的证券权益；**券商资金账户**用于证券交易资金的结算与显示；**银行账户**与资金账户之间通过银证转账划转资金。证券公司提供交易服务，交易所在规则下撮合买卖，中国结算等机构承担相应登记结算职责。App 是入口，不是这些职责本身。\n\n### 选券商，先核身份与服务\n\n从证监会、证券业协会等官方入口核对机构身份，再使用券商官网提供的官方 App。检查股票与 ETF 的佣金分别是多少、最低收费怎么约定、展示费率是否包括经手费等项目、是否另列过户费，以及客服和交易记录是否容易取得。不要只比较广告里的一个低数字。\n\n开户通常涉及身份证件、本人银行卡、身份核验和风险测评；不同账户状态、年龄、产品权限有不同要求。风险测评如实回答，不为开通高风险权限而选择不符合自己的答案。主板股票、创业板、科创板、北交所等权限并非一概相同，具体适当性要求看券商当前流程。本课程先练普通沪深主板与普通股票 ETF。\n\n### “可用”不等于“可取”\n\n卖出股票后，所得资金通常当天可用于证券交易，但一般要到下一交易日才可转出到银行；具体看结算与券商资金显示。周五卖出，遇正常周末不代表周六可取。下了未成交买单，部分资金也可能被冻结；撤单尚未成功时，不应把它当成已经释放。\n\n**订单生命周期**小林点击提交买入 → 券商接受申报 → 交易所受理 → 等待或部分成交 → 全部成交或撤单。**已报不等于已成，撤单请求不等于已撤。**如果只成交 100 股而申报 300 股，已成交部分不能通过撤单取消。\n\n### 每次提交前读一遍\n\n- 证券全称与代码匹配吗？是股票、ETF，还是名称相似的其他产品？\n\n- 方向是买入还是卖出？价格与数量对吗？预算含手续费吗？\n\n- 账户有没有权限，产品有没有停牌、风险警示或特殊交易状态？\n\n- 今天买入的部分何时能卖？订单的有效期和未成交部分如何处理？\n\n- 交易后能否在成交记录与交割单中核对实际结果？\n\n模拟网页只用于理解，不连接券商，也不会提交真实订单。验证码、密码和转账操作始终在本人确认的官方渠道完成。\n\n### 动手练习\n\n申报买入 300 股，状态显示已成交 100 股、余 200 股待成交。你申请撤单后应检查什么？\n\n**参考答案：** 检查剩余 200 股是否显示已撤、资金是否释放；保留已经成交的 100 股记录。不能把撤单请求当作全部 300 股交易被取消。\n\n### 自测\n\n证券卖出后“可用资金”增加，意味着一定可以立即转到银行吗？\n\nA. 是\nB. 否，还要看可取资金和结算时间\nC. 只看银行卡余额\n\n**正确答案：B。** 可用和可取对应不同的资金状态。\n\n- [上交所：股票投资账户与交易服务](https://one.sse.com.cn/onething/gptz/)\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)\n\n\n## 第6章 A 股交易规则速查\n\n按市场、板块和产品辨认规则\n\n学习目标：能判断T+1、申报单位、涨跌幅与交易时段的适用范围。\n\n### 先确认自己买的属于哪一类\n\nA 股是境内发行、以人民币认购和交易的股票这一常用分类。沪深主板、科创板、创业板和北交所具有不同规则。ETF 是基金，不能因为也有六位代码，就套用全部股票规则。本课聚焦沪深普通主板股票与跟踪境内股票指数的普通 ETF。\n\n**规则核对日：2026-10-26。**沪深交易规则于 2026-07-06 实施新版。以下摘要要和具体证券状态一起使用；未来修改不自动更新到离线版本。\n\n### T+1 与申报数量\n\n普通 A 股和普通境内股票 ETF，当天新买入的部分通常不能当天卖出，要到下一交易日。T 是交易日，不是自然日。如果原来持有可卖的旧仓，当天卖出旧仓不代表当天新买入的仓位获得了 T+0 权利。\n\n沪深主板股票竞价买入一般按 100 股或其整数倍申报；卖出余额不足 100 股的部分，应按规则一次性申报。普通 ETF 二级市场买卖通常以 100 份或其整数倍申报。科创板股票通常最低 200 股，之后可按 1 股递增等，不能把“一手 100 股”应用到所有板块。\n\n### 涨跌幅不是损失保险\n\n沪深主板普通股票通常为 10%；现行主板风险警示股票也为 10%，不要照抄旧教材的 5%。科创板与创业板通常为 20%，其中风险警示股票也应按所在板块规则识别。北交所一般为 30%。沪深首次公开发行上市股票前 5 个交易日等特定情形可能无价格涨跌幅限制。ETF 的涨跌幅要看品种与适用规则，常见有 10% 和 20%。\n\n涨停、跌停只是允许申报价的边界。跌停时没有足够买方，想卖也可能卖不出；连续多个交易日下跌会累计造成远大于一天限制的损失。价格还涉及最小变动单位和价格笼子等申报约束，离最新价很远的限价单也可能被拒绝。\n\n### 普通交易日的时间轴（北京时间）\n\n- **9:15–9:25：**开盘集合竞价；其中 9:20–9:25 不接受撤单。\n\n- **9:30–11:30、13:00–14:57：**连续竞价。\n\n- **14:57–15:00：**收盘集合竞价，不接受撤单。\n\n- **15:05–15:30：**符合规则的 A 股、ETF 盘后固定价格交易，按当日收盘价撮合，并非全天自由报价交易。具体品种状态、券商支持与申报安排需核对。\n\n集合竞价把一段时间内申报按规则集中确定成交价；连续竞价随申报进行撮合。9:25–9:30 的券商接单不等于交易所已即时成交。交易日排除休市日，不能按工作日历自行推断节假日交易安排。\n\n### 新手只需记住这一套动作\n\n打开证券详情，核对市场与类别 → 查看当日涨跌幅与可卖数量 → 用允许的申报数量和价格 → 成交后查成交记录。对照“规则”操作，比背一张把所有证券混在一起的表更可靠。\n\n### 动手练习\n\n周五买入普通境内股票 ETF，周末无交易。能否周五卖出这批新买份额？若下周一休市，最早哪天？\n\n**参考答案：** 通常不能周五卖出新买份额；最早为下一个交易日，若周一休市且周二开市，则为周二。跨境、债券、黄金等 ETF 的部分品种有不同回转规则，不能混用。\n\n### 自测\n\n跌停价到了，止损单是否必然成交？\n\nA. 会，交易所有保底买方\nB. 不会，成交仍依赖对手方与队列\nC. 会，只要多点几次\n\n**正确答案：B。** 价格限制不提供流动性保证。\n\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)\n- [深交所交易规则（2026年修订）全文](https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf)\n- [上交所：股票投资一件事](https://one.sse.com.cn/onething/gptz/)\n- [深交所：2026交易规则技术准备通知](https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html)\n- [北京证券交易所交易规则（2026）](https://www.bse.cn/jygl_list/200028217.html)\n\n\n## 第7章 亲手走完一笔限价买卖\n\n报价、盘口、部分成交与滑点\n\n学习目标：能解释限价单成交逻辑，识别成交价格与数量的不确定性。\n\n### 限价单约束价格，不保证成交\n\n买入限价 10.02 元，表示你接受以不高于 10.02 元的价格买入；卖出限价 10.02 元，表示你接受以不低于 10.02 元的价格卖出。它不是“必须以恰好 10.02 元成交”。市价类订单更重视迅速匹配，但具体类型、保护限价和可用时段不同，新手先用限价理解全过程。\n\n**冻结盘口演示，实际行情会变化**卖一：10.00 元、200 股；卖二：10.01 元、300 股；卖三：10.03 元、500 股。小林发出限价 10.01 元、数量 400 股的买单。假设没有其他订单抢先，也没有撤单，成交可能是 200 股×10.00＋200 股×10.01＝4,002 元，平均价为 10.005 元。单笔成交价仍遵守报价最小单位，平均成本可以出现更多小数。\n\n如果小林发出 600 股的买单，现有 10.01 元及以下卖量只有 500 股；剩余 100 股可能继续排队，不能自动按 10.03 元购买。\n\n### 为什么“我明明看见那个价”却没成交\n\n行情到达你屏幕、你提交订单、订单到达交易所需要时间。卖量可能已经被买走，也可能撤单。通常按价格优先、同价时间优先等规则撮合，你的单子还有排队顺序。买一卖一大额挂单不能证明某个神秘资金一定会维持价格。\n\n### 买卖价差与滑点\n\n假设买一 0.999、卖一 1.001，你立即买入再立即卖出，在报价不变且足量的简化情境下，仅价差就损失 0.002÷1.001≈0.20%，还没有算佣金。**滑点**是你预期的执行价格与实际成交价格的差异；在流动性不足或快速波动时可能更大。\n\n### 从申报到复盘的五步\n\n- 确认价格、数量、资金是否足够，预留费用。\n\n- 提交一次后查看订单状态，不因短暂等待重复点击。\n\n- 部分成交时先核对实际成交，不盲目补发完整订单。\n\n- 取消未成交部分后，等待撤单确认再决定是否重报。\n\n- 成交后记录平均价、总金额、费用和未成交数量。\n\n本课使用冻结盘口教机制，不模拟真实市场队列。真实操作还须遵守前一章的时段、涨跌幅与申报约束。\n\n### 动手练习\n\n仍用上述盘口，限价 10.00 元买入 300 股。在盘口不变、没有竞争订单时，能立即买到多少股？余单怎么办？\n\n**参考答案：** 只能立即买到 200 股，金额 2,000 元。剩余 100 股按订单规则等待，不会跨越限价去买 10.01 元。若希望取消余单，需要成功撤单。\n\n### 自测\n\n买入限价 10.01 元的含义是？\n\nA. 一定按10.01成交\nB. 可按不高于10.01的价格成交，也可能不成交\nC. 可以自动提高到10.03\n\n**正确答案：B。** 限价限制最差可接受价格，不保证数量和成交时间。\n\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)\n\n\n## 第8章 交易成本：小金额最容易算漏\n\n佣金、印花税、过户费与真实盈亏\n\n学习目标：能独立复算股票及ETF的一次往返交易成本。\n\n### 先区分收费项目\n\n**佣金：**按与券商约定的费率与最低收费计算，股票和 ETF 的约定可能不同。常见报价“万分之二点五”即 0.025%，不是 2.5%。**证券交易印花税：**当前 A 股卖出环节有效税率为成交金额的 0.05%；买入不收。**股票过户费：**现行 A 股按成交金额 0.001% 双向收取。ETF 二级市场交易通常不征收股票交易印花税，也不按 A 股过户费模型计费。\n\n券商报价可能包含经手费、证管费等项目，也可能单列。务必用交割单核对，不能把已包含的项目再加一次。此处以“佣金包含常规交易规费、股票过户费另列”的模型教学；不同账户合同与收费口径可能不同。\n\n**股票往返：10 元买 1,000 股，11 元卖出**教学假设：佣金万 2.5、每笔最低 5 元；无分红，无其他费用，分别视为一笔完整委托。\n\n- 买入金额 10,000；佣金 max(2.50,5)＝5；过户费 0.10；总成本 **10,005.10 元**。\n\n- 卖出金额 11,000；佣金 5；印花税 5.50；过户费 0.11；净所得 **10,989.39 元**。\n\n- 净利润 **984.29 元**，收益率约 **9.84%**，少于裸价差的 10%。\n\n### 为什么小单频繁买卖贵\n\n如果每笔最低佣金为 5 元，1,000 元交易的单边佣金就是 0.5%；买卖各一次仅佣金就接近 1%。这不是推荐把订单做大，而是提醒用足够的模拟练习避免为操作冲动付费。ETF 是否有最低收费、费率是否相同必须问清，不能默认所谓“免五”。\n\n### ETF 还有持有成本\n\n管理费、托管费等通常在基金资产中按规则计提，体现在净值里；你一般不会每天收到一张扣费账单。比较基金净值表现时，它通常已反映相关费用，不应再次机械扣同一笔年费。买卖佣金、价差和溢折价仍是另一层成本。\n\n### 交割单怎么核对\n\n逐项检查交易日期、证券、方向、成交数量、成交均价、成交金额、佣金、印花税、过户费及资金发生额。分笔成交如何汇总收费按券商规则核实。计算器是估算，实际收费、四舍五入与结算结果以账户交割单为准。\n\n### 动手练习\n\n假设一只普通 ETF 以 2 元买 1,000 份，2.10 元卖出；佣金买卖各5元，无其他费用。净赚多少？\n\n**参考答案：** 买入总成本 2,005 元；卖出净额 2,095 元；净赚 90 元；收益率 90÷2,005≈4.49%。没有按股票模型额外征印花税或过户费。\n\n### 自测\n\n股票卖出印花税0.05%，卖出金额10,000元，税额是多少？\n\nA. 0.5元\nB. 5元\nC. 50元\n\n**正确答案：B。** 10,000×0.0005＝5元。费率百分数与小数换算容易错。\n\n- [财政部、税务总局：证券交易印花税减半征收](https://jiangsu.chinatax.gov.cn/art/2023/8/28/art_8349_432258.html)\n- [上交所收费一览表](https://www.sse.com.cn/services/tradingservice/charge/ssecharge/)\n- [上交所ETF课堂：ETF优势与交易费用](https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml)\n\n\n## 第9章 看懂行情页，停止猜测图形\n\nK线、成交量、复权与常见误读\n\n学习目标：能从行情中读出事实，而不把技术图形当作预测保证。\n\n### 一根 K 线只有四个价格\n\n日 K 线概括一个交易日的开盘、最高、最低、收盘。实体表示开盘与收盘的区间，上下影线表示期间触及的极值。颜色按软件设置辨认，不能靠红绿本身判断涨跌。日 K 是一天，周 K 是一周；不同周期回答不同问题。\n\n**亲手读一根线**开盘 10.00、最高 10.80、最低 9.70、收盘 10.40。实体范围 10.00–10.40，上影 0.40，下影 0.30；收盘高于开盘 4%。但若前一交易日收盘是 10.60，当日相对昨收反而下跌约 1.89%。所以“阳线”不一定意味着相对昨收上涨。\n\n### 三个辅助数字\n\n**成交量：**交易数量，单位可能是股、手或份，必须看标注。**换手率：**成交数量相对某个流通股本口径的比例，不同软件分母可能不同。**振幅：**常用当日最高与最低价差除以前收盘价。它们描述活跃度和波动，不证明买方一定比卖方“更聪明”。每一笔成交都有买方和卖方。\n\n### 均线只是平滑过的过去价格\n\n5 日简单移动平均线把最近 5 个收盘价加总除以 5。假设分别为 10、11、10、12、12，均线是 11。它能帮你描述过去趋势，但必然滞后。“金叉”“放量突破”即使定义清楚，也不能单凭名称保证获利，需要包含成本、样本外验证和失败情境；本课不把这些图形当买卖秘诀。\n\n### 除权除息与复权\n\n分红、送股会使价格出现机械调整。若每股分红 0.50 元，原 10 元附近的股价出现相应调整，不应直接当作经营突然恶化。**不复权**保留历史真实报价；**前复权、后复权**按各自方法调整历史序列以便比较，显示价格可能并非当日可成交价。分析同一趋势必须使用一致口径。\n\n### 一分钟读行情的顺序\n\n- 核对证券名称、代码、产品类型和是否停牌。\n\n- 读现价、涨跌幅的比较基准，确认数据时间。\n\n- 看买卖报价与数量，估计交易摩擦。\n\n- 看所选时间范围与复权口径，不从局部截图推断长期表现。\n\n- 把经营判断留给财报和公告，把图形当作描述工具。\n\n如果看到“主力净流入”，先看数据商如何按成交方向、单笔大小分类；它通常不是实名投资者资金流向，也不能单独识别所谓主力意图。\n\n### 动手练习\n\n某股昨收20，今开19.5、最高20.3、最低19.2、收盘19.8。它收阳还是收阴？相对昨收涨跌多少？\n\n**参考答案：** 收盘高于开盘，按通常定义为阳线；相对昨收为19.8÷20−1＝−1%。这说明K线实体方向和日涨跌幅的参照不同。\n\n### 自测\n\n均线向上意味着什么？\n\nA. 明天必涨\nB. 所用历史价格的平滑趋势向上\nC. 公司利润一定增长\n\n**正确答案：B。** 均线从过去价格计算，不能单独保证未来或证明基本面。\n\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)\n\n\n## 第10章 指数：给一篮子股票做温度计\n\n理解宽基、行业、权重与分红口径\n\n学习目标：能解释指数与基金的区别，并识别重复和集中暴露。\n\n### 指数是一套规则和计算结果\n\n指数制定选样、权重和调整规则，然后把一组证券的变动汇总成一个数字。你不能直接买一串“指数点数”，通常通过跟踪它的基金获得类似的市场暴露。指数上涨 1%，不代表每只成份股都上涨 1%。\n\n**三个成份的虚构指数**甲权重50%、乙30%、丙20%；当天收益分别为+2%、−1%、0%。在权重不变的简化情境下，指数收益≈50%×2%＋30%×(−1%)＋20%×0%＝**0.7%**。最大的成份对结果影响更大。\n\n### 真实例子：沪深 300\n\n中证指数公司的沪深 300 指数选择沪深市场中规模大、流动性好的 300 只证券作为样本，旨在反映其整体表现。它按编制方案选样与加权，不是“每只买三百分之一”，也不是挑出未来最能涨的 300 只。样本会调整，今天的名单不能拿来无偏地回算过去。\n\n### 宽基、行业和主题\n\n**宽基指数**通常覆盖较多行业，但仍可能集中于某些大公司、风格或单一国家。**行业指数**聚焦银行、医药等特定行业。**主题指数**按某个主题选择公司，可能横跨行业，选样定义尤其重要。“新能源”“高股息”等名字不告诉你完整风险。\n\n不同指数可能覆盖大盘、中盘、小盘公司，或偏价值、成长等特征。小市值不自动等于高成长，高股息不自动等于低风险。要看实际成份和权重，而不是根据名称贴标签。\n\n### 价格指数与全收益指数\n\n价格指数通常不把成份股分红按再投资方式全部计入；全收益指数考虑分红再投资。若基金收益中已经包含分红，却拿来对比未计分红的价格指数，可能夸大基金的相对表现。指数基点是计算起点，3,000 点不天然比4,000点便宜，也无法在不同指数之间比较贵贱。\n\n### 看懂一页指数资料\n\n依次读编制目标、样本空间、选样规则、加权方式、调整频率、前十大成份、行业权重和收益口径。真正需要回答的是：“我暴露在什么经营风险里？”同时买两只高度重叠的宽基 ETF，可能只是把同一篮子重复买了两遍。\n\n### 动手练习\n\n指数甲含某行业40%，你又买一只100%投该行业的基金，二者各占组合一半。该行业合计暴露多少？\n\n**参考答案：** 50%×40%＋50%×100%＝70%。持有两个基金不等于风险均匀分散。\n\n### 自测\n\n不同指数的3000点和5000点，能直接比较哪个便宜吗？\n\nA. 可以，3000点更便宜\nB. 不能，基点与构成不同\nC. 5000点说明回报更高\n\n**正确答案：B。** 指数点位不是跨指数可比的估值。\n\n- [中证指数：沪深300指数编制方案](https://csi-web-dev.oss-cn-shanghai-finance-1-pub.aliyuncs.com/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000300_Index_Methodology_cn.pdf)\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)\n\n\n## 第11章 ETF：买入一篮子资产的入口\n\n净值、交易价格、申赎与溢价\n\n学习目标：能区分ETF市场价与净值，计算溢价消失的损失。\n\n### ETF 的两个层面\n\nETF 是交易型开放式基金，普通投资者可以在交易所买卖基金份额。本课程主要讲**跟踪境内股票指数的 ETF**：基金依合同持有组合并力求实现跟踪目标。ETF 这个交易结构本身不保证低风险，也不意味着所有 ETF 都是被动产品；2026 年已出现主动 ETF 获批进展。\n\n**二级市场买卖**是你与其他参与者交易份额，像买卖股票一样看报价。**一级市场申购赎回**是按基金要求，用一篮子证券或现金等与基金交换份额，门槛和细节不同。新手在券商里输入几百份买单通常是前者，不要误以为能按净值无限申赎套利。\n\n### 三个价格不要混在一起\n\n- **基金份额净值：**基金资产扣负债后，平均到每一份的价值，按披露规则计算。\n\n- **市场价格：**交易所里实际买卖形成的价格，可以偏离净值。\n\n- **IOPV：**盘中参考净值估算，是参考，不是保证可成交或可兑付的报价。\n\n参考溢价率 ＝ 市场价格 ÷ 可比参考净值 − 1\n\n**底层没跌，为什么我亏了？**参考净值1.00元，你以1.10元买入，溢价10%。之后净值仍为1.00元，但市场价回到1.00元，你的价格损失是(1−1.10)÷1.10＝**−9.09%**。这来自溢价回落，尚未计算交易费。\n\n### 为什么套利不能保证价格永远贴住净值\n\n申赎机制通常有助于约束偏离，但参与者受成本、资金、申赎额度、证券停牌、市场时差等影响。跨境 ETF 的境外市场可能尚未开盘，IOPV 会使用较旧价格；汇率也在变化。看到一个溢价数字，先确认时点、估值来源和申赎状态，不直接把它当可获利机会。\n\n### 分红、T+1 和风险\n\n成份股分红先成为基金资产的一部分；基金是否向份额持有人分红要按合同和公告。每份净值2元、分红0.10元，其他条件不变时净值约降至1.90元，财富没有凭空增加。普通境内股票 ETF 二级买入通常 T+1；黄金、债券、货币和符合条件的跨境等品种可能有不同回转安排。\n\nETF 仍会遭遇底层资产下跌、集中风险、跟踪偏离、交易流动性不足及清盘等风险。清盘不是基金净值必然归零，但可能迫使你在不合适时间结束持仓，并经历清算过程。\n\n### 动手练习\n\n同一时点估计净值2.00、市场价2.06；随后净值不变而价格回到2.00。算溢价和价格损失。\n\n**参考答案：** 溢价=2.06÷2−1=3%；买入后的损失=2÷2.06−1≈−2.91%，尚未扣费。净值/IOPV本身还可能存在时点误差。\n\n### 自测\n\nIOPV 最合适的理解是？\n\nA. 保证能卖出的价格\nB. 盘中参考估值，可能有时差或误差\nC. 明日收盘价预测\n\n**正确答案：B。** 参考估值与可成交的盘口价格不是一回事。\n\n- [深交所：2026交易规则技术准备通知](https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html)\n- [深交所：场内基金投资交易指南](https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html)\n- [深交所：首批主动ETF正式获批](https://www.szse.cn/aboutus/trends/news/t20261019_623374.html)\n- [深交所：ETF权益分派与除息](https://investor.szse.cn/knowledge/fund/trade/t20191106_571787.html)\n\n\n## 第12章 怎样比较两只同类 ETF\n\n一张能实际使用的筛选清单\n\n学习目标：能把指数、费率、跟踪表现和交易成本放在同一张判断表里。\n\n### 第一步先选风险暴露，再比较产品\n\n两只基金只有在跟踪目标、收益口径等可比时，费率比较才有意义。宽基 ETF 和半导体主题 ETF 即使都叫“ETF”，风险结构差别很大。先解释指数包含什么，再问哪只实现这个目标更合适。\n\n### 六项实用检查\n\n- **跟踪对象：**指数全称和代码、成份与行业集中度。\n\n- **持有成本：**管理费、托管费及其他披露费用，检查生效日期。\n\n- **跟踪表现：**同一时期、同一收益口径下与基准差多少。\n\n- **交易质量：**买卖价差、足量盘口、实际成交活跃度和溢折价。\n\n- **规模与运营：**基金规模、存续情况、清盘条款与申赎是否受限。\n\n- **个人执行：**券商 ETF 佣金、最低收费、计划金额与买卖频率。\n\n### 跟踪差异与跟踪误差\n\n教学中定义**跟踪差异＝基金区间回报−基准区间回报**，要在具体资料中确认符号口径。例如基准涨10%，基金涨9.6%，差异−0.4个百分点。**跟踪误差**描述基金与基准回报差在各期的波动，常用统计指标计算。长期略落后但很稳定，与时而大赢时而大输，是不同情况。\n\n**同一指数的虚构产品 A / B**A：管理+托管年费合计0.20%，典型价差0.10%；B：年费0.15%，典型价差0.50%。假设持有10,000元一年且资产规模不变，B的年费优势约5元；但一次额外0.40个百分点的交易摩擦就是40元。真实价差会变化，不能用一张截图得出永久结论。\n\n若你持有很多年、交易次数很少，年费的重要性会提升；若订单很小，最低佣金可能成为主要成本。没有一个排序能适合所有金额和期限。\n\n### ETF、ETF 联接与场外指数基金\n\nETF 通过证券账户在交易所按市价买卖，通常存在份额单位和交易费用。联接基金主要投资目标 ETF；场外指数基金按相应申赎安排、以基金净值确认，存在确认和到账时间差。A/C份额收费结构可能不同，不能只看字母就决定。比较实际金额、持有期、费用和便利性，而不是争论某一种永远更好。\n\n### 避开三个“看起来很简单”的错误\n\n不因为每份1元就比每份4元更便宜；不按去年涨幅榜直接选冠军；不把“规模最大”当作不存在风险。实际产品资料可能更新，决策前至少核对最新产品资料概要、招募说明书更新和近期公告。\n\n### 动手练习\n\nA与B同指数，你只知道B年费低0.05个百分点。还需要哪三类资料才能判断？\n\n**参考答案：** 至少需要实际可成交价差/盘口与溢价、同口径跟踪表现、券商佣金及计划持有金额和期限；还应看规模和最新公告。单看年费不足以决定。\n\n### 自测\n\n跟踪差异−0.4个百分点意味着？\n\nA. 基金一定亏0.4%\nB. 在定义口径下基金回报比基准低0.4个百分点\nC. 基金明天会补涨\n\n**正确答案：B。** 相对落后不等于绝对亏损，也不存在自动补涨保证。\n\n- [上交所ETF课堂：ETF优势与交易费用](https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml)\n- [深交所：场内基金投资交易指南](https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html)\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)\n\n\n## 第13章 从生意看公司，不从故事选股\n\n收入、成本、竞争优势与增长的代价\n\n学习目标：能用五句话说明一家公司如何赚钱及最脆弱的环节。\n\n### 先不看股价，描述生意\n\n买个股意味着承担一家具体企业的风险。先回答：卖什么、卖给谁、为什么客户选它、钱何时收回、什么会破坏利润。若只有“国家支持”“人工智能风口”“品牌很好”，仍未回答实际赚钱的过程。\n\n**晨光早餐公司（虚构）**去年售出100万份早餐，平均每份10元，收入1,000万元；食材和直接制作成本600万元，毛利400万元；其他经营费用、税费等合计300万元，净利润100万元。这里各项为教学简化，实际报表分类更细。\n\n今年销量仍100万份，平均价格升至11元，但成本升至660万元，其他合计340万元。收入1,100万元，净利润仍100万元。**收入增长10%并没有带来利润增长。**\n\n### 增长从哪里来\n\n收入大致可拆成销量×价格；多产品公司还受结构变化影响。利润增长可能来自收入增长、单位成本下降、费用率下降，也可能来自卖资产等非经常项目。开新店带来收入增长，但需要装修和租金；收入不代表现金及时进账。\n\n### 竞争优势要有可观察证据\n\n品牌可能支持较强定价能力，规模可能摊薄成本，转换成本可能让客户不易离开。但“有护城河”不是结论，应转成证据：提价后销量是否保持、客户流失率如何、竞争者能否复制、毛利率是否稳定、获取客户是否越来越贵。\n\n### 识别周期与集中风险\n\n有些行业的价格和利润随供需周期大幅波动。景气高峰的利润可能让 PE 看起来非常低，却未必便宜。依赖一个大客户、一种原材料或单一地区的公司，可能在某个环节变化后迅速失去利润。竞争优势和脆弱点要同时记录。\n\n### 实用五句话模板\n\n- 公司向谁出售什么，通过什么渠道收钱。\n\n- 过去收入变化主要由销量、价格还是业务结构推动。\n\n- 最重要的成本是什么，能否向客户转嫁。\n\n- 与竞争者相比，有哪些能被数据检验的优势。\n\n- 出现哪一项变化会使我的判断失效。\n\n这份描述先于估值。无法说清业务时，改用分散的指数方案进行学习，或继续观察，并不比强行写出“看好”差。\n\n### 动手练习\n\n早餐公司销量增长20%，均价下降10%。收入大约增长多少？能否据此说利润也增长？\n\n**参考答案：** 收入倍率1.2×0.9=1.08，即增长8%。不能推断利润；还需食材、人工、租金、费用和税等信息。\n\n### 自测\n\n哪一项更能检验“定价能力强”？\n\nA. 名字听起来高端\nB. 提价后销量、客户留存和利润率的实际变化\nC. 股吧里很多人看好\n\n**正确答案：B。** 要用经营数据检验优势，而不是用印象。\n\n\n\n\n## 第14章 三张财报：利润不是现金\n\n利润表、资产负债表、现金流量表\n\n学习目标：能读取关键财务指标，并发现需要进一步核对的异常。\n\n### 三张表回答三个问题\n\n**利润表：**一段时间收入、成本和利润怎么样。**资产负债表：**某个时点有什么资产、欠多少债、股东剩多少权益。**现金流量表：**一段时间钱从哪里来、到哪里去。前者和后者是期间，资产负债表是时点，不能把季末余额当作一季度收入。\n\n资产 ＝ 负债 ＋ 所有者权益\n\n资产包含现金、应收账款、存货、设备等；负债包含借款、应付款等；权益是会计意义上的剩余。账面价值不保证能按该价格全部变现，存货可能滞销，应收可能收不回。\n\n### 先抓七个指标\n\n- **营业收入：**卖出的业务规模。\n\n- **毛利率：**(营业收入−营业成本)÷营业收入，观察产品和直接成本关系。\n\n- **归母净利润：**归属于母公司股东的利润，与整个集团净利润区分。\n\n- **扣非归母净利润：**剔除规定的非经常损益后看经营，但不等于完美“真实利润”。\n\n- **经营现金流净额：**经营活动实际产生的净现金。\n\n- **有息负债与现金：**同时看到期日、受限资金，不能只看总量。\n\n- **ROE：**利润相对净资产的回报，正式口径可能为加权平均；高杠杆也可能推高它。\n\n**赚了100万元，却只有20万元现金**虚构公司本期确认收入1,000万元、净利润100万元，但客户赊账使应收增加80万元。在其他项目不变的极简条件下，经营现金净流入可能只有20万元。利润确认在先、收钱在后，不能说其余80万元已躺在银行。\n\n### 异常不是定罪，而是查证线索\n\n收入增长20%、应收增长80%，要看账期、客户、坏账准备与回款；存货持续快于销售增长，要看跌价和滞销；利润来自一次性卖资产，要看扣非与现金到账。单一比率不够判断财务造假，需要读附注和审计意见，并承认外部投资者的信息限制。\n\n### 怎么读才省时间\n\n- 确认报告期、单位（元/万元/亿元）、合并口径、是否重述。\n\n- 从主要财务数据看三年变化，不只看单年。\n\n- 看经营讨论解释变化，再去报表附注找对应证据。\n\n- 查看审计意见、关联交易、担保、受限资金与债务到期。\n\n- 把不知道的项目记成问题，不用猜测补全。\n\n同比比较去年同一期间；环比比较上一相邻期间。不要用旺季季度和淡季季度简单断言趋势，也不要把半年利润乘2当作可靠全年预测。银行等金融企业要用适合行业的指标，不能机械套制造业模板。\n\n### 动手练习\n\n公司资产500万元、负债300万元、全年净利润30万元，期初期末权益都为200万元。简化ROE是多少？负债增加能否让ROE看起来更高？\n\n**参考答案：** 权益500−300=200万元，简化ROE=30÷200=15%。在其他条件下，更小权益基数或更多杠杆可能推高ROE，因此不能单看高ROE就认定经营更安全。\n\n### 自测\n\n利润很高但经营现金流长期偏弱，首先应？\n\nA. 直接断定造假\nB. 检查应收、存货、收付时点和业务特征\nC. 忽略，利润够高就行\n\n**正确答案：B。** 差异是分析入口，需要用附注与持续数据解释。\n\n- [贵州茅台2025年年度报告](https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf)\n\n\n## 第15章 估值：好公司也可能买贵\n\nPE、PB、股息率与情景估算\n\n学习目标：能算基础估值，知道分母失真与估值回落的影响。\n\n### 价格必须配一个“买到了多少”\n\n同样20元一股，每股每年赚1元和赚2元，含义不同。**每股收益EPS**是按相应会计口径把归属于普通股股东的利润分摊到股份；实际基本/稀释EPS有加权股数等细节。入门先理解：每一股对应多少利润，而不是它一定分给你多少现金。\n\nPE（市盈率）＝ 股价 ÷ EPS\nPB（市净率）＝ 股价 ÷ 每股净资产\n历史股息率 ＝ 过去某期间每股现金分红 ÷ 当前股价\n\n**静态PE**常用上一完整年度利润，**TTM PE**常用最近滚动12个月利润，**预测PE**用未来预测利润。分母不同，数值不能混比。亏损或极低利润下PE可能没有正常比较意义；不能把负PE理解为“超级便宜”。\n\n**盈利增长，但估值压缩**早餐公司EPS为1元，市场愿意付20倍PE，股价20元。下一年EPS增长20%到1.20元，但市场只给15倍，情景价格变成18元。忽略分红，投资者仍损失10%。企业增长与投资回报之间隔着买入估值与退出估值。\n\n### 做区间，不制造精确目标价\n\n假设下一年EPS可能为0.8、1.0、1.2元；你用12、15、18倍来观察敏感性，得到一组可能价格。这些倍数是教学假设，不是市场应当给出的“标准”。判断倍数至少需要考虑利润可持续性、增长、竞争、负债、利率与同业差异。\n\n周期公司高峰利润可能压低PE；重资产企业PB要结合资产质量与ROE；轻资产企业账面资产较少，PB可比性可能弱。股息率高可能源于价格下跌，未来分红也可能减少。任何单个指标都不能替代业务分析。\n\n### 折现的直觉与安全余量\n\n如果一年后确定能拿到100元，假设你要求5%的年回报，今天对应价值是100÷1.05≈95.24元。企业未来现金既不确定，又跨越多年，折现率和增长假设稍变，结果可能很不一样。所谓安全余量，是为估计错误留下空间，不是给某个价格贴上绝对安全标签。\n\n实用做法：写悲观、基准、乐观三种经营情境，明确每个数字从何而来，再看当前价格是否已经要求乐观情境才能成立。无法合理估计时，结论可以是“暂不参与”。\n\n### 动手练习\n\nEPS从2元变2.2元，PE从20倍降到16倍。价格从多少变多少？不计分红的回报是多少？\n\n**参考答案：** 起初40元，后来35.2元；35.2÷40−1=−12%。利润增长10%，但估值下降20%，共同结果是1.1×0.8−1=−12%。\n\n### 自测\n\n看到某股PE只有5倍，最先要核对？\n\nA. 利润是否可持续、口径是否一致、是否处于周期高峰\nB. 立即买入\nC. 5倍意味着5年保证回本\n\n**正确答案：A。** PE是价格与利润的比值，不是保证的现金回本年限。\n\n\n\n\n## 第16章 真实财报演示：先事实，后解释\n\n用贵州茅台2025年报练习读数\n\n学习目标：能从年报提取数字并区分原始数据、公司解释和个人推断。\n\n### 这次换成真实、固定时间的数据\n\n案例使用上交所披露的**贵州茅台2025年年度报告**，不是实时行情，也不构成对该股票的买卖判断。报告第6页列有主要财务数据；读者无需离开本页即可做完基础练习，原文链接用于核验。\n\n合并口径指标 | 2024年 | 2025年 | \n营业收入（亿元，约） | 1,708.99 | 1,688.38 | \n归母净利润（亿元，约） | 862.28 | 823.20 | \n经营现金流净额（亿元，约） | 924.64 | 615.22 | \n基本每股收益（元） | 68.64 | 65.66 | \n\n### 第一步：复算，而不是看“大数字”\n\n营业收入同比约−1.21%，归母净利润同比约−4.53%，经营现金流净额同比约−33.46%。百分比使用报告披露值，表内亿元金额经四舍五入。只说“赚了823亿元”无法描述变化；也不能用利润下降幅度直接推断股价应当跌多少。\n\n### 第二步：找解释，别立即下结论\n\n报告说明，经营现金流变化主要与控股财务公司吸收集团成员存款减少、不可随时支取的同业存款增加有关。这是**公司披露的解释**，不应把整个现金流下降直接归因为终端卖酒回款恶化。仍需结合现金流科目、财务公司业务和销售回款进一步分析。\n\n### 第三步：演示估值，单独标明假设\n\n**假设股价1,200元，并非当前报价**只用2025年基本EPS 65.66作简化静态演示：PE≈1,200÷65.66＝18.28倍。这既不是实时TTM PE，也没有包含2026年新财报的信息。真实判断要更新日期、股本及盈利口径，并分析未来经营；18.28本身不能说明便宜或昂贵。\n\n### 第四步：写一张“未解决问题”清单\n\n收入结构是否变化？利润变化来自价格、销量、费用还是其他项目？现金流解释能否在附注中得到对应？当前价格包含何种预期？在没有回答这些问题前，完整且诚实的结论是：“已读懂这份报告的部分数据，尚不足以作出投资决定。”\n\n财报摘录只是阅读方法的演示，不是一份完整公司研究。不要将母公司利润表与合并报表混用，也不要把报告中的分红预案直接当作已经实施的最终每股金额。\n\n### 动手练习\n\n用表中约数计算2025年经营现金流/归母净利润。能否仅因比值低于1就认定经营恶化？\n\n**参考答案：** 615.22÷823.20≈0.747，即约0.75。不能仅据此判断；需看业务结构、收付时点和报告解释，也需注意归母利润与合并现金流口径并非完全同一范围。\n\n### 自测\n\n用假设股价1200除以2025年EPS所得18.28倍，应该标注为？\n\nA. 当前实时TTM市盈率\nB. 教学假设下的简化静态PE\nC. 官方合理估值\n\n**正确答案：B。** 股价是假设，利润属于固定年度，不能冒充实时估值或官方结论。\n\n- [贵州茅台2025年年度报告](https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf)\n\n\n## 第17章 风险与仓位：把失误控制在能承受的范围\n\n波动、永久损失、流动性和相关性\n\n学习目标：能把单项投资的损失换算成对整个账户的影响。\n\n### 风险不只有价格上下跳动\n\n**波动风险：**短期价格变化，让用钱时点不确定。**永久损失：**公司长期经营恶化、稀释、破产或极高价买入等，可能使本金难以恢复。**流动性风险：**想卖时没有足量买方。**集中风险：**多项持仓同时受一个因素影响。**行为风险：**因为恐惧、冲动或借钱而违反原计划。\n\n### 仓位是风险的放大器\n\n单项对组合的近似影响 ＝ 该项资金权重 × 该项收益率\n\n**同一笔亏损，不同账户后果**10,000元账户中，某只股票占1,000元，即10%仓位。它下跌30%，其他持仓不变，账户约损失300元，即3%。如果它占8,000元，相同跌幅会使账户损失2,400元，即24%。这只是静态情景，真实持仓可能同时下跌。\n\n### 分散看底层，而不只看数量\n\n五只同一行业股票可能同时受需求下降影响；三只跟踪同一指数的 ETF 可能高度重叠。分散能减少部分个别公司风险，却不能消除整个市场下跌。现金也不是没有代价，它面临购买力变化和机会成本，但能提供用钱时的确定性。\n\n### 用压力情境反推比例\n\n假设只是教学：一个组合只有股票ETF与现金，现金名义金额不变。若股票部分下跌40%，你希望这一情境下组合损失不超过10%，则股票权重应不高于10%÷40%＝25%。实际市场可能跌得更多、不同资产会一起跌；这个算式不是风险上限保证，也不是为你推荐25%配置。\n\n### 止损计划的边界\n\n交易型策略可能事先设置价格退出条件，但跳空、跌停、停牌和T+1会使实际损失超过计划。长期投资也需要退出原则，例如核心经营判断失效、产品目标变化、资金用途改变、集中度过高。仅凭买入成本高低决定卖不卖，会忽略当前资产是否还符合目标。\n\n“单笔最多亏500元”只有配合仓位和可执行退出方式才有意义。按计划止损距离算出的仓位，也不能把500元当绝对上限。对新手最可控的步骤是：不用杠杆、留足生活资金、把学习仓位做小、明确不可承受的情境。\n\n### 动手练习\n\n20,000元模拟账户，持有股票A 4,000元、股票ETF 6,000元、现金10,000元。A跌50%、ETF跌30%、现金不变，账户剩多少？\n\n**参考答案：** A剩2,000，ETF剩4,200，加现金10,000，总计16,200元；损失3,800元，即19%。按单项权重算：20%×−50%＋30%×−30%=−19%。\n\n### 自测\n\n有5只基金就一定充分分散吗？\n\nA. 一定，数量够了\nB. 不一定，要检查底层重叠与相关风险\nC. 只要来自不同基金公司就行\n\n**正确答案：B。** 不同包装可能持有相同的公司或行业。\n\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)\n\n\n## 第18章 组合与再平衡：先有比例，再有动作\n\n建立投资规则，处理上涨和下跌后的偏离\n\n学习目标：能计算组合权重，并区分再平衡与追涨杀跌。\n\n### 组合是一个整体决策\n\n你可以把资金按用途、期限和风险分配到不同资产。权益仓位内部可以包含宽基、行业或个股，但每一层都要算回**总资产的比例**。不要一边说个股只占“小仓位”，一边忽略所有小仓位加起来已经很大。\n\n**纯教学的60/40模拟组合**初始总额10,000元，其中普通宽基股票ETF 6,000元、现金4,000元。假设ETF上涨20%，现金不变，则总额11,200元，ETF权重7,200÷11,200≈64.29%。若目标仍是60%，对应ETF目标金额6,720元，需要卖出约480元转成现金。实际须考虑交易单位、费用和价格变化，未必能精确到目标。\n\n### 再平衡的目的\n\n再平衡使风险暴露回到事先认可的范围，而不是预测最高点和最低点。方法可以是固定检查日期，或预先设定偏离区间。频率太高可能增加费用，太低可能长期偏离目标。什么规则适合，取决于实际资产、成本和目标，没有统一最佳参数。\n\n### 优先考虑新资金\n\n继续上例，若有新增资金且用途允许，可以先向低于目标的部分投入，减少卖出和成本。但是“有新钱”不意味着必须买跌得最多的资产；应先确认目标配置和该资产的基本判断仍成立。\n\n### 债券基金并不是现金替代词\n\n债券价格受利率和信用风险影响：市场利率上升时，既有固定利息债券的价格通常承压，期限等因素影响幅度。信用恶化可能造成更大损失。货币基金、短债基金、长债基金与银行存款具有不同的波动、赎回与保障安排，不能在压力测试中都设为绝对不变。\n\n### 写一页投资规则\n\n- 目标与最早用钱日期：为了什么，什么时候需要。\n\n- 允许的资产：本阶段只模拟普通宽基ETF与现金，或明确其他范围。\n\n- 目标比例与容忍区间：先写规则，再观察行情。\n\n- 检查安排：例如每月固定一天查看，不因每天涨跌临时加频率。\n\n- 退出/修改条件：生活资金需求、风险承受变化、产品或判断失效。\n\n这里的60/40只用来练算术，并非对你适合比例的结论；真实配置需要个人完整财务信息。\n\n### 动手练习\n\n教学组合初始股票60、现金40，股票跌20%且现金不变。新股票占比是多少？重新回60%需把多少现金转入股票？\n\n**参考答案：** 股票48、现金40，总额88；股票占54.55%。目标股票88×60%=52.8，因此需转入4.8。是否实际执行，还需检查原规则、费用与新风险。\n\n### 自测\n\n按事先规则再平衡的主要目的是什么？\n\nA. 保证卖在最高点\nB. 恢复目标风险暴露\nC. 保证永远优于不交易\n\n**正确答案：B。** 它管理组合结构，不保证择时正确或提高收益。\n\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)\n- [澳大利亚Moneysmart：投资分散](https://moneysmart.gov.au/how-to-invest/investment-diversification)\n\n\n## 第19章 定投：平滑入场，也会持续亏损\n\n成本平均、现金流与比较方法\n\n学习目标：能算定投份额与成本，并知道定投无法修复什么问题。\n\n### 定投是执行方式，不是收益保证\n\n定投通常指按固定时间投入固定或规则化金额。价格较低时同样的钱能买更多份额，价格较高时买得更少。它有助于把执行与当下情绪分开，但如果资产长期衰退，或最后用钱时仍处低位，定投照样可能亏损。\n\n**三次各投入1,000元，忽略费用和交易单位**价格依次为10、8、10元，买入100、125、100份，总计325份，总投入3,000元，平均成本=3,000÷325≈9.23元。期末价格10元，市值3,250元，累计赚250元。\n\n若价格是10、8、6元，分别买100、125、166.67份，共391.67份，期末值约2,350元，仍亏650元。实际场内ETF受100份单位及佣金影响，余款可能暂存，不能完全照搬可买任意小数份额的演示。\n\n### 平均成本不是平均价格\n\n10、8、10的算术平均是9.33元，但定投成本是9.23元，因为低价买了更多份额。真正成本要用总投入除以总份额；考虑费用后，用实际总支出除以份额。\n\n### 定投与一次投入，取决于路径\n\n市场持续上涨时，更早投入的资金可能受益更多；先跌后涨时，分批可能获得较低成本。事先不知道路径，所以不能用一条事后挑出的曲线证明某种方式必胜。定投也要确认投入资金确实来自可承受风险的现金流，而不是为了补亏借钱。\n\n### 有追加资金时如何看回报\n\n“赚250÷投3000≈8.33%”可以描述累计盈亏比例，但三笔资金投入时间不同，它不是严格的年化收益。**资金加权收益**考虑各笔金额和日期，反映投资者实际资金体验；**时间加权收益**尽量剥离外部资金进出，常用于比较策略或产品。初学者至少记录每次日期、投入、份额和期末市值，别把新增本金当利润。\n\n### 什么时候复核定投\n\n定期检查现金流、用途、标的规则和集中风险。生活资金紧张、目标改变或产品不再符合原要求，可以暂停或修改；不是所有暂停都叫失败。不要因为刚涨了一周就翻倍扣款，也不要把“越跌越买”当作无需上限的机械命令。\n\n### 动手练习\n\n每次投入600元，价格依次为3、2、3元。忽略成本和份额单位，计算总份额、平均成本和期末市值。\n\n**参考答案：** 买入200、300、200份，总700份；投入1,800元，平均成本约2.5714元；期末市值2,100元，累计盈利300元。这个比例不直接等于年化回报。\n\n### 自测\n\n定投能保证什么？\n\nA. 长期一定不亏\nB. 持续下跌时自动产生利润\nC. 按既定规则分批投入，但不能保证回报\n\n**正确答案：C。** 投入方式改变成本路径，不改变资产可能持续下跌的事实。\n\n- [Investor.gov：投资入门](https://www.investor.gov/introduction-investing)\n\n\n## 第20章 行为与信息：不被涨跌牵着走\n\n追涨、回本执念、幸存者偏差与骗局\n\n学习目标：能识别常见决策陷阱，并用记录替代情绪化操作。\n\n### 为什么知道道理，还是容易做错\n\n**害怕错过：**看别人赚钱后追入，却没有原始判断。**损失厌恶：**不愿承认亏损，导致不断加仓。**锚定：**只盯买入价，觉得回到成本才算结束。**确认偏误：**买后只看支持自己的消息。认识名字不够，要给每个陷阱安排一个具体动作。\n\n**把“回本再卖”翻译成今天的问题**小林20元买入的公司跌到12元。是否卖出，不取决于市场是否愿意“还给他8元”，而取决于当前经营、价格、风险、替代选择和资金用途。如果今天没有这只股票，他还会按同样理由用这笔钱买它吗？若不愿意，至少需要重新审查继续持有的依据。\n\n### 建立一个操作前暂停清单\n\n写下触发消息和来源、当前可验证事实、反对理由、资金影响和预定动作。若原计划没有这笔交易，先做纸面演练，不用行情催促自己。暂停多久按情境设定，其目的只是打断冲动，不是用一个固定时长保证正确。\n\n### 警惕被筛选过的“成功经验”\n\n只展示活下来的牛股，忽略退市和长期亏损者，是幸存者偏差。用今天知道的赢家回到过去假装能提前选中，是事后偏差。策略测试若偷用了当时未公布的财报，就是未来信息泄漏。收益截图还可能省略本金变化、费用或最大回撤。\n\n### 不用复杂知识也能识别的危险信号\n\n- 保证本金、承诺固定高收益，却要求承担股票风险。\n\n- 要求把钱转到个人账户，或下载无法核实来源的交易软件。\n\n- 老师带单、先赚小钱再要求更大入金、以解冻/税费名义继续转款。\n\n- 要求透露密码、验证码，或以远程控制代替本人操作。\n\n遇到疑似骗局，不继续转款，保留聊天和转账记录，通过已知官方渠道核实、联系相关机构。消息即使来自熟人，也不能替代机构身份和产品核验。\n\n### 结果与过程分开复盘\n\n遵守合理流程仍可能亏损；胡乱买入也可能短期赚钱。每次复盘分别记“过程是否合格”和“结果如何”，不要用一次盈利给危险行为盖章。学习期的目标是减少无法解释的操作，而不是保持每笔都赢。\n\n### 动手练习\n\n朋友只给你展示三笔盈利交易，说“从不亏”。你应追问哪些记录？\n\n**参考答案：** 完整期间的全部交易、资金转入转出、持仓浮亏、费用、最大回撤、失败与退出案例，以及真实可核验的账户记录。三笔成功交易无法证明策略可靠。\n\n### 自测\n\n一笔没有计划的追涨交易赚了钱，说明？\n\nA. 方法已被证明有效\nB. 只说明这一次结果赚钱，不能证明过程可靠\nC. 应该立刻加杠杆复制\n\n**正确答案：B。** 结果受运气与环境影响，需要完整样本和风险评价。\n\n- [深圳证监局：警惕非法荐股骗局（2026）](https://www.csrc.gov.cn/shenzhen/c105615/c7638512/content.shtml)\n\n\n## 第21章 公告与权益：遇到新闻先查哪一页\n\n分红税、送转、减持、停牌与退市\n\n学习目标：能把公告转成可核对的问题，而不是简单贴“利好/利空”标签。\n\n### 信息入口按可靠性排序\n\n优先看交易所披露、公司正式公告、基金合同和管理人公告。媒体报道用于发现线索，社交平台用于提出问题，都不能替代原始文件。打开文件后先确认证券代码、公告日期、是否更正、预案还是已实施，以及是否只是风险提示。\n\n### 现金分红，三个日期\n\n**股权登记日**确定本次权益登记；**除权除息日**作相应价格基准调整；**发放日**按安排到账。具体以实施公告为准，不把董事会预案当成已经到账的现金。想在除息前“买入拿分红再卖出”并不能凭空获利，因为价格调整和税费会影响总资产。\n\n对普通个人从公开发行和转让市场取得的上市公司股票，现行股息红利差别化政策下，持股不超过1个月的实际税负为20%；超过1个月至1年（含）为10%；超过1年暂免。持有1年以内通常在转让时按最终持有期补扣，因此分红当时没扣税不等于免税。该口径不要直接套给ETF、港股或特殊股份。\n\n**税费演示**100股，每股分红0.50元，税前50元。若适用20%税负，税额10元，净分红40元。若持有期对应10%，税额5元。实际由账户结算处理，记录原始交易和分红信息，不自行用买卖顺序猜扣税。\n\n### 送股和转增，不是账户财富翻倍\n\n简化“每10股转增10股”：原100股变200股，原参考价格20元调整到约10元，在没有其他变化时总价值仍约2,000元。送股、转增具体税务和来源可能不同，不能因为都增加股数就视为完全同一件事。\n\n### 其他公告的实用读法\n\n- **减持：**谁、多少比例、原因、时间安排；计划不等于已成交。\n\n- **回购：**金额、价格区间、用途、实施进度与资金来源；公告不保证全部执行。\n\n- **重大合同：**合同总额不是当期利润；看履行条件、收入确认、成本和回款。\n\n- **停牌/风险警示：**看原因和恢复条件；暂停交易不暂停经济风险。\n\n- **退市风险：**退出主板交易并不保证有顺畅的后续退出渠道，本金可能遭严重损失；不要把ST当作低价机会。\n\n实际动作只需三步：存原始公告 → 提取会改变现金流或交易权利的条款 → 对照自己的原计划。如果无法判断，就记录问题并暂停新增暴露。\n\n### 动手练习\n\n公告说“拟回购不超过2亿元”，你能把2亿元当作明天必然进场买盘吗？\n\n**参考答案：** 不能。“拟”和“不超过”代表计划及上限；需看下限、有效期、条件、资金来源及实际进展。不能据此保证短期股价。\n\n### 自测\n\n分红当天未扣红利税，意味着？\n\nA. 一定免税\nB. 可能需在卖出时按持有期补扣\nC. 券商一定漏扣\n\n**正确答案：B。** 普通个人股票红利税可能按最终持有期限后续处理。\n\n- [财税〔2015〕101号：股息红利差别化个人所得税](https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf)\n- [上交所：公司公告查询（600519示例）](https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=600519)\n\n\n## 第22章 完整案例 A：从目标到 ETF 模拟订单\n\n把指数、产品、费用和风险串起来\n\n学习目标：能写出一份可复核的ETF决策单，包括不买入的理由。\n\n### 任务与完整数据卡（全部虚构）\n\n小林有10,000元模拟资金，生活备用金在外。他只想练习获得分散的境内股票暴露，不追逐单一行业。为完成本次作业，先限定ETF计划投入不超过2,000元，剩余模拟现金保留。这是教学任务约束，不是对真实资金比例的建议。\n\n候选甲：跟踪宽基指数，管理+托管年费0.20%，当前参考净值2.000，卖一2.002、足量；候选乙：同指数，年费0.15%，参考净值2.000，卖一2.040、足量。两者其他条件先假设相当，券商佣金均为每笔最低5元。\n\n### 步骤一：解释买什么\n\n先说明该宽基覆盖范围、前十大权重和行业分布。数据卡未提供真实成份，所以这一步只能写“需补充核实”；不能拿“宽基”二字跳过集中风险。真实选品时要从指数方案和产品资料取数。本例其余计算可在不补资料的情况下完成。\n\n### 步骤二：比较当前交易摩擦\n\n甲参考溢价2.002÷2−1=0.10%；乙2.040÷2−1=2%。乙便宜0.05个百分点的年费，对2,000元一年约为1元；它现在多出的溢价约1.9个百分点，远大于这项年费差。时点估值准确与否仍须确认。本例倾向先研究甲，或等待更合理的执行条件，而不是直接追乙。\n\n### 步骤三：计算可申报数量\n\n假设按2.002买，100份为单位、佣金5元，2,000元含费预算最多可买900份：900×2.002＋5＝**1,806.80元**。1,000份需2,007元，超预算。交易后模拟现金=10,000−1,806.80＝8,193.20元。\n\n### 步骤四：把坏情境写在前面\n\n若买入后市场价格跌30%且卖出，价格为1.4014元，900份卖出毛额1,261.26元，另假设卖出佣金5元，净回款1,256.26元。损失550.54元，约占整个初始模拟账户5.51%。实际成交价格必须符合报价单位，此处为连续比例压力计算，真实损失可能更大。\n\n### 步骤五：订单与后续\n\n确认T+1、交易状态、盘口时点、限价类型 → 只提交一笔900份订单 → 成交后查均价与费用 → 记录实际溢价 → 到约定检查日复核产品与资金用途。行情突然上涨并不自动允许突破预算。\n\n**合格结论也可以是“暂不下单”。**本案例缺少完整成份、规模和跟踪记录，能算对订单不等于信息已经充分。课程故意保留这一缺口，让你练习把“已知”和“还不知道”写开。\n\n### 动手练习\n\n若预算改为1,500元，其余条件不变，按2.002元和每笔佣金5元，最多可买多少份？\n\n**参考答案：** 按100份向下取整：(1500−5)÷2.002≈746.75，最多700份。总支出700×2.002+5=1,406.40元。不能买800份，也不能用746.75份作为场内标准订单。\n\n### 自测\n\n本例年费更低的乙为何不一定更合适？\n\nA. 费率没有作用\nB. 当前溢价和执行成本可能大于少付的年费\nC. ETF净值必须都是1元\n\n**正确答案：B。** 持有成本要与买入溢价、价差、佣金及持有期一起看。\n\n- [深交所：场内基金投资交易指南](https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html)\n- [上交所ETF课堂：ETF优势与交易费用](https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml)\n- [深交所交易规则（2026年修订）全文](https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf)\n\n\n## 第23章 完整案例 B：为一家企业写判断，而非喊目标价\n\n从经营数据到三种情景与反证\n\n学习目标：能用同一套数据建立个股分析，并明确判断失效条件。\n\n### 晨光早餐公司的数据卡（虚构）\n\n总股数100万股；去年收入1,000万元、净利润100万元；今年收入1,200万元、净利润120万元、扣非净利润110万元、经营现金流80万元；年末现金200万元、有息债务150万元、净资产600万元。应收账款从100万元升至180万元。假设股价18元，无其他股本变化。\n\n### 步骤一：先计算当前状态\n\n收入与净利润均增长20%；当年EPS=120万÷100万=1.20元；静态PE=18÷1.2=15倍；每股净资产6元，PB=3倍。经营现金流/净利润=80÷120≈0.67。应收增长80%，明显快于收入的20%，值得进一步追查。\n\n### 步骤二：判断赚钱质量\n\n扣非利润低于净利润10万元，需知道非经常项目是什么。应收增加可能来自拓展企业团餐赊销，也可能是回款变慢；应检查客户账期、坏账准备、后续收款、客户集中度。现金200万大于有息债务150万，只能算出简化净现金50万，不能忽略受限现金、其他负债、到期日和新增支出。\n\n### 步骤三：做可检验的情景\n\n下一年假设 | EPS | 假设PE | 情景价格 | 相对18元，不含分红 | \n悲观：成本与回款承压 | 0.80 | 10 | 8元 | −55.56% | \n基准：利润略增 | 1.30 | 14 | 18.20元 | +1.11% | \n乐观：扩张顺利 | 1.60 | 18 | 28.80元 | +60% | \n\n三种情景没有赋予可靠概率，不能直接取平均当“合理价”。它们的用途是暴露假设：只有乐观情境带来很大上涨，而悲观损失可能明显。倍数也是假设，不是行业标准；若缺乏比较依据，应降低对估值结论的信心。\n\n### 步骤四：写反证与行动条件\n\n原判断：“扩张能产生可持续现金利润”。反证包括：新增客户长期不付款、毛利率持续下滑且无法解释、债务到期压力增加、管理层反复变更披露。如果这些情况出现，应重新评估，而不是因为价格低了就自动补仓。\n\n### 步骤五：形成合格的结论\n\n“经营规模增长，但现金回收与应收变化尚未解释；现价在基准情景下空间有限。先列观察，不新增个股风险；等待回款和利润质量证据。”这比“预计涨到28.8元”更完整。若未来信息变好，也要重新检查价格是否已反映改善。\n\n本案例教的是把事实、假设、证据与行动相连；不要求预测精准，也不要求必须买入。没有研究优势、时间或完整信息时，选择不参与个股本身就是有效决策。\n\n### 动手练习\n\n若今年净利润120万元中有40万元来自一次性资产出售，用18元和报告EPS算的15倍PE可能有什么问题？\n\n**参考答案：** 一次性收益可能抬高分母，使PE显得较低。若教学简化剔除40万元，持续利润80万元、EPS0.80元，对应22.5倍；实际扣非和税务口径需查报告，不能直接把该简化值当官方指标。\n\n### 自测\n\n三种情景价格8、18.2、28.8元，能直接把平均数当公允价吗？\n\nA. 能，平均数最客观\nB. 不能，概率与假设缺乏依据\nC. 只取最高价\n\n**正确答案：B。** 情景分析展示敏感性，没有可靠概率和现金流依据就不是估值定论。\n\n\n\n\n## 第24章 结业：写下你自己的投资操作手册\n\n综合任务、评分标准与课程后的固定流程\n\n学习目标：能完成一份包含目标、证据、费用、风险和复盘的模拟决策。\n\n### 你要交付的是一份能被别人复核的决策\n\n选第22章ETF案例或第23章公司案例，使用本课程已给数据完成下面任务。无需真实开户或购买；真实材料只有在练习“资料检索”时才另外核对。交易规则与产品资料会更新，未来真实决策前的核验是操作的一部分，不是本课程基础讲解的缺页。\n\n### 综合作业：六个部分，共100分\n\n- **目标与边界20分：**写资金用途、最早用钱日期、允许风险、是否真实/模拟。四项各5分。\n\n- **产品与证据20分：**解释买的是什么、底层风险、资料日期与出处、至少一项未知。四项各5分。\n\n- **交易与费用20分：**代码/类别核对、申报规则、含费预算、净回报计算。四项各5分。\n\n- **坏情境20分：**人民币损失10分、占总账户比例5分、无法及时退出的可能5分。\n\n- **行动条件10分：**写买入/不买入理由5分，判断失效与复核条件5分。\n\n- **复盘记录10分：**区分过程与结果5分，给出下次具体改进5分。\n\n### 参考提交：ETF案例摘要\n\n“使用10,000元模拟资金；候选甲跟踪宽基，暂不涉及杠杆。净值与报价是案例固定假设，实际成份与跟踪记录缺失。2,000元含费预算下，2.002元限价最多900份，总成本1,806.80元。若价格跌30%并按假设卖出费5元退出，损失550.54元，约占账户5.51%；实际可能受T+1或流动性影响。因资料尚不充分，先完成纸面订单，不执行真实买入。复核时检查成份集中度、跟踪情况、报价与资金用途。”\n\n### 通过标准\n\n建议教学合格线为80分，并且三个关键错误必须全部纠正：把生活刚需钱当投资本金；把T+1、费用或保证成交理解错；把未来收益或情景价格当保证。这个分数只用于学习自检，不是金融资格或实盘适当性认证。\n\n### 课程结束后的轻量流程\n\n- **每次行动前：**确认资金用途、依据、总仓位、费用和退出条件。\n\n- **每月一次：**核对总资产、投入/转出、持仓权重、费用和偏离原计划的交易。\n\n- **新财报或重大公告出现时：**更新判断，只改有新证据支持的部分。\n\n- **生活发生变化时：**先调整流动性与风险承受，再考虑投资计划。\n\n- **发现不懂的产品：**先研究其收益来源、最坏情境和退出方式，不因热门而越级。\n\n### 自我讲解，是最后一关\n\n合上笔记，用普通话解释：股票与ETF是什么、为何不保本、价格为什么不同于价值、一次交易如何成交和收费、如何判断组合能否承受下跌。若某个词只能复述定义，却不能举例，就回到对应章节再做一次题。\n\n你已经完成从资金安排、交易操作、ETF选择、财报估值到风险管理的基础闭环。往后最值得积累的是稳定的记录和可核验的判断，而不是不断增加指标或频繁找“必胜方法”。\n\n### 动手练习\n\n完成上面的综合作业，并给每个分项打分；把尚缺的事实明确写出来。\n\n**参考答案：** 可对照本章ETF参考提交，也可用第23章数据提交“不买入”的公司分析。评分看依据、计算和边界是否清楚，不因最终选择买入还是不买入而加减分。低于80分或存在关键错误时，回到对应章节补练。\n\n### 自测\n\n这门课的结业目标是？\n\nA. 保证下个月盈利\nB. 能解释、计算并复核一份有风险边界的决策\nC. 学会预测明天涨跌\n\n**正确答案：B。** 基础能力是可检查的流程，不是未来收益的承诺。\n\n\n\n\n## 概念词典\n\n- **股权：** 对公司的一部分所有权，普通股股东承担剩余风险。（第2章）\n- **股价：** 每股的市场交易价格，不能单独判断贵便宜。（第2章）\n- **市值：** 股价乘股数；总市值与流通市值的股数口径不同。（第2章）\n- **分红：** 公司或基金按规则向持有人分配现金等权益，不是凭空增值。（第2章）\n- **除息：** 现金分红引起的价格参考基准调整，实际成交仍受市场影响。（第21章）\n- **股权登记日：** 确定本次权益登记的日期，以实施公告为准。（第21章）\n- **送转：** 送股、转增等增加股份数量的安排，不自动增加总财富。（第21章）\n- **IPO：** 首次公开发行股票；新股上市有特殊交易阶段和风险。（第6章）\n- **T+1：** 此处指普通A股/股票ETF当天新买部分通常下一交易日才能卖。（第6章）\n- **交易日：** 交易所开市的日期，不等于所有工作日或自然日。（第6章）\n- **涨跌停：** 交易价格的日内允许边界，不保证能成交或限制累计亏损。（第6章）\n- **ST / *ST：** 相应风险警示标记，应查看具体风险原因和板块规则。（第6章）\n- **停牌：** 证券暂停交易，持仓风险并不会因此消失。（第21章）\n- **退市：** 证券退出相应上市交易安排，退出流动性与本金都面临风险。（第21章）\n- **一手：** 常用交易数量单位；普通主板股票常为100股，不适用于所有板块。（第6章）\n- **买一 / 卖一：** 当前最高买价与最低卖价，数量和报价会变化。（第7章）\n- **限价单：** 限定买入最高价或卖出最低价，不保证成交。（第7章）\n- **市价类订单：** 按具体类型与保护规则追求匹配，实际执行价格和数量仍不确定。（第7章）\n- **集合竞价：** 把一个时段的申报集中按规则确定成交价格。（第6章）\n- **连续竞价：** 在相应时段随申报持续撮合交易。（第6章）\n- **滑点：** 实际执行价格相对原先预期价格的偏离。（第7章）\n- **价差：** 买一与卖一之间的差额，可能构成交易摩擦。（第7章）\n- **佣金：** 券商按合同收取的交易服务费用，要看费率、最低值和包含项目。（第8章）\n- **万2.5：** 万分之二点五，等于0.025%，计算时用0.00025。（第8章）\n- **交割单：** 核对成交和费用资金发生额的交易记录。（第8章）\n- **可用 / 可取：** 可用于证券交易与可转出银行的资金口径，并不相同。（第5章）\n- **K线：** 用开盘、最高、最低、收盘四个价格概括选定期间的图形。（第9章）\n- **均线：** 对过去价格做平均和平滑，不是未来价格保证。（第9章）\n- **复权：** 为分红送转等调整历史价格序列的方法，显示值可能不是原成交价。（第9章）\n- **换手率：** 成交数量相对流通股数等指定分母的比例，需核对口径。（第9章）\n- **指数：** 按选样和加权规则汇总一篮子证券表现的计算结果。（第10章）\n- **宽基：** 覆盖相对广泛证券和行业的指数类别，仍有市场与集中风险。（第10章）\n- **全收益指数：** 按规则纳入分红再投资的指数口径。（第10章）\n- **ETF：** 在交易所买卖的开放式基金结构；风险由底层资产及产品设计决定。（第11章）\n- **ETF联接：** 主要投资目标ETF的基金，申赎和收费与场内买卖不同。（第12章）\n- **净值NAV：** 基金净资产除以份额数得到的单位价值。（第11章）\n- **IOPV：** 盘中基金参考净值估算，不保证可成交或无误差。（第11章）\n- **溢价 / 折价：** 市场价高于/低于可比参考净值，注意估值时点。（第11章）\n- **申购赎回：** 按基金规则与基金交换资金或证券及份额，不等同二级市场买卖。（第11章）\n- **跟踪差异：** 基金区间回报相对基准的差值，需确认定义的正负方向。（第12章）\n- **跟踪误差：** 各期基金与基准回报差的波动指标，和累计落后多少不同。（第12章）\n- **营业收入：** 企业经营确认的销售等收入，不等于当期收回的现金。（第14章）\n- **毛利率：** 收入扣营业成本后占收入的比例，反映产品与直接成本关系。（第14章）\n- **归母净利润：** 归属于母公司股东的净利润，与集团总净利润区分。（第14章）\n- **扣非利润：** 按规则剔除非经常损益后的利润，仍需检查质量。（第14章）\n- **经营现金流：** 经营活动产生的现金净流入，需解释与利润的差异。（第14章）\n- **应收账款：** 已确认销售但尚待客户付款的款项，存在回收风险。（第14章）\n- **净资产：** 会计资产减负债后的权益，不等于可兑现市值。（第14章）\n- **ROE：** 净资产收益率，需确认加权口径，也会受杠杆影响。（第14章）\n- **EPS：** 每股收益，注意基本/稀释及年度/滚动口径。（第15章）\n- **PE：** 市盈率，价格相对每股利润；不是承诺回本年数。（第15章）\n- **PB：** 市净率，价格相对每股净资产；需结合资产质量。（第15章）\n- **TTM：** 最近滚动12个月，用于说明财务指标覆盖的期间。（第15章）\n- **股息率：** 特定期间每股分红除以股价，历史值不保证未来。（第15章）\n- **估值：** 根据盈利、资产、现金流和风险等判断价格要求了什么条件。（第15章）\n- **同比 / 环比：** 与上年相同期间/与上一相邻期间比较，须注意季节性。（第14章）\n- **仓位：** 某项或某类资产占所选总资产的比例，分母必须说清楚。（第17章）\n- **回撤：** 从此前高点下降的幅度，与相对初始本金的亏损不同。（第4章）\n- **再平衡：** 使组合回到预先设定的风险结构，不是预测行情。（第18章）\n- **定投：** 按时间或规则分批投入，不能保证正回报。（第19章）\n- **复利：** 收益继续参与后续变化的复合过程，也会复合亏损。（第4章）\n- **流动性：** 能否以较小价格影响完成所需规模交易的能力。（第17章）\n- **相关性：** 不同资产变动的共同程度，会随环境变化。（第17章）\n- **安全余量：** 给估计错误留出的空间，不代表任何价格绝对安全。（第15章）\n- **幸存者偏差：** 只看留下来的成功样本，忽略失败与消失样本。（第20章）\n- **反证：** 会使原判断失效的可观察事实，用于避免只看有利证据。（第23章）\n\n## 资料与编写方法\n\n按用户要求拉取GitHub上的 [curriculum-designer](https://github.com/weihaoqu/gemini-curriculum-designer)，借鉴分层教学、练习和测评结构；本讲义为原创解释与案例，具体规则核对以下来源。\n\n- [上交所交易规则（2026年修订）](https://www.sse.com.cn/lawandrules/sselawsrules2025/stocks/exchange/c/c_20260424_10816482.shtml)：现行规则主页面；2026-07-06起施行，核对股票、ETF交易与盘后安排。\n- [深交所交易规则（2026年修订）全文](https://docs.static.szse.cn/www/lawrules/rule/trade/current/W020260424690713155663.pdf)：交易时段、申报单位、回转交易、涨跌幅与盘后交易；重点第2.3、3.1–3.6节。\n- [上交所：股票投资一件事](https://one.sse.com.cn/onething/gptz/)：股票交易服务、时段与费用口径；也用于交叉核对2026规则。\n- [深交所：2026交易规则技术准备通知](https://investor.szse.cn/marketServices/technicalservice/notice/t20260424_620199.html)：明确盘后固定价格交易扩展至全部A股及ETF。\n- [深交所：首批主动ETF正式获批](https://www.szse.cn/aboutus/trends/news/t20261019_623374.html)：2026-10-19公告；“获批”并不等同于“已上市”，ETF不应一概定义为被动基金。\n- [财政部、税务总局：证券交易印花税减半征收](https://jiangsu.chinatax.gov.cn/art/2023/8/28/art_8349_432258.html)：2023-08-28起实施的减半政策，结合现行股票费用页核对有效税率。\n- [上交所收费一览表](https://www.sse.com.cn/services/tradingservice/charge/ssecharge/)：收费与代收项目核对入口；个人佣金合同须另外确认，不能重复计费。\n- [上交所ETF课堂：ETF优势与交易费用](https://etf.sse.com.cn/fund/learning/knowledge/c/5704298.shtml)：ETF二级交易印花税等；其中交易时间若与2026规则冲突，以新版规则为准。\n- [证监会深圳监管局：基金手续费](https://www.csrc.gov.cn/shenzhen/c105614/c1575407/content.shtml)：基金管理费、托管费等计提方式，具体费率以相应基金合同为准。\n- [深交所：场内基金投资交易指南](https://investor.szse.cn/warning/activities/fundIntroduction/t20210104_584079.html)：市场价、净值与溢价机制；旧文中的时间性细节与2026规则分开使用。\n- [上证50ETF招募说明书（2026更新示例）](https://www.sse.com.cn/disclosure/fund/announcement/c/new/2026-03-23/510050_20260323_Y5MO.pdf)：用于核对IOPV参考性质和误差风险，不作为推荐产品。\n- [深交所：ETF权益分派与除息](https://investor.szse.cn/knowledge/fund/trade/t20191106_571787.html)：基金分红与除息处理。\n- [财税〔2015〕101号：股息红利差别化个人所得税](https://shanghai.chinatax.gov.cn/sjtax/ztzl/yshj/ldjj/202401/P020240130515649964221.pdf)：普通个人上市股票红利持股期税负与后续补扣的依据，不能泛化到所有产品。\n- [中证指数：沪深300指数编制方案](https://csi-web-dev.oss-cn-shanghai-finance-1-pub.aliyuncs.com/static/html/csindex/public/uploads/indices/detail/files/zh_CN/000300_Index_Methodology_cn.pdf)：指数公司官方文件托管：指数目标、样本和加权规则。正式投资时应核对发布方最新版本。\n- [贵州茅台2025年年度报告](https://big5.sse.com.cn/site/cht/www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/600519_20260417_9QS4.pdf)：第6页主要财务数据，第9–10页变动说明；报告期2025年，披露于2026年，不是实时数据。\n- [上交所：公司公告查询（600519示例）](https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=600519)：示范如何区分预案、实施和更正公告；不构成荐股。\n- [上交所：股票投资账户与交易服务](https://one.sse.com.cn/onething/gptz/)：账户及交易服务入门，具体办理依本人券商官方流程。\n- [Investor.gov：投资入门](https://www.investor.gov/introduction-investing)：股权、回报、复利等通用概念；美国账户和税制不用于A股操作。\n- [Investor.gov：资产配置与分散](https://www.investor.gov/introduction-investing/getting-started/asset-allocation)：通用风险与分散原则，不将其转化为针对个人的固定比例建议。\n- [澳大利亚Moneysmart：投资分散](https://moneysmart.gov.au/how-to-invest/investment-diversification)：通用的跨资产分散、利率与债券风险概念，不套用当地税制。\n- [深圳证监局：警惕非法荐股骗局（2026）](https://www.csrc.gov.cn/shenzhen/c105615/c7638512/content.shtml)：2026-06-11风险提示：核验机构资质，识别AI荐股、假冒App与私人转账陷阱。\n- [北京证券交易所交易规则（2026）](https://www.bse.cn/jygl_list/200028217.html)：第3.3.11条：一般价格涨跌幅限制30%；本课程不展开北交所实操。"};document.addEventListener('click',event=>{const a=event.target.closest('a'
